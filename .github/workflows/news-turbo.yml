name: BOT NEWS turbo (bypass limit Cloudflare)

# Jalan di GitHub Actions (server GitHub, GRATIS), bukan di Cloudflare Worker --
# jadi TIDAK kena limit "50 subrequest/invocation" Cloudflare Free yang bikin
# proses banyak artikel sekaligus gagal ("Too many subrequests"). Ini jalur
# TAMBAHAN, bukan pengganti: Cron Trigger Cloudflare & cron eksternal
# (cron-job.org) yang sudah ada tetap jalan seperti biasa sbg jaring pengaman.
on:
  # SENGAJA TIDAK pakai `schedule:` bawaan GitHub di sini lagi -- jadwal itu
  # dulu jalan BERSAMAAN dgn pemicu eksternal (cron-job.org -> /__cron?job=
  # githubnews -> dispatchNewsTurbo -> workflow_dispatch), jadi workflow ini
  # kepicu 2x lebih sering dari niatnya (kadang cuma berjarak 1 menit, lihat
  # riwayat run). Tiap tick yang lolos PACING (lihat gh-turbo-run.ts) tetap
  # bikin request baru ke Blogger API (refresh OAuth + create post) -- dobel
  # pemicu ini yang bikin kuota harian Blogger API kepakai jauh lebih cepat
  # drpd perkiraan & akhirnya kena 429 "Resource has been exhausted" berjam²
  # nyangkut. `schedule:` GitHub sendiri sudah lama diketahui tidak reliable
  # (lihat commit 53cbbbc) -- jadi cabut yang ini, biarkan HANYA jalur
  # eksternal (cron-job.org) yang memicu otomatis, workflow_dispatch manual
  # (tombol panel) tetap jalan seperti biasa di bawah.
  workflow_dispatch: # tombol "Run workflow" manual di tab Actions, JUGA dipicu tombol panel
    inputs:
      count:
        description: "Jumlah artikel -- kosongkan = ikut Artikel/Proses di Setting & jalan sampai antrean habis"
        required: false
        type: string
      target:
        description: "Kirim ke mana"
        required: false
        type: choice
        default: both
        options: [both, blogger, site]
      full:
        description: "Habiskan SELURUH antrean (sampai 12 putaran) -- HANYA dipicu tombol panel saat kolom Jumlah dikosongkan. Tick otomatis (cron-job.org/jadwal) TIDAK PERNAH mengisi ini -- default 1 putaran saja per tick."
        required: false
        type: string

concurrency:
  group: bot-news-turbo
  cancel-in-progress: false # jangan tabrak run yang masih jalan, antre saja

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (hanya yang dibutuhkan script ini)
        working-directory: panel-worker
        run: npm install --no-save @libsql/client tsx
      - name: Proses artikel ke Blogger & Situs Sendiri
        working-directory: panel-worker
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          TURSO_SPARE_URL: ${{ secrets.TURSO_SPARE_URL }}
          TURSO_SPARE_TOKEN: ${{ secrets.TURSO_SPARE_TOKEN }}
          RUN_COUNT: ${{ github.event.inputs.count }}
          RUN_TARGET: ${{ github.event.inputs.target }}
          FULL_DRAIN: ${{ github.event.inputs.full }}
        run: npx tsx scripts/gh-turbo-run.ts
