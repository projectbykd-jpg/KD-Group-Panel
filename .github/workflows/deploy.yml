name: Deploy panel-worker ke Cloudflare

# Deploy TANPA komputer. Pemilik cukup punya HP:
#  - Otomatis tiap ada perubahan kode panel-worker yang masuk ke branch main.
#  - Atau manual lewat tombol "Run workflow" di tab Actions (juga bisa dipicu
#    dari sesi Claude Code lewat GitHub API).
#
# SYARAT SEKALI SETUP: simpan API token Cloudflare sebagai repository secret
# bernama CLOUDFLARE_API_TOKEN (Settings > Secrets and variables > Actions).
# Token dibuat di dash.cloudflare.com > My Profile > API Tokens, pakai template
# "Edit Cloudflare Workers". Tokennya TIDAK pernah tampil di log run ini --
# GitHub menyensornya otomatis.
on:
  push:
    branches: [main]
    paths:
      # Hanya deploy kalau yang berubah memang bagian Worker-nya. Perubahan
      # dokumentasi/tema Blogger/workflow lain tidak ikut memicu deploy.
      - "panel-worker/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # membaca deskripsi PR untuk pesan Telegram "update terpasang"

concurrency:
  # Jangan pernah dua deploy jalan bersamaan; yang lebih baru menang, yang lama
  # dibatalkan (tidak ada gunanya menyelesaikan deploy versi usang).
  group: deploy-panel-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: panel-worker
        # `npm ci` = pasang PERSIS versi di package-lock.json (build bisa diulang,
        # tidak ada versi yang bergeser diam-diam antar deploy).
        run: npm ci

      # Gerbang yang SAMA dengan check.yml (PR): typecheck src + test, unit test,
      # build UI, dan cek nama fungsi tak terdefinisi di JavaScript panel. Dulu
      # di sini cuma tsc + test, jadi `tsc -p test` dan cek UI baru ketahuan
      # kalau seseorang lupa menjalankannya sebelum merge.
      - name: Cek lengkap (typecheck + test + build UI) -- batal deploy kalau gagal
        working-directory: panel-worker
        run: npm run check

      - name: Build UI + deploy ke Cloudflare
        working-directory: panel-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRON_KEY: ${{ secrets.CRON_KEY }}
        # `npm run deploy` sudah menjalankan build-ui (lewat predeploy) lalu
        # wrangler deploy. CRON_KEY ikut diunggah sebagai SECRET Worker lewat
        # --secrets-file (satu versi atomik: tidak ada jeda di mana /__cron
        # kehilangan kuncinya). Nilainya tidak pernah tampil di log.
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN belum diisi di repo ini."
            echo "Buka: Settings > Secrets and variables > Actions > New repository secret"
            echo "Nama: CLOUDFLARE_API_TOKEN -- Isi: token dari dash.cloudflare.com (template 'Edit Cloudflare Workers')"
            exit 1
          fi
          if [ -z "${CRON_KEY}" ]; then
            echo "::error::Secret CRON_KEY belum diisi di repo ini -- deploy dibatalkan supaya cron (auto-post, invest, news) tidak mati."
            echo "Buka: Settings > Secrets and variables > Actions > New repository secret"
            echo "Nama: CRON_KEY -- Isi: string acak panjang (min. 32 karakter). Pakai nilai yang SAMA di URL cron-job.org."
            exit 1
          fi
          secrets_file="${RUNNER_TEMP}/worker-secrets.json"
          jq -n --arg k "${CRON_KEY}" '{CRON_KEY: $k}' > "${secrets_file}"
          npm run deploy -- --secrets-file "${secrets_file}"
          rm -f "${secrets_file}"

      # Kabari grup Telegram admin (secret yang sama dengan Penjaga panel) setiap update selesai / gagal dipasang,
      # supaya pemilik tahu PERUBAHAN APA yang baru aktif tanpa membuka GitHub. Tanpa secret: dilewati diam-diam.
      - name: Kabari Telegram (update terpasang / gagal)
        if: always()
        env:
          RAW_TG_TOKEN: ${{ secrets.TG_ALERT_TOKEN }}
          RAW_TG_CHAT: ${{ secrets.TG_ALERT_CHAT }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TG_TOKEN=$(printf '%s' "$RAW_TG_TOKEN" | tr -d ' \r\n\t')
          TG_CHAT=$(printf '%s' "$RAW_TG_CHAT" | tr -d ' \r\n\t')
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || { echo "Secret Telegram belum diisi -> dilewati."; exit 0; }
          [ "$JOB_STATUS" = "cancelled" ] && { echo "Dibatalkan (diganti deploy yang lebih baru) -> tidak dikabarkan."; exit 0; }
          title=$(printf '%s\n' "$COMMIT_MSG" | head -n 1 | sed -E 's/ \(#[0-9]+\)$//' | cut -c1-200)
          # poin perubahan diambil dari deskripsi PR yang memuat commit ini (isi commit squash ikut memuat riwayat lama ->
          # menyesatkan). Baris daftar tingkat atas, tanpa markdown, maks 8. Tanpa PR (deploy manual) -> judul saja.
          body=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" --jq '.[0].body // ""' 2>/dev/null || true)
          points=$(printf '%s\n' "$body" | grep -E '^[-*] ' | grep -viE 'co-authored|claude-session|generated with' | sed -E 's/^[-*] +/• /; s/\*\*//g; s/`//g' | head -n 8 | cut -c1-200)
          if [ "$JOB_STATUS" = "success" ]; then
            text="🚀 Update panel TERPASANG
          ${title:-Update panel}"
            [ -n "$points" ] && text="$text

          $points"
            text="$text

          Tekan Ctrl+F5 di panel untuk memuat versi baru."
          else
            text="❌ Update panel GAGAL dipasang — versi lama tetap berjalan (aman).
          ${title}
          Detail: $RUN_URL"
          fi
          curl -sS -m 20 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${text}" --data-urlencode "disable_web_page_preview=true" >/dev/null || true
