name: Penjaga panel (watchdog)
# Judul run membedakan uji manual dari pemeriksaan otomatis -> "normal kembali" hanya membandingkan run otomatis.
run-name: ${{ (github.event_name == 'workflow_dispatch' && inputs.kirim_tes == true) && 'Penjaga panel (uji)' || 'Penjaga panel (otomatis)' }}

# Worker TIDAK bisa melaporkan kematiannya sendiri: kalau Cloudflare menolak request (kuota habis / Worker crash / D1 mati),
# kode panel tidak jalan sama sekali -> notifikasi Error & Bug di dalam panel ikut bisu. Workflow ini berjalan DI LUAR Cloudflare
# tiap 5 menit (logika lengkap: .github/scripts/watchdog.sh):
#  1. /health?deep=1 -> D1, KV, Turso, detak cron (+ peringatan: channel Telegram gagal posting)
#  2. /api           -> jalur yang dipakai semua menu
#  3. kuota harian Cloudflare: request Worker + D1 baca/tulis -> peringatan di >= CF_WARN_PCT % (bawaan 80);
#     KV hanya dicatat di log (panel tetap jalan lewat D1 bila kuota KV habis)
#
# Secret (Settings > Secrets and variables > Actions):
#  - TG_ALERT_TOKEN + TG_ALERT_CHAT : Telegram tujuan peringatan (tanpa ini: run merah -> email GitHub saja)
#  - CF_ANALYTICS_TOKEN (opsional)  : token Cloudflare izin 'Account Analytics: Read'. Kosong -> pakai CLOUDFLARE_API_TOKEN.
# Variabel repo (opsional, tab Variables): CF_ACCOUNT_ID, CF_WARN_PCT, CF_LIMIT_REQ, CF_LIMIT_D1_READ, CF_LIMIT_D1_WRITE,
#  CF_LIMIT_KV_READ, CF_LIMIT_KV_WRITE (bawaan = batas paket gratis; naikkan bila upgrade ke Workers Paid).
# Anti-banjir: pesan BERMASALAH saat baru terjadi, pengingat tiap ±1 jam, pesan "normal kembali" saat pulih.
#
# PEMICU: jadwal GitHub (schedule) di repo ini TERBUKTI meleset jauh (cron.yml "*/5" nyatanya jalan tiap 3-4 jam), jadi
# pemicu utama = cron-job.org tiap 5 menit memanggil API workflow_dispatch dengan inputs {"kirim_tes":"false"}
# (langkah pasang: KB Asisten "penjaga panel"). schedule di bawah tetap ada sebagai jaring pengaman bila cron-job.org mati.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      kirim_tes:
        description: "Kirim pesan uji ke Telegram (memastikan secret benar)"
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Periksa panel + kirim Telegram bila perlu
        env:
          BASE: https://panel-worker.projectbykd.workers.dev
          RAW_TG_TOKEN: ${{ secrets.TG_ALERT_TOKEN }}
          RAW_TG_CHAT: ${{ secrets.TG_ALERT_CHAT }}
          CF_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CF_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          CF_WARN_PCT: ${{ vars.CF_WARN_PCT || '80' }}
          CF_LIMIT_REQ: ${{ vars.CF_LIMIT_REQ || '100000' }}
          CF_LIMIT_D1_READ: ${{ vars.CF_LIMIT_D1_READ || '5000000' }}
          CF_LIMIT_D1_WRITE: ${{ vars.CF_LIMIT_D1_WRITE || '100000' }}
          CF_LIMIT_KV_READ: ${{ vars.CF_LIMIT_KV_READ || '100000' }}
          CF_LIMIT_KV_WRITE: ${{ vars.CF_LIMIT_KV_WRITE || '1000' }}
          EVENT: ${{ github.event_name }}
          KIRIM_TES: ${{ inputs.kirim_tes }}
          RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # kesimpulan run OTOMATIS sebelumnya (jadwal GitHub atau cron-job.org); uji manual tidak dihitung,
          # supaya tidak ada "normal kembali" palsu sesudah uji yang gagal.
          export PREV=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow watchdog.yml --status completed --limit 30 --json conclusion,displayTitle -q '[.[] | select(.displayTitle | test("otomatis"))][0].conclusion // ""' 2>/dev/null || echo "")
          echo "Run otomatis sebelumnya: ${PREV:-belum ada}"
          bash .github/scripts/watchdog.sh
