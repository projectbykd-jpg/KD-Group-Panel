name: Turso sinkron cadangan

# Menyalin database Turso UTAMA -> CADANGAN (spare) supaya panel bisa pindah ke cadangan bila utama kena kuota/BLOCKED.
# Rancangan & pengaman: panel-worker/src/lib/turso.ts dan panel-worker/scripts/turso-sync.ts.
#
# Secret (Settings > Secrets and variables > Actions): TURSO_URL, TURSO_TOKEN (utama -- sudah ada),
# TURSO_SPARE_URL, TURSO_SPARE_TOKEN (cadangan). Tanpa secret cadangan workflow ini selesai tanpa melakukan apa pun.
#
# Mode:
#   sync     (jadwal & bawaan) utama -> cadangan; dilewati otomatis bila panel sedang memakai cadangan.
#   failback (manual, SETELAH utama pulih) cadangan -> utama, lalu panel kembali memakai utama.
on:
  schedule:
    - cron: "17,47 * * * *" # tiap ±30 menit (jadwal GitHub bisa terlambat beberapa menit)
  workflow_dispatch:
    inputs:
      mode:
        description: "sync = utama->cadangan | failback = cadangan->utama | fresh = pindah ke cadangan KOSONG (utama diblokir; news tetap di utama; failback dikunci)"
        required: true
        type: choice
        default: sync
        options: [sync, failback, fresh]

concurrency:
  group: turso-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (hanya yang dibutuhkan script ini)
        working-directory: panel-worker
        run: npm install --no-save @libsql/client tsx
      - name: Salin database
        working-directory: panel-worker
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          TURSO_SPARE_URL: ${{ secrets.TURSO_SPARE_URL }}
          TURSO_SPARE_TOKEN: ${{ secrets.TURSO_SPARE_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'sync' }}
        run: npx tsx scripts/turso-sync.ts
