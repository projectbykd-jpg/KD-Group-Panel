<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="KD Bot News">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset=".5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16263a"/>
      <stop offset="1" stop-color="#0a1422"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3d54"/>
      <stop offset=".55" stop-color="#1b2a3d"/>
      <stop offset="1" stop-color="#121d2c"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04101c"/>
      <stop offset="1" stop-color="#071a2a"/>
    </linearGradient>
    <radialGradient id="eye" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset=".35" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset=".4" stop-color="#34d399"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="hex"><path d="M256 24 456 140v232L256 488 56 372V140z"/></clipPath>
  </defs>

  <!-- halo lembut di belakang lencana -->
  <circle cx="256" cy="256" r="250" fill="url(#halo)"/>

  <!-- lencana heksagon -->
  <path d="M256 24 456 140v232L256 488 56 372V140z" fill="url(#plate)"/>
  <g clip-path="url(#hex)" opacity=".55" stroke="#22d3ee" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M56 188h86l30 30h40"/>
    <path d="M56 330h70l26-26h28"/>
    <path d="M456 188h-86l-30 30h-40"/>
    <path d="M456 330h-70l-26-26h-28"/>
    <path d="M256 24v64"/>
    <path d="M150 470l24-34h40"/>
    <path d="M362 470l-24-34h-40"/>
  </g>
  <g fill="#22d3ee" opacity=".8">
    <circle cx="142" cy="188" r="4"/><circle cx="126" cy="304" r="4"/>
    <circle cx="370" cy="188" r="4"/><circle cx="386" cy="304" r="4"/>
  </g>
  <path d="M256 24 456 140v232L256 488 56 372V140z" fill="none" stroke="url(#ring)" stroke-width="12" stroke-linejoin="round"/>
  <path d="M256 46 436 150v212L256 466 76 362V150z" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="2" stroke-linejoin="round"/>

  <!-- antena -->
  <rect x="251" y="110" width="10" height="42" rx="5" fill="#2b3f55"/>
  <circle cx="256" cy="104" r="26" fill="url(#orb)"/>
  <circle cx="256" cy="104" r="9" fill="#d1fae5"/>

  <!-- telinga -->
  <rect x="120" y="236" width="30" height="86" rx="12" fill="#1b2a3d" stroke="#34d399" stroke-opacity=".7" stroke-width="3"/>
  <rect x="362" y="236" width="30" height="86" rx="12" fill="#1b2a3d" stroke="#34d399" stroke-opacity=".7" stroke-width="3"/>
  <rect x="129" y="260" width="12" height="38" rx="6" fill="#34d399" opacity=".85"/>
  <rect x="371" y="260" width="12" height="38" rx="6" fill="#34d399" opacity=".85"/>

  <!-- kepala -->
  <rect x="146" y="150" width="220" height="200" rx="52" fill="url(#head)" stroke="#3a5573" stroke-width="3"/>
  <path d="M168 176q88-22 176 0" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="3" stroke-linecap="round"/>

  <!-- visor -->
  <rect x="172" y="198" width="168" height="84" rx="30" fill="url(#visor)" stroke="#22d3ee" stroke-opacity=".55" stroke-width="2.5"/>
  <circle cx="218" cy="240" r="34" fill="url(#eye)"/>
  <circle cx="294" cy="240" r="34" fill="url(#eye)"/>
  <rect x="204" y="226" width="28" height="28" rx="10" fill="#cffafe"/>
  <rect x="280" y="226" width="28" height="28" rx="10" fill="#cffafe"/>
  <rect x="211" y="233" width="14" height="14" rx="5" fill="#0e7490"/>
  <rect x="287" y="233" width="14" height="14" rx="5" fill="#0e7490"/>
  <path d="M184 262h144" stroke="#22d3ee" stroke-opacity=".35" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>

  <!-- mulut / grill -->
  <g fill="#0a1422" stroke="#34d399" stroke-opacity=".6" stroke-width="2">
    <rect x="206" y="304" width="22" height="26" rx="6"/>
    <rect x="234" y="304" width="22" height="26" rx="6"/>
    <rect x="262" y="304" width="22" height="26" rx="6"/>
    <rect x="290" y="304" width="22" height="26" rx="6"/>
  </g>
  <g fill="#34d399" opacity=".9">
    <rect x="211" y="312" width="12" height="4" rx="2"/>
    <rect x="239" y="312" width="12" height="4" rx="2"/>
    <rect x="267" y="312" width="12" height="4" rx="2"/>
    <rect x="295" y="312" width="12" height="4" rx="2"/>
  </g>

  <!-- leher + bahu -->
  <rect x="226" y="350" width="60" height="22" rx="8" fill="#16263a" stroke="#3a5573" stroke-width="2.5"/>
  <path d="M160 410q96-52 192 0v30q-96-42-192 0z" fill="#16263a" stroke="url(#ring)" stroke-width="3" stroke-linejoin="round" opacity=".95"/>

  <!-- label NEWS -->
  <rect x="206" y="420" width="100" height="26" rx="13" fill="#0a1422" stroke="#34d399" stroke-opacity=".8" stroke-width="2"/>
  <text x="256" y="438.5" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="3.2" fill="#6ee7b7">NEWS</text>
</svg>
