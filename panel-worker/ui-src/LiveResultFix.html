<script>
/* Result live-preview reliability layer.
   Keeps the existing parser/renderer in Scripts.html as the single source of truth.
   This only guarantees that Result input changes trigger the existing autoGenerate()
   after the page/DOM is ready. No server request is added. */
(function () {
  var installed = false;
  var observer = null;
  var lastText = null;

  function inputEl() { return document.getElementById('inputText'); }

  function syncResultPreview() {
    var el = inputEl();
    if (!el || typeof window.autoGenerate !== 'function') return;
    var text = String(el.value || '');
    if (!text.trim()) return;
    if (text === lastText) return;
    lastText = text;
    try { window.autoGenerate(); } catch (e) {
      // Do not break the panel if an unrelated page is being rendered.
    }
  }

  function attach() {
    var el = inputEl();
    if (!el) return false;
    if (el.__kdLivePreviewBound) return true;
    el.__kdLivePreviewBound = true;

    ['input', 'change', 'paste'].forEach(function (name) {
      el.addEventListener(name, function () {
        requestAnimationFrame(function () {
          lastText = null;
          syncResultPreview();
        });
      }, { passive: true });
    });

    setTimeout(function () {
      lastText = null;
      syncResultPreview();
    }, 0);
    return true;
  }

  function install() {
    attach();
    if (installed) return;
    installed = true;

    var root = document.getElementById('app-container') || document.body;
    if (root && window.MutationObserver) {
      // Cukup memastikan listener terpasang bila #inputText dibuat ulang. JANGAN memanggil autoGenerate() dari sini:
      // autoGenerate() sendiri mengubah DOM (innerText hasil), sehingga observer terpicu lagi -> loop tak berujung
      // (±5.500 panggilan/detik saat kotak Result berisi teks). attach() sudah menjadwalkan satu sinkron saat pertama dipasang.
      observer = new MutationObserver(function (records) {
        for (var i = 0; i < records.length; i++) {
          if (records[i].addedNodes && records[i].addedNodes.length) {
            var el = inputEl();
            if (el && !el.__kdLivePreviewBound) attach();
            return;
          }
        }
      });
      observer.observe(root, { childList: true, subtree: true });
    }

    var originalSwitch = window.switchPage;
    if (typeof originalSwitch === 'function' && !originalSwitch.__kdLivePreviewWrapped) {
      var wrappedSwitch = function () {
        var out = originalSwitch.apply(this, arguments);
        setTimeout(function () {
          attach();
          lastText = null;
          syncResultPreview();
        }, 0);
        return out;
      };
      wrappedSwitch.__kdLivePreviewWrapped = true;
      window.switchPage = wrappedSwitch;
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', install, { once: true });
  } else {
    install();
  }
  setTimeout(install, 0);
  setTimeout(install, 300);

  /* Re-apply Live Chat visibility after the login profile is restored. The
     permission rule is unchanged: only ADMIN/OPERATOR may use the panel menu.
     This fixes the startup race where the menu was hidden before the profile
     reached localStorage. No polling after the short startup window. */
  function syncLiveChatMenu() {
    var group = document.querySelector('.nav-group[data-group="livechat"]');
    if (!group) return;
    var profile = {};
    try { profile = JSON.parse(localStorage.getItem('daygroup_profile') || '{}') || {}; } catch (e) {}
    var role = String(profile.role || '').trim().toUpperCase();
    if (!role) return;
    var allowed = role === 'ADMIN' || role === 'OPERATOR';
    group.hidden = !allowed;
    group.style.setProperty('display', allowed ? '' : 'none', 'important');
    // Hak akses menu per user (Admin -> Users) menang atas aturan role di atas.
    if (allowed && typeof window.applyMenuAccess === 'function') window.applyMenuAccess();
  }

  function bootUiRepairs() {
    syncLiveChatMenu();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootUiRepairs, { once: true });
  } else {
    bootUiRepairs();
  }
  [250, 750, 1500, 3000].forEach(function (ms) { setTimeout(bootUiRepairs, ms); });
})();
</script>
