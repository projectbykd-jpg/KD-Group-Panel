  <style>
    /* =========================================================
       DESIGN TOKENS — satu sumber kebenaran untuk skala & warna.
       Skala radius: 10 / 14 / 18 / 26. Spasi kelipatan 4.
       Font minimum yang boleh dipakai untuk teks fungsional: 11px.
       ========================================================= */
    :root {
      --font-sans: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Roboto Mono', monospace;

      /* Skala tipografi (dipakai lewat util .fs-* di bawah) */
      --fs-2xs: 11px;   /* label kecil, badge  — batas bawah keterbacaan */
      --fs-xs: 12px;    /* teks sekunder       */
      --fs-sm: 13px;    /* body default        */
      --fs-md: 15px;    /* penekanan           */
      --fs-lg: 18px;    /* judul kartu         */
      --fs-xl: 22px;    /* judul halaman       */

      /* Radius */
      --r-sm: 10px;
      --r-md: 14px;
      --r-lg: 18px;
      --r-xl: 26px;

      /* Elevasi — lembut & berlapis, bukan drop-shadow keras */
      --shadow-sm: 0 1px 2px rgba(0,0,0,.28), 0 4px 12px -4px rgba(0,0,0,.35);
      --shadow-md: 0 6px 16px -6px rgba(0,0,0,.42), 0 18px 40px -18px rgba(0,0,0,.5);
      --shadow-lg: 0 12px 28px -10px rgba(0,0,0,.5), 0 32px 64px -24px rgba(0,0,0,.6);

      /* Teks — kontras dinaikkan supaya lolos WCAG AA di atas kaca gelap */
      --text-strong: #f8fafc;
      --text-body: #e2e8f0;
      --text-muted: #a9b6c8;   /* pengganti slate-400/500 untuk konten nyata */
      --text-faint: #8b98ab;   /* pengganti slate-600 */

      --focus: #38bdf8;

      --panel-bg: rgba(10, 18, 36, .78);
      --panel-border: rgba(148, 163, 184, .14);
      --bg-card: linear-gradient(160deg, #141d30, #0b1120);
      --cyan: #22d3ee;
      --blue: #3b82f6;
      --pink: #f472b6;
      --success: #34d399;
      --danger: #fb7185;
      --warning: #fbbf24;

      /* ===== Skala pill/badge terpadu — dipakai lewat var() oleh SEMUA
         komponen berbentuk "pil" (header-stat, log-status-badge, site-badge,
         summary-pill, lap-chip, mini-chip, dst) supaya ukurannya konsisten
         satu sama lain tanpa perlu menyatukan class-nya (banyak dipakai di
         tempat berbeda-beda, menyatukan class = ganti ratusan pemanggilan). */
      --pill-radius: 999px;
      --pill-pad-y: 6px;
      --pill-pad-x: 10px;
      --pill-fs: 10px;
      --pill-fw: 800;
    }

    * { box-sizing: border-box; }
    /* Tanpa ini, dropdown <select> (opsi Role/Status/Kategori, dsb), checkbox,
       date picker, dan scrollbar bawaan Firefox SEMUA muncul putih terang
       (skema warna default OS) di tengah panel gelap -- kontras banget & jadi
       salah satu sumber kesan "norak"/tidak konsisten paling gampang kelihatan.
       1 baris ini bikin browser render semua widget native itu pakai varian
       gelapnya sendiri, otomatis, tanpa perlu re-style tiap elemen manual. */
    :root { color-scheme: dark; }
    button, a, input, select, textarea, .glass-card, .glass-inner { transition: background-color .2s ease, border-color .2s ease, color .2s ease, box-shadow .2s ease, opacity .2s ease, transform .2s ease; }
    body { font-family: var(--font-sans); font-size: 14px; line-height: 1.55; background: #060a15; background-image: radial-gradient(1100px circle at 0% -5%, rgba(34, 211, 238, 0.07), transparent 55%), radial-gradient(1000px circle at 100% 105%, rgba(139, 92, 246, 0.06), transparent 55%); background-attachment: fixed; min-height: 100vh; color: var(--text-strong); overflow-x: hidden; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

    /* Aksesibilitas: fokus keyboard yang jelas & konsisten di seluruh panel */
    :where(button, a, input, select, textarea, [tabindex], summary):focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
      border-radius: 6px;
    }

    /* Chrome aplikasi tidak perlu bisa diseleksi; KONTEN tetap bisa disalin manual
       (dulu <body> pakai .select-none sehingga operator tak bisa blok teks apa pun). */
    .sidebar-nav, .admin-tab, .floating-toast, .header-stat, .status-legend,
    .panel-section-title, .closing-eyebrow, #live-clock, #live-date { user-select: none; }

    /* TANPA backdrop-filter: kartu ini besar & sticky (header, sidebar, kartu
       Laporan Harian). backdrop-filter di elemen sticky = browser me-render ulang
       blur tiap frame saat scroll -> lag berat / tab nge-freeze di halaman panjang.
       Latarnya dibuat lebih pekat supaya tetap terlihat "kaca". */
    /* Blur ganda (glass-inner di dalam glass-card) sangat mahal untuk GPU dan efeknya
       nyaris tak terlihat — jadi lapisan dalam tanpa backdrop-filter. */
    .glass-inner:focus-within { border-color: rgba(34, 211, 238, 0.5); background: rgba(15, 23, 42, 0.85); box-shadow: 0 0 22px rgba(34, 211, 238, 0.1); }

    .neon-cyan { text-shadow: 0 0 6px rgba(34, 211, 238, 0.18); color: #38d9f0; }

    @keyframes pulse-glow-once { 0% { text-shadow: 0 0 2px #22d3ee, 0 0 6px rgba(34,211,238,0.2); transform: scale(1); } 40% { text-shadow: 0 0 10px #22d3ee, 0 0 20px rgba(34,211,238,0.4); transform: scale(1.035); } 100% { text-shadow: 0 0 6px #22d3ee, 0 0 12px rgba(34,211,238,0.22); transform: scale(1); } }
    .animate-market { animation: pulse-glow-once 1.1s ease-out 1; color: #22d3ee !important; text-shadow: 0 0 6px #22d3ee, 0 0 12px rgba(34,211,238,0.22); }

    .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px) scale(0.99); } to { opacity: 1; transform: translateY(0) scale(1); } }

    #main-panel, #prediction-page { display: none; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.3); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(34, 211, 238, 0.4); }

    /* scroll-behavior:smooth di halaman panjang bikin scroll terasa "berat"/nyendat
       di Chrome — pakai instant. */
    html { scroll-behavior: auto; }
    button, input, select, textarea { -webkit-tap-highlight-color: transparent; }
    button:disabled { opacity: .58; cursor: not-allowed; filter: grayscale(.15); transform: none !important; }
    .glass-card { background: var(--bg-card); border: 1px solid var(--panel-border); box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255,255,255,.05); }
    .glass-card:hover { border-color: rgba(255, 255, 255, 0.12); box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.05); }
    .glass-inner { background: linear-gradient(160deg, rgba(34,45,66,.85), rgba(19,27,44,.8)); border: 1px solid rgba(148,163,184,.1); }
    .glass-card::before { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; background:radial-gradient(120% 80% at 0% 0%, rgba(255,255,255,.04), transparent 42%); }
    .glass-card > * { position: relative; z-index: 1; }
    .panel-section-title { display:flex; align-items:center; gap:.65rem; font-size:.72rem; font-weight:800; letter-spacing:.08em; color:#cbd5e1; }
    .panel-section-title::after { content:""; height:1px; flex:1; background:linear-gradient(90deg, rgba(34,211,238,.22), transparent); }
    .action-btn { position:relative; overflow:hidden; isolation:isolate; }
    .action-btn::after { content:""; position:absolute; inset:-2px; background:linear-gradient(110deg, transparent 25%, rgba(255,255,255,.18) 50%, transparent 75%); transform:translateX(-130%); transition:transform .65s ease; z-index:-1; }
    .action-btn:hover::after { transform:translateX(130%); }

    /* ===== Hierarki tombol: Primary (aksi kritis) > Secondary (utility) > Danger (destruktif) =====
       Primary dipakai HANYA untuk 1 aksi utama per kartu (kirim/send), supaya operator langsung
       tau tombol mana yang paling penting tanpa harus baca teksnya dulu. */
    /* Dulu 3 warna (cyan->biru->ungu) -- kesan "gamer rainbow". Diringkas jadi
       2 warna supaya lebih tenang/"dashboard SaaS", bukan kurang saturasi
       arah lain. */
    .btn-primary { background:linear-gradient(110deg,#22d3ee,#3b82f6); color:#04121f; font-weight:800; box-shadow:0 8px 22px -8px rgba(56,130,246,.5), 0 1px 0 rgba(255,255,255,.15) inset; }
    .btn-primary:hover { filter:brightness(1.06); box-shadow:0 12px 30px -8px rgba(56,130,246,.62), 0 1px 0 rgba(255,255,255,.2) inset; }
    .btn-secondary { background:rgba(30,41,59,.55); color:#cbd5e1; border:1px solid rgba(148,163,184,.18); font-weight:700; box-shadow:none; }
    .btn-secondary:hover { background:rgba(30,41,59,.8); border-color:rgba(148,163,184,.32); color:#f1f5f9; }

    /* ===== Send-button micro-interaction: tombol "melipat" jadi pesawat kertas lalu
       terbang keluar saat diklik. SEMUA transform/opacity di sini dijalankan lewat
       Web Animations API di JS (launchSendPlane), BUKAN class+CSS transition/animation.
       Alasan: elemen tombol ini juga punya `active:scale-95` (Tailwind) + efek tekan
       universal (button:active { transform:scale(.965) }) yang rebutan properti
       `transform` yang sama di saat bersamaan -> itulah sumber animasi terasa
       patah-patah sebelumnya. WAAPI (element.animate()) selalu menang atas transisi
       CSS manapun untuk properti yang sama, jadi tidak ada lagi rebutan.
       Style di bawah ini HANYA styling statis untuk elemen pesawat & jejaknya
       (posisi/animasi aktualnya diatur di JS). Ditaruh position:fixed ke document.body
       (BUKAN anak tombol) supaya proporsinya tidak ikut kegepeng oleh scale tombol. */
    .send-launch-plane {
      position:fixed; pointer-events:none; color:#22d3ee; font-size:2.4rem;
      filter:drop-shadow(0 4px 10px rgba(34,211,238,.55));
      will-change:transform,opacity; z-index:9999;
    }
    .send-launch-trail {
      position:fixed; pointer-events:none; width:90px; height:3px; transform-origin:left center;
      background:linear-gradient(90deg, rgba(34,211,238,.95), rgba(34,211,238,0));
      will-change:transform,opacity; z-index:9998;
    }
    .action-btn.is-sent { background:linear-gradient(110deg,#34d399,#10b981 60%,#059669) !important; box-shadow:0 10px 30px -6px rgba(16,185,129,.5), 0 0 0 1px rgba(16,185,129,.3) inset !important; transition:background .35s ease, box-shadow .35s ease; }

    /* ===== Header summary strip: ringkasan status hari ini, ganti tagline statis ===== */
    .header-stat { display:inline-flex; align-items:center; gap:7px; padding:var(--pill-pad-y) var(--pill-pad-x); border-radius:var(--pill-radius); background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.08); font-size:var(--pill-fs); font-weight:var(--pill-fw); color:#e2e8f0; white-space:nowrap; }
    .header-stat-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
    .header-stat-dot.ok { background:var(--success); box-shadow:0 0 4px rgba(52,211,153,.4); }
    .header-stat-dot.bad { background:var(--danger); box-shadow:0 0 4px rgba(251,113,133,.4); }
    .header-stat-dot.info { background:var(--cyan); box-shadow:0 0 4px rgba(34,211,238,.4); }
    .header-stat-dot.warn { background:var(--warning); box-shadow:0 0 4px rgba(251,191,36,.4); }

    /* ===== Legenda status (Aktivitas) ===== */
    .status-legend { display:flex; flex-wrap:wrap; gap:10px; font-size:9.5px; font-weight:700; color:#94a3b8; }
    .status-legend span { display:inline-flex; align-items:center; gap:5px; }
    .status-legend i { font-size:8px; }

    /* ===== Floating toast: melayang di tengah-atas, TIDAK memblokir aktivitas lain =====
       pointer-events:none supaya klik/ketik di belakangnya tetap jalan normal;
       tidak ada backdrop/tombol, auto-hilang sendiri. */
    .floating-toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translate(-50%, -14px) scale(.96);
      z-index: 999997;
      opacity: 0;
      pointer-events: none;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      max-width: min(92vw, 420px);
      padding: 13px 20px 13px 14px;
      border-radius: 999px;
      background: #0b1220;
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 20px 45px -12px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.02);
      transition: opacity .25s ease, transform .25s ease;
    }
    .floating-toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
    .floating-toast-icon { width: 26px; height: 26px; border-radius: 9999px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size: 11px; background: rgba(34,211,238,.16); color:#22d3ee; }
    .floating-toast.type-success .floating-toast-icon { background: rgba(52,211,153,.16); color:#34d399; }
    .floating-toast.type-danger .floating-toast-icon { background: rgba(251,113,133,.18); color:#fb7185; }
    .floating-toast.type-warning .floating-toast-icon { background: rgba(251,191,36,.18); color:#fbbf24; }
    .floating-toast-msg { font-size: 12px; font-weight:700; color:#f1f5f9; line-height:1.35; overflow-wrap:anywhere; }
    @media (max-width: 639px) { .floating-toast { top: 12px; padding:11px 16px 11px 12px; } }

    /* ===== Skeleton loading: ganti teks statis "Memuat..." dengan baris placeholder
       yang jelas kelihatan lagi proses, bukan diam tanpa progress. ===== */
    @keyframes skeletonShimmer { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }
    .skeleton-bar { display:inline-block; height:10px; border-radius:6px; background:linear-gradient(90deg, rgba(148,163,184,.08) 25%, rgba(148,163,184,.18) 37%, rgba(148,163,184,.08) 63%); background-size:400px 100%; animation:skeletonShimmer 1.4s ease-in-out infinite; }
    .input-shell { position:relative; }
    .input-shell::after { content:""; position:absolute; left:14px; right:14px; bottom:-1px; height:2px; border-radius:999px; background:linear-gradient(90deg,var(--cyan),var(--blue)); transform:scaleX(0); transition:transform .25s ease; }
    .input-shell:focus-within::after { transform:scaleX(1); }
    .status-dot { width:7px; height:7px; border-radius:50%; background:var(--success); box-shadow:0 0 6px rgba(52,211,153,.5); display:inline-block; animation:statusPulse 1.8s infinite; }
    @keyframes statusPulse { 0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.75)} }
    @keyframes popupIn { from{opacity:0;transform:translateY(18px) scale(.96)} to{opacity:1;transform:none} }
    @keyframes overlayIn { from{opacity:0} to{opacity:1} }
    @keyframes orbit { to{transform:rotate(360deg)} }
    @keyframes corePulse { 0%,100%{transform:scale(.96);opacity:.7}50%{transform:scale(1.08);opacity:1} }
    @keyframes progressSweep { 0%{transform:translateX(-100%)} 55%{transform:translateX(15%)} 100%{transform:translateX(100%)} }
    .popup-overlay.is-open { display:flex !important; animation:overlayIn .2s ease-out both; }
    .popup-card { animation:popupIn .34s cubic-bezier(.16,1,.3,1) both; }
    .loader-orbit { position:absolute; inset:-6px; border-radius:30px; border:2px solid rgba(34,211,238,.18); border-top-color:#22d3ee; border-right-color:#3b82f6; filter:drop-shadow(0 0 8px rgba(34,211,238,.55)); animation:orbit 1.05s linear infinite; will-change:transform; }
    .loader-core { animation:corePulse 1.4s ease-in-out infinite; }
    .progress-track { height:5px; border-radius:99px; background:rgba(148,163,184,.14); overflow:hidden; }
    .progress-bar { height:100%; border-radius:inherit; background:linear-gradient(90deg,#22d3ee,#3b82f6,#8b5cf6); transition:width .35s ease, transform .35s ease, background .35s ease; }
    .progress-bar.is-loading { width:42%; animation:progressSweep 1.35s ease-in-out infinite; }
    .progress-bar.is-done { width:100%; transform:translateX(0); animation:none; background:linear-gradient(90deg,#34d399,#14b8a6); }
    .progress-bar.is-error { width:100%; transform:translateX(0); animation:none; background:linear-gradient(90deg,#fb7185,#e11d48); }
    .popup-step { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; border-radius:14px; background:rgba(15,23,42,.55); border:1px solid rgba(255,255,255,.06); font-size:10px; color:#94a3b8; }
    .popup-step.active { color:#cffafe; border-color:rgba(34,211,238,.25); background:rgba(8,145,178,.08); }
    .popup-step.done { color:#a7f3d0; border-color:rgba(52,211,153,.24); background:rgba(16,185,129,.08); }
    .popup-step.error { color:#fecdd3; border-color:rgba(251,113,133,.3); background:rgba(225,29,72,.08); }
    body.modal-open { overflow:hidden; }
    @media (max-width: 1023px) {
      body { padding-bottom: 92px !important; }
      #app-container { gap:14px; }
      #app-container > .glass-card:first-child { position:fixed !important; left:12px; right:12px; bottom:12px; top:auto; width:auto !important; min-height:auto !important; padding:10px !important; border-radius:22px !important; z-index:80; }
      #app-container > .glass-card:first-child > div:first-child { width:100%; }
      #app-container > .glass-card:first-child .border-b { display:none; }
      #app-container > .glass-card:first-child .flex-row.lg\:flex-col.gap-2 { width:100%; gap:8px; }
      #nav-home, #nav-prediction { min-height:48px; }
      #toast { top:12px; }
      /* Menu yang jarang dipakai (Aktivitas/Admin) tetap kelihatan namanya di mobile,
         supaya operator baru tidak cuma nebak-nebak dari ikon doang. */
      .sidebar-nav { flex-direction:column; gap:2px !important; padding-top:8px !important; padding-bottom:8px !important; }
      .sidebar-nav span.hidden.lg\:inline { display:inline !important; font-size:10px; letter-spacing:.02em; }
    }
    @media (max-width: 639px) {
      body { padding:10px; padding-bottom:88px !important; }
      .glass-card { border-radius:22px !important; }
      #main-panel .monitor-stats { grid-template-columns:1fr; }
      #main-panel .monitor-stats > div { min-height:72px; }
      #market-container { min-width:100%; }
      #prediction-page table { min-width:720px; }
      #actionPopup .popup-card { padding:24px 18px; border-radius:26px; }
      #actionPopup h3 { font-size:.9rem; }
    }
    /* Tablet/laptop kecil: 3 kartu status jadi sempit kalau langsung 1->3 kolom, kasih tahap 2 kolom dulu. */
    @media (min-width: 640px) and (max-width: 900px) {
      #main-panel .monitor-stats { grid-template-columns: repeat(2, 1fr); }
    }
    /* Sekarang app-container mengalir dari atas (bukan center vertikal) supaya posisi tidak
       loncat-loncat tiap resize window / ganti halaman dengan tinggi konten berbeda. */
    #app-container { margin-top: .25rem; }
    @media (min-width: 1024px) {
      #app-container { margin-top: 0; }
      /* Beranda dirancang muat 1 layar lewat ukuran yang padat (bukan tinggi dikunci).
         Kalau konten toh kelewat tinggi di jendela pendek, kartu-nya yang scroll,
         bukan seluruh halaman. max-height (bukan height) -> tak ada ruang kosong. */
      /* Dashboard card bukan scroll container. Scroll cukup di area kerja kanan
         (#app-container > .flex-1), supaya hero/statistik/aktivitas tetap utuh. */
      #main-panel .glass-card { max-height: none; overflow: visible; }
      #main-panel .beranda-flex { flex: 1 1 auto; min-height: 0; }
    }
    @media (min-width: 1024px) and (max-height: 780px) {
      #main-panel .glass-card { padding: 1.1rem !important; gap: .7rem !important; max-height: none !important; overflow: visible !important; }
      #main-panel .monitor-stats > div { min-height: 62px !important; }
      #main-panel #inputText { min-height: 6rem !important; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; transition-duration:.01ms !important; }
    }

    .nav-extra{display:none}.admin-only{display:none}.modal-shell{position:fixed;inset:0;background:rgba(2,6,23,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:1000000;display:none;align-items:center;justify-content:center;padding:1rem}.modal-shell.open{display:flex;animation:overlayIn .16s ease-out both}.status-ok{color:#34d399}.status-bad{color:#fb7185}.status-skip{color:#94a3b8}.mini-card{background:rgba(15,23,42,.58);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:16px}.log-table{min-width:900px}.log-table td,.log-table th{padding:12px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}.switch{width:48px;height:26px;border-radius:999px;background:#334155;position:relative;cursor:pointer}.switch::after{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:white;transition:.2s}.switch.on{background:#10b981}.switch.on::after{left:25px}
    /* ===== Tabel rapi terpadu — dipakai di tabel mana pun yang sebelumnya
       cuma <table class="w-full text-xs"> polos (header putih polos, tanpa
       zebra/hover, terasa beda sendiri dari admin-users-table/log-table yang
       sudah rapi). Cukup tambah class "pretty-table" di <table>-nya. ===== */
    .pretty-table-wrap{border-radius:16px;border:1px solid rgba(255,255,255,.08);overflow:hidden;background:rgba(2,6,23,.22)}
    .pretty-table{width:100%;border-collapse:separate;border-spacing:0}
    .pretty-table thead th{position:sticky;top:0;z-index:2;background:#111b31;color:#94a3b8;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:11px 14px;text-align:left;white-space:nowrap;border-bottom:1px solid rgba(255,255,255,.08)}
    .pretty-table tbody td{padding:11px 14px;color:#cbd5e1;font-size:11px;vertical-align:middle;border-bottom:1px solid rgba(255,255,255,.055)}
    .pretty-table tbody tr:nth-child(even){background:rgba(30,41,59,.18)}
    .pretty-table tbody tr:hover{background:rgba(6,182,212,.055)}
    .pretty-table tbody tr:last-child td{border-bottom:none}
    /* ===== Baris "belum ada data" terpadu — sebelumnya beberapa tabel cuma
       taruh teks abu-abu polos (beda font-style/padding satu sama lain),
       sekarang 1 pola konsisten: ikon redup + teks, padding lega. ===== */

    /* HP: tabel 7 kolom (min 1080px) dulu harus digeser ke samping. Sekarang
       tiap baris jadi kartu: waktu + status, user + aksi, lalu detail & data
       selebar kartu. Urutan kolom di HTML tidak berubah (pure CSS). */
    @media (max-width: 640px) {
      .log-table { min-width: 0 !important; table-layout: auto; }
      .log-table thead { display: none; }
      .log-table, .log-table tbody { display: block; width: 100%; }
      .log-table tr { display: block; }
      .log-table tr > td { display: block; padding: 12px !important; }
      .log-table tr.activity-log-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas: "time status" "user action" "detail detail" "data data" "source source";
        gap: 8px 10px;
        padding: 12px;
        border-bottom: 1px solid rgba(255,255,255,.06);
      }
      .log-table tr.activity-log-row > td { padding: 0 !important; border: 0 !important; min-width: 0; }
      .activity-log-row > td:nth-child(1) { grid-area: time; }
      .activity-log-row > td:nth-child(2) { grid-area: user; }
      .activity-log-row > td:nth-child(3) { grid-area: action; justify-self: end; }
      .activity-log-row > td:nth-child(4) { grid-area: status; justify-self: end; }
      .activity-log-row > td:nth-child(5) { grid-area: detail; }
      .activity-log-row > td:nth-child(6) { grid-area: data; }
      .activity-log-row > td:nth-child(7) { grid-area: source; }
      .activity-log-row > td:nth-child(5)::before,
      .activity-log-row > td:nth-child(6)::before {
        display: block; margin-bottom: 3px;
        font-size: 9px; font-weight: 800; letter-spacing: .12em; color: #64748b;
      }
      .activity-log-row > td:nth-child(5)::before { content: "DETAIL"; }
      .activity-log-row > td:nth-child(6)::before { content: "ISI / DATA"; }
      .log-time-cell { display: flex !important; gap: 8px; align-items: baseline; }
      .log-time-cell span { margin-top: 0; }
    }

    /* =========================================================
       SIDEBAR NAVIGATION — state jelas tanpa outline putih
       ========================================================= */
    .sidebar-nav{
      background:rgba(15,23,42,.42);
      border:1px solid rgba(255,255,255,.055);
      color:#cbd5e1;
      box-shadow:none;
    }
    /* Ikon menu dulu warna-warni penuh (satu warna beda per item) sepanjang
       waktu -- kesannya ramai/"norak". Diredam ke opacity rendah saat idle,
       baru terlihat penuh warna waktu di-hover/aktif -- warnanya tetap ada
       sbg penanda cepat per fitur, tapi sidebar-nya kelihatan lebih tenang
       waktu tidak disentuh (pola umum dashboard SaaS premium). */
    .sidebar-nav i{ opacity:.68; transition:opacity .16s ease; }
    .sidebar-nav:hover i, .sidebar-nav.nav-active i{ opacity:1; }
    /* ===== Menu grup (dropdown) ===== */
    .nav-groups{ margin-top:2px }
    .nav-group{ display:flex; flex-direction:column; gap:3px }
    .nav-group-head{
      display:flex; align-items:center; justify-content:space-between;
      width:100%; padding:8px 12px; border-radius:11px; cursor:pointer;
      font-size:10px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
      color:#64748b; background:transparent; border:1px solid transparent;
      transition:color .15s ease, background-color .15s ease;
    }
    .nav-group-head:hover{ color:#94a3b8; background:rgba(255,255,255,.03) }
    .nav-chev{ font-size:9px; transition:transform .2s ease; opacity:.7 }
    .nav-group.collapsed .nav-chev{ transform:rotate(-90deg) }
    .nav-group-body{
      display:flex; flex-direction:column; gap:5px; padding-left:6px;
      margin-left:6px; border-left:1px solid rgba(255,255,255,.06);
      overflow:hidden; transition:max-height .22s ease, opacity .18s ease;
      max-height:400px; opacity:1;
    }
    .nav-group.collapsed .nav-group-body{ max-height:0; opacity:0; gap:0 }
    .nav-solo{ margin-top:2px }
    /* ===== Header & sidebar dibekukan saat scroll ===== */
    .header-frozen{ background:var(--bg-card); box-shadow:0 12px 30px -14px rgba(0,0,0,.55); }
    :root:not([data-theme="light"]) .header-frozen{ background:#0d1526; }

    .lap-datebar{ padding:2px 0 }
    .lap-date-field{ display:flex; align-items:center; gap:8px; background:rgba(2,6,23,.5); border:1px solid rgba(255,255,255,.09); border-radius:12px; padding:9px 12px; min-width:150px }
    .lap-date-field i{ color:#22d3ee; font-size:12px }
    .lap-date-field input{ background:transparent; border:0; outline:0; color:#f1f5f9; font-size:12px; font-weight:700; width:100%; letter-spacing:.02em }
    .lap-quick{ font-size:10px; font-weight:800; padding:8px 11px; border-radius:10px; background:rgba(15,23,42,.6); border:1px solid rgba(255,255,255,.08); color:#94a3b8 }
    .lap-quick:hover{ color:#e2e8f0; border-color:rgba(34,211,238,.3) }
    /* Tanggal, tombol cepat & TARIK DATA sama tinggi (dulu tombol cepat lebih
       pendek sehingga barisnya tidak sejajar). Di HP: 2 tanggal berdampingan,
       tombol cepat & TARIK DATA selebar layar (target sentuh >= 40px). */
    .lap-date-field,.lap-datebar .lap-quick,.lap-run-btn{ min-height:40px }

      .lap-date-field{ min-width:0 }

    }
    .lap-tbl{ border:1px solid rgba(148,163,184,.1); border-radius:14px; overflow:hidden; margin-top:10px; background:rgba(13,20,35,.5);
      content-visibility:auto; contain-intrinsic-size:auto 300px }
    .lap-tbl.open{ border-color:rgba(148,163,184,.16) }
    .lap-tbl-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; cursor:pointer; font-size:11px; font-weight:800; letter-spacing:.06em; color:#cbd5e1; user-select:none }

    .lap-chip{ font-size:10px; font-weight:800; padding:5px 10px; border-radius:9px; border:1px solid rgba(255,255,255,.1); background:rgba(15,23,42,.55); color:#94a3b8; cursor:pointer; user-select:none }

    .sidebar-frozen{ background:var(--bg-card); }

      grid-template-columns:minmax(190px,1.5fr) repeat(3,minmax(135px,.8fr));

    }
    .activity-filter-grid.activity-admin-grid{

    .activity-filter-control{

      border-radius:13px;

      padding:5px 8px;

      color:#a7f3d0;
      background:rgba(16,185,129,.10);

    }

      min-height:34px;

    /* =========================================================
       DYNAMIC WEBSITE THEME ENGINE V1
       Theme mengikuti website yang dimiliki akun pada Sheet Users.
       1 website = single brand theme; 2+ = fusion theme.
       ========================================================= */
    :root {
      --theme-primary: #22d3ee;
      --theme-primary-rgb: 34,211,238;
      --theme-secondary: #3b82f6;
      --theme-secondary-rgb: 59,130,246;
      --theme-accent: #f472b6;
      --theme-accent-rgb: 244,114,182;
      --theme-bg: #020617;
      --theme-bg-rgb: 2,6,23;
      --theme-panel-rgb: 15,23,42;
      --theme-glow-strength: .24;
    }

    body.theme-dynamic {
      background-color: var(--theme-bg) !important;
      background-image:
        radial-gradient(circle at 10% 16%, rgba(var(--theme-primary-rgb), .18) 0, transparent 34%),
        radial-gradient(circle at 88% 80%, rgba(var(--theme-secondary-rgb), .15) 0, transparent 38%),
        radial-gradient(circle at 58% 42%, rgba(var(--theme-accent-rgb), .09) 0, transparent 52%),
        linear-gradient(135deg, rgba(var(--theme-bg-rgb), 1), rgba(2,6,23,.96)) !important;
      background-attachment: fixed !important;
    }

    /* Aksen latar: STATIS. Dulu dua elemen fixed dengan blur(70px) di-animasikan
       transform selamanya -> GPU bekerja terus walau layar diam & scroll patah-patah
       di HP kelas menengah. Sekarang cukup gradient diam, nol biaya runtime. */
    body.theme-dynamic::before,
    body.theme-dynamic::after {
      content: "";
      position: fixed;
      pointer-events: none;
      z-index: 0;
      opacity: .6;
      filter: blur(60px);
      border-radius: 999px;
    }
    body.theme-dynamic::before {
      width: min(42vw, 600px); height: min(42vw, 600px);
      left: -12vw; top: 14vh;
      background: rgba(var(--theme-primary-rgb), .13);
    }
    body.theme-dynamic::after {
      width: min(38vw, 540px); height: min(38vw, 540px);
      right: -10vw; bottom: 6vh;
      background: rgba(var(--theme-secondary-rgb), .11);
    }
    #login-screen, #app-container { position: relative; z-index: 1; }

    body.theme-dynamic .glass-card {
      background: linear-gradient(145deg, rgba(var(--theme-panel-rgb), .86), rgba(var(--theme-bg-rgb), .74)) !important;
      border-color: rgba(var(--theme-primary-rgb), .12) !important;
      box-shadow: 0 25px 55px -16px rgba(0,0,0,.72), 0 0 34px rgba(var(--theme-primary-rgb), .035) !important;
    }
    body.theme-dynamic .glass-card:hover {
      border-color: rgba(var(--theme-primary-rgb), .28) !important;
      box-shadow: 0 30px 65px -18px rgba(0,0,0,.78), 0 0 38px rgba(var(--theme-primary-rgb), .10) !important;
    }
    body.theme-dynamic .glass-inner {
      background: linear-gradient(145deg, rgba(var(--theme-panel-rgb), .58), rgba(var(--theme-bg-rgb), .44)) !important;
    }
    body.theme-dynamic .glass-inner:focus-within {
      border-color: rgba(var(--theme-primary-rgb), .50) !important;
      box-shadow: 0 0 26px rgba(var(--theme-primary-rgb), .12) !important;
    }

    body.theme-dynamic .neon-cyan,
    body.theme-dynamic .animate-market,
    body.theme-dynamic .panel-section-title,
    body.theme-dynamic .sidebar-nav.nav-active,
    body.theme-dynamic #theme-sites {
      color: var(--theme-primary) !important;
    }
    body.theme-dynamic .neon-cyan,
    body.theme-dynamic .animate-market {
      text-shadow: 0 0 18px rgba(var(--theme-primary-rgb), .70), 0 0 36px rgba(var(--theme-primary-rgb), .28) !important;
    }
    body.theme-dynamic .panel-section-title::after,
    body.theme-dynamic .input-shell::after {
      background: linear-gradient(90deg, var(--theme-primary), var(--theme-secondary), transparent) !important;
    }
    body.theme-dynamic .sidebar-nav:hover {
      border-color: rgba(var(--theme-primary-rgb), .20) !important;
    }
    body.theme-dynamic .sidebar-nav.nav-active {
      background: linear-gradient(110deg, rgba(var(--theme-primary-rgb), .26), rgba(var(--theme-secondary-rgb), .16)) !important;
      border-color: rgba(var(--theme-primary-rgb), .46) !important;
      box-shadow: 0 10px 28px rgba(var(--theme-primary-rgb), .12), inset 0 1px 0 rgba(255,255,255,.04) !important;
    }

    body.theme-dynamic #btnLogin,
    body.theme-dynamic .center-notice-btn.primary,
    body.theme-dynamic .activity-filter-apply,
    body.theme-dynamic .prediction-send-btn:not(.partial):not(.done):not(.locked),
    body.theme-dynamic .action-btn.bg-gradient-to-r {
      background-image: linear-gradient(90deg, var(--theme-primary), var(--theme-secondary)) !important;
      box-shadow: 0 10px 28px rgba(var(--theme-primary-rgb), .20) !important;
    }
    body.theme-dynamic #toast { border-left-color: var(--theme-primary) !important; }
    body.theme-dynamic .loader-orbit {
      border-color: rgba(var(--theme-primary-rgb), .18) !important;
      border-top-color: var(--theme-primary) !important;
      border-right-color: var(--theme-secondary) !important;
      filter: drop-shadow(0 0 8px rgba(var(--theme-primary-rgb), .58)) !important;
    }
    body.theme-dynamic .progress-bar {
      background: linear-gradient(90deg, var(--theme-primary), var(--theme-secondary), var(--theme-accent)) !important;
    }
    body.theme-dynamic ::-webkit-scrollbar-thumb:hover { background: rgba(var(--theme-primary-rgb), .46); }

    .site-logo-single, .site-logo-pair{
      display:flex; align-items:center; justify-content:center; gap:18px; min-height:82px;
    }
    .site-logo-single .site-logo-item{ width:80px; height:80px; }
    .site-logo-pair .site-logo-item{ width:62px; height:62px; }
    .site-logo-item{
      position:relative; border-radius:18px; display:flex; align-items:center; justify-content:center;
      background:rgba(255,255,255,.04); border:1px solid rgba(var(--theme-primary-rgb), .20);
      box-shadow:0 0 22px rgba(var(--theme-primary-rgb), .10), inset 0 1px 0 rgba(255,255,255,.06);
      overflow:hidden; flex:0 0 auto;
    }
    .site-logo-item img{ display:block; width:100%; height:100%; object-fit:contain; }
    .site-logo-more{
      margin-top:10px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
      padding:6px 10px; border-radius:999px; font-size:9px; font-weight:900; letter-spacing:.08em;
      color:#e2e8f0; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); text-transform:uppercase;
    }
    body.theme-dynamic .site-logo-item:hover{ transform:translateY(-2px); border-color:rgba(var(--theme-primary-rgb), .32); }

    body.theme-fusion .glass-card::after {
      content:""; position:absolute; left:18px; right:18px; top:0; height:1px;
      border-radius:999px; pointer-events:none;
      background:linear-gradient(90deg, transparent, var(--theme-primary), var(--theme-secondary), var(--theme-accent), transparent);
      opacity:.72;
    }

    @media (prefers-reduced-motion: reduce) {
      body.theme-dynamic::before, body.theme-dynamic::after { animation:none !important; }
    }

    /* =========================================================
       ADMIN — NAV TAB (satu panel per waktu, tidak numpuk scroll)
       ========================================================= */
    .admin-tabs{
      display:flex; gap:6px; overflow-x:auto; padding:6px;
      background:rgba(2,6,23,.4); border:1px solid rgba(148,163,184,.12);
      border-radius:16px; scrollbar-width:none; -ms-overflow-style:none;
    }
    .admin-tabs::-webkit-scrollbar{ display:none; }
    .admin-tab{
      flex:0 0 auto; display:inline-flex; align-items:center; gap:7px;
      padding:9px 14px; border-radius:11px; font-size:10px; font-weight:800;
      letter-spacing:.04em; text-transform:uppercase; color:#94a3b8;
      white-space:nowrap; border:1px solid transparent; cursor:pointer;
      transition:color .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .admin-tab i{ font-size:11px; opacity:.9; }
    .admin-tab:hover{ color:#e2e8f0; background:rgba(148,163,184,.09); }
    .admin-tab.active{
      color:#1a1205; background:linear-gradient(90deg,#fcd34d,#f59e0b);
      border-color:rgba(251,191,36,.45); box-shadow:0 8px 22px rgba(245,158,11,.22);
    }
    .admin-panel{ display:none; }
    .admin-panel.active{ display:flex; flex-direction:column; gap:16px; animation:overlayIn .2s ease-out both; }

    /* Dropdown versi mobile */
    .admin-tab-select{
      display:none; width:100%; min-height:46px; border-radius:14px;
      background:rgba(2,6,23,.5); border:1px solid rgba(251,191,36,.28);
      color:#fde68a; font-size:11px; font-weight:800; letter-spacing:.04em;
      padding:0 14px; text-transform:uppercase;
    }
    @media (max-width:720px){
      .admin-tabs{ display:none; }
      .admin-tab-select{ display:block; }
    }

    /* =========================================================
       POP-UP AKSI — 1 ikon + 1 judul + 1 kalimat + 1 bar.
       Elemen ramai (glow, eyebrow, 3 langkah, cincin spinner) dimatikan
       supaya tidak padat/bingung; status "sedang proses" cukup dari bar.
       ========================================================= */
    #actionPopup .popup-card{
      max-width:340px !important; padding:30px 26px !important;
      gap:18px !important; border-radius:24px !important;
    }
    #actionPopup #popupGlow,
    #actionPopup #popupEyebrow,
    #actionPopup #popupSteps,
    #actionPopup #popupSpinner{ display:none !important; }
    #actionPopup #popupIconBox{
      width:60px !important; height:60px !important; border-radius:20px !important;
    }
    #actionPopup #popupCore{ width:44px !important; height:44px !important; border-radius:15px !important; }
    #actionPopup #popupMainIcon{ font-size:1.05rem !important; }
    #actionPopup #popupCheckIcon{ font-size:1.3rem !important; }
    #actionPopup #popupTitle{ font-size:1rem !important; letter-spacing:.01em !important; }
    #actionPopup #popupDesc{ font-size:12px !important; line-height:1.55 !important; }
    #actionPopup #popupProgressWrap{ gap:0 !important; }
    #actionPopup .progress-track{ height:4px !important; }
    #actionPopup #popupCloseBtn{ padding-top:12px !important; padding-bottom:12px !important; font-size:12px !important; }

    /* =========================================================
       LANTAI KETERBACAAN — ditaruh paling akhir supaya menang atas
       aturan-aturan lama yang saling menimpa (font 8-10px + slate-500/600
       di atas kaca gelap yang gagal kontras WCAG AA). Satu tempat, bukan
       berburu puluhan deklarasi konflik.
       ========================================================= */
    .status-legend { font-size: var(--fs-2xs); color: var(--text-muted); }
    .status-legend i { font-size: 9px; }
    .header-stat { font-size: var(--fs-2xs); }
    .summary-pill,
    #resultSummary .summary-pill,
    #predictionResultSummary .summary-pill { font-size: 10.5px !important; padding: 6px 9px !important; }
    .system-compact-name { font-size: 11px !important; }
    .system-compact-status { font-size: 9.5px !important; }
    .system-compact-reason { font-size: 10px !important; line-height: 1.4 !important; }
    .prediction-site-name { font-size: 12px; }
    .prediction-site-reason { font-size: 10.5px; }
    .prediction-btn, .closing-action-v3, .prediction-site-status { font-size: 10px !important; }
    .closing-slot-state { font-size: 9.5px !important; }
    .closing-eyebrow, .closing-control-label { font-size: 10px; }
    .log-table td, .log-table th { font-size: 11px; }
    .log-time-cell b { font-size: 11px; }
    .log-time-cell span { font-size: 10px; }
    .log-user-chip, .log-action-badge, .log-status-badge { font-size: 10px; }
    .log-plain-text, .log-details summary, .log-details-full { font-size: 11px; }
    .admin-users-table td { font-size: 11px; }
    .admin-users-table th { font-size: 10px; }
    .activity-filter-control { font-size: 11px; }
    .activity-meta-bar, #activityMeta, #adminActivityMeta { font-size: 11px; }
    .center-notice-message { font-size: 12px; }
    .center-notice-btn { font-size: 11px; }
    .retry-mini { font-size: 9.5px !important; }
    .activity-source-chip { font-size: 9.5px !important; }
    .activity-page-btn { font-size: 10px !important; }
    .closing-primary-badge { font-size: 9px !important; }
    .prediction-count { font-size: 10px !important; }

    /* Ganti pemakaian abu-abu redup untuk KONTEN nyata (bukan sekadar hiasan).
       Pakai !important supaya menang atas  Tailwind Play CDN yang
       disuntik runtime SETELAH blok ini. */
    .text-slate-500 { color: var(--text-faint) !important; }
    .text-slate-600 { color: var(--text-faint) !important; }
    .text-slate-400 { color: var(--text-muted) !important; }
    .placeholder-slate-600::placeholder, .placeholder-slate-500::placeholder { color: #8593a6 !important; }

    /* Tombol Salin Cepat — ramping, muat 1 baris di desktop, wrap rapi di HP. */
    .qcopy-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 12px; border-radius: 10px;
      font-size: 11px; font-weight: 700; color: #cbd5e1;
      background: rgba(30,41,59,.55); border: 1px solid rgba(148,163,184,.16);
      white-space: nowrap; cursor: pointer;
      transition: background .18s ease, border-color .18s ease, color .18s ease, transform .1s ease;
    }
    .qcopy-btn:hover { background: rgba(30,41,59,.9); border-color: rgba(34,211,238,.32); color: #f1f5f9; }
    .qcopy-btn:active { transform: scale(.96); }
    .qcopy-btn i { font-size: 11px; }
    @media (max-width: 520px) {
      .qcopy-btn { flex: 1 1 calc(50% - 6px); justify-content: center; padding: 9px 8px; }
    }

    /* Tombol "Tempel" (paste clipboard) di sebelah label input. */
    .paste-btn {
      display:inline-flex; align-items:center; gap:6px; flex-shrink:0;
      padding:5px 11px; border-radius:9px;
      font-size:10px; font-weight:800; letter-spacing:.02em; color:#67e8f9;
      background:rgba(8,145,178,.16); border:1px solid rgba(34,211,238,.28);
      cursor:pointer; white-space:nowrap;
      transition:background .16s ease, border-color .16s ease, color .16s ease, transform .08s ease;
    }
    .paste-btn:hover { background:rgba(8,145,178,.28); border-color:rgba(34,211,238,.45); color:#a5f3fc; }
    .paste-btn:active { transform:scale(.93); }

    /* =========================================================
       EFEK TEKAN UNIVERSAL — semua tombol terasa "ditekan" (lebih realistis).
       Tailwind `active:scale-95` di sebagian tombol tetap menang; sisanya
       memakai aturan ini. Durasi transisi dipercepat khusus saat ditekan.
       ========================================================= */
    button, [role="button"], summary, .switch, label.glass-inner {
      transition-property: background-color, border-color, color, box-shadow, transform, filter, opacity;
      transition-duration: .18s;
      transition-timing-function: ease;
    }
    button:not(:disabled):active,
    a.btn-secondary:active,
    [role="button"]:not([aria-disabled="true"]):active,
    .switch:active,
    label.glass-inner:active {
      transform: scale(.965);
      filter: brightness(.92);
      transition-duration: .04s;
    }

    /* =========================================================
       FILTER TANGGAL — tampilan modern: shell kaca + ikon kalender,
       klik di mana saja buka picker, dan POPUP KALENDER NATIVE jadi tema gelap
       (color-scheme: dark) sehingga tidak "jadul" putih lagi.
       ========================================================= */
    .activity-date-field { display:flex; flex-direction:column; gap:6px; min-width:0; }
    .activity-date-field > label {
      font-size:9px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
      color:var(--text-faint); padding-left:3px;
    }
    .date-shell {
      display:flex; align-items:center; gap:10px;
      min-height:44px; padding:0 14px; border-radius:13px;
      background:rgba(15,23,42,.7); border:1px solid rgba(148,163,184,.16);
      cursor:pointer;
      transition:border-color .18s ease, box-shadow .18s ease, background .18s ease, transform .08s ease;
    }
    .date-shell:hover { border-color:rgba(148,163,184,.3); }
    .date-shell:focus-within {
      border-color:rgba(34,211,238,.5);
      box-shadow:0 0 0 3px rgba(34,211,238,.09);
      background:rgba(15,23,42,.92);
    }
    .date-shell:active { transform:scale(.99); }
    .date-shell > i { color:#67e8f9; font-size:13px; flex-shrink:0; }
    .date-input {
      flex:1; min-width:0; width:100%;
      background:transparent; border:none; outline:none;
      color:#e8eef6; font-size:12px; font-weight:700; letter-spacing:.01em;
      font-family:var(--font-sans);
      color-scheme:dark; cursor:pointer;
      -webkit-appearance:none; appearance:none;
    }
    .date-input::-webkit-datetime-edit-fields-wrapper { color:#e8eef6; }
    .date-input::-webkit-datetime-edit-text { color:#7c8aa0; padding:0 2px; }
    .date-input:in-range::-webkit-datetime-edit-year-field,
    .date-input:in-range::-webkit-datetime-edit-month-field,
    .date-input:in-range::-webkit-datetime-edit-day-field { color:#e8eef6; }
    .date-input::-webkit-calendar-picker-indicator {
      filter: invert(78%) sepia(55%) saturate(900%) hue-rotate(150deg) brightness(1.05);
      opacity:.9; cursor:pointer; margin-left:2px;
    }
    .date-input::-webkit-calendar-picker-indicator:hover { opacity:1; }
    @media (max-width:620px){ .activity-date-field > label { font-size:10px; } }

    /* Motion: hormati preferensi sistem + jangan angkat kartu di dashboard padat. */
    @media (prefers-reduced-motion: no-preference) {
      .glass-card { transition: border-color .2s ease, box-shadow .2s ease; }
    }
    @media (prefers-reduced-motion: reduce) {
      button:not(:disabled):active, [role="button"]:active { transform: none; filter: brightness(.9); }
    }

    /* =========================================================
       MENU INVEST — form setting + tabel hasil AutoCheck
       ========================================================= */
    #invest-page .invest-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
    #invest-page .invest-field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    #invest-page .invest-field > label {
      font-size: 9px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
      color: var(--text-faint); padding-left: 2px;
    }
    #invest-page .invest-input {
      min-height: 42px; border-radius: 12px; padding: 0 12px;
      background: rgba(15,23,42,.62); border: 1px solid rgba(148,163,184,.14);
      color: #e2e8f0; font-size: 11px; outline: none; width: 100%;
      font-family: var(--font-mono);
    }
    #invest-page textarea.invest-input { padding: 8px 12px; min-height: 60px; line-height: 1.45; resize: vertical; }
    #invest-page .invest-input:focus { border-color: rgba(34,211,238,.42); box-shadow: 0 0 0 3px rgba(34,211,238,.07); }
    #invest-page .invest-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    #invest-page .invest-btn {
      min-height: 42px; padding: 0 16px; border-radius: 12px;
      font-size: 10px; font-weight: 900; letter-spacing: .03em;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      white-space: nowrap; cursor: pointer; border: 1px solid transparent;
    }
    #invest-page .invest-btn-save { color: #04111c; background: linear-gradient(90deg,#22d3ee,#3b82f6); }
    #invest-page .invest-btn-test { color: #cbd5e1; background: rgba(30,41,59,.62); border-color: rgba(148,163,184,.16); }
    #invest-page .invest-btn-scan { color: #04121f; background: linear-gradient(90deg,#34d399,#22d3ee); }
    #invest-page .invest-btn-cont { color: #111827; background: linear-gradient(90deg,#fbbf24,#fb923c); }
    #invest-page .invest-btn-reset { color: #fecdd3; background: rgba(225,29,72,.12); border-color: rgba(251,113,133,.25); }
    /* Hasil = kartu per user (bukan tabel — datanya terlalu lebar untuk tabel) */
    #invest-page .invest-warn-card {
      border: 1px solid rgba(251,113,133,.16); border-radius: 16px;
      background: linear-gradient(150deg, rgba(30,41,59,.5), rgba(15,23,42,.4));
      padding: 12px 14px;
    }
    #invest-page .invest-warn-head {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      flex-wrap: wrap; margin-bottom: 12px;
      padding-bottom: 9px; border-bottom: 1px solid rgba(255,255,255,.07);
    }
    #invest-page .invest-warn-user { font-size: 14px; font-weight: 900; color: #fecdd3; letter-spacing: .01em; }
    #invest-page .invest-warn-badge {
      flex: 0 0 auto; font-size: 9.5px; font-weight: 900; white-space: nowrap;
      padding: 5px 11px; border-radius: 999px;
      color: #fecaca; background: rgba(225,29,72,.16); border: 1px solid rgba(251,113,133,.3);
    }
    /* Sub-blok per tanggal di dalam kartu user */
    #invest-page .invest-date-group { margin-top: 10px; }
    #invest-page .invest-date-group:first-of-type { margin-top: 0; }
    #invest-page .invest-date-head {
      font-size: 11px; font-weight: 900; color: #a5f3fc; letter-spacing: .02em; margin-bottom: 6px;
    }
    #invest-page .invest-date-head span { color: var(--text-faint); font-weight: 700; }
    #invest-page .invest-hit-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
    #invest-page .invest-hit {
      font-size: 11px; line-height: 1.5; color: #e2e8f0;
      padding: 7px 10px; border-radius: 9px;
      background: rgba(2,6,23,.3); border: 1px solid rgba(255,255,255,.05);
    }
    #invest-page .invest-hit b { color: #f8fafc; font-weight: 800; }
    #invest-page .invest-hit .ihg { font-weight: 900; color: #67e8f9; }
    #invest-page .invest-hit .invest-hit-info { color: #fca5a5; font-weight: 700; white-space: nowrap; }
    #invest-page .invest-hit.is-err { color: #fda4af; }
    @media (max-width: 560px) {
      #invest-page .invest-hit .invest-hit-info { display: block; white-space: normal; margin-top: 2px; }
    }

    /* Animasi "sedang scan" di kotak hasil */
    #invest-page .invest-scanning { display: flex; align-items: center; justify-content: center; gap: 14px; text-align: left; }
    #invest-page .invest-scan-orbit {
      width: 30px; height: 30px; flex: 0 0 auto; border-radius: 50%;
      border: 3px solid rgba(52,211,153,.2); border-top-color: #34d399; border-right-color: #22d3ee;
      animation: investOrbit .9s linear infinite;
    }
    @keyframes investOrbit { to { transform: rotate(360deg); } }
    #invest-page .invest-scan-title { font-size: 12px; font-weight: 800; color: #a7f3d0; }
    #invest-page .invest-scan-sub { font-size: 10px; color: var(--text-faint); margin-top: 3px; max-width: 420px; }
    #invest-page .invest-scan-dots { display: flex; gap: 5px; margin-top: 7px; }
    #invest-page .invest-scan-dots span {
      width: 6px; height: 6px; border-radius: 50%; background: #34d399;
      animation: investDot 1s ease-in-out infinite;
    }
    #invest-page .invest-scan-dots span:nth-child(2) { animation-delay: .15s; }
    #invest-page .invest-scan-dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes investDot { 0%,100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }

    /* "Cara pakai" PGA Pending -- bisa disembunyikan (<details>) */
    details.pga-collapse > summary { list-style: none; }
    details.pga-collapse > summary::-webkit-details-marker { display: none; }
    .pga-collapse-caret { color: #94a3b8; font-size: 11px; transition: transform .2s ease; }
    details.pga-collapse[open] .pga-collapse-caret { transform: rotate(180deg); }

    /* Kartu setting yang bisa disembunyikan (<details>) */
    #invest-page details.invest-collapse { padding: 0; overflow: hidden; }
    #invest-page details.invest-collapse > summary {
      list-style: none; cursor: pointer; user-select: none;
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px;
    }
    #invest-page details.invest-collapse > summary::-webkit-details-marker { display: none; }
    #invest-page .invest-collapse-caret { color: #94a3b8; font-size: 11px; transition: transform .2s ease; flex: 0 0 auto; }
    #invest-page details.invest-collapse[open] .invest-collapse-caret { transform: rotate(180deg); }
    #invest-page .invest-collapse-body { padding: 0 16px 16px; }

    /* Progress bar scan — stripe berjalan supaya jelas "sedang jalan" antar polling */
    #invest-page #investProgressWrap { height: 8px; }
    #invest-page #investProgressBar { position: relative; overflow: hidden; }
    #invest-page #investProgressBar.invest-running::after {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(45deg, rgba(255,255,255,.28) 0 10px, transparent 10px 20px);
      animation: investBarStripe .5s linear infinite;
    }
    @keyframes investBarStripe { to { background-position: 28px 0; } }
    #invest-page #investStateBadge .fa-spin { --fa-animation-duration: .9s; }
