    // ===== Hak akses menu per user (diatur di Admin -> Users) =====
    // Cermin src/lib/menus.ts. Server tetap menolak menu yang tidak diizinkan;
    // bagian ini hanya menyembunyikan tombolnya supaya rapi.
    const MENU_ACCESS_ITEMS = [
      { key: 'result', label: 'Result', group: 'Utama' },
      { key: 'prediction', label: 'Prediksi', group: 'Utama' },
      { key: 'invest', label: 'AutoCheck Invest', group: 'Utama' },
      { key: 'auto-input', label: 'Auto Prediksi', group: 'Utama' },
      { key: 'lap-admin', label: 'Lap Admin', group: 'Laporan Harian' },
      { key: 'lap-motion', label: 'Lap Motion', group: 'Laporan Harian' },
      { key: 'pga-pending', label: 'PGA Pending', group: 'Laporan Harian' },
      { key: 'lap-mozart', label: 'Lap Mozart', group: 'Laporan Harian' },
      { key: 'activity', label: 'Aktivitas', group: 'Lainnya' },
      { key: 'livechat-sessions', label: 'Sesi Chat', group: 'Live Chat' },
      { key: 'livechat-templates', label: 'Template Balasan', group: 'Live Chat' }
    ];
    const MENU_ACCESS_KEYS = MENU_ACCESS_ITEMS.map(m => m.key);
    function menuAllowed(page) {
      const role = String((currentProfile && currentProfile.role) || '').trim().toUpperCase();
      if (page === 'home') return true;
      if (page === 'admin') return role === 'ADMIN';
      if (BOT_PAGES.includes(page)) return role === 'BOT';
      if (role === 'ADMIN') return true;
      if (LIVECHAT_PAGES.includes(page) && role !== 'OPERATOR') return false;
      const menus = currentProfile && Array.isArray(currentProfile.menus) ? currentProfile.menus : null;
      if (!menus) return true;
      if (page === 'lap-setting') return ['lap-admin', 'lap-motion', 'lap-mozart'].some(k => menus.includes(k));
      return menus.includes(page);
    }
    function setMenuVisible(el, yes) {
      if (!el) return;
      if (yes) { el.hidden = false; el.style.removeProperty('display'); }
      else { el.hidden = true; el.style.setProperty('display', 'none', 'important'); }
    }
    function applyMenuAccess() {
      if (!currentProfile) return;
      const role = String(currentProfile.role || '').trim().toUpperCase();
      if (role === 'BOT') return; // menu BOT diatur applyProfileUI
      NAV_KEYS.forEach(key => {
        if (key === 'home' || key === 'admin' || BOT_PAGES.includes(key)) return;
        setMenuVisible(document.getElementById('nav-' + key), menuAllowed(key));
      });
      // Grup sidebar disembunyikan kalau semua isinya tidak boleh.
      [['utama', ['result', 'prediction', 'invest', 'auto-input']],
       ['lapor', ['lap-admin', 'lap-motion', 'pga-pending', 'lap-mozart', 'lap-setting']],
       ['livechat', LIVECHAT_PAGES]].forEach(([group, keys]) => {
        const any = keys.some(menuAllowed);
        setMenuVisible(document.querySelector('.nav-group[data-group="' + group + '"]'), any);
        const mob = document.querySelector('.mobile-nav-item[data-mobile-group="' + group + '"]');
        if (mob) setMenuVisible(mob, any);
      });
      setMenuVisible(document.querySelector('.mobile-nav-item[data-mobile-page="activity"]'), menuAllowed('activity'));
      // "Lainnya" di HP berisi Live Chat & Admin -- sembunyikan kalau kosong.
      setMenuVisible(document.querySelector('.mobile-nav-item[data-mobile-group="more"]'), role === 'ADMIN' || LIVECHAT_PAGES.some(menuAllowed));
      // Akses cepat di Dashboard.
      document.querySelectorAll('#main-panel [onclick^="switchPage("]').forEach(el => {
        const m = String(el.getAttribute('onclick')).match(/switchPage\('([\w-]+)'\)/);
        if (m) setMenuVisible(el, menuAllowed(m[1]));
      });
    }
    window.applyMenuAccess = applyMenuAccess;
    window.menuAllowed = menuAllowed;

    function applyProfileUI() {
      const role = String((currentProfile && currentProfile.role) || '').trim().toUpperCase();
      const isAdmin = role === 'ADMIN';
      const isBot = role === 'BOT';
      const isOperatorOrAdmin = isAdmin || role === 'OPERATOR';

      const setRoleOnly = (el, allowed, display='flex') => {
        if (!el) return;
        if (allowed) {
          el.removeAttribute('hidden');
          el.style.setProperty('display', display, 'important');
        } else {
          el.setAttribute('hidden', '');
          el.style.setProperty('display', 'none', 'important');
        }
      };

      // HARD ROLE GATE: these two menus are hidden in the HTML by default.
      document.querySelectorAll('[data-role-only="ADMIN"], .admin-only').forEach(el => setRoleOnly(el, isAdmin));
      document.querySelectorAll('[data-role-only="BOT"], .bot-only').forEach(el => setRoleOnly(el, isBot));

      document.querySelectorAll('.mobile-nav-item[data-mobile-group="utama"], .mobile-nav-item[data-mobile-group="lapor"]').forEach(el => {
        el.style.display = isBot ? 'none' : '';
      });
      const mobileActivity = document.querySelector('.mobile-nav-item[data-mobile-page="activity"]');
      if (mobileActivity) mobileActivity.style.display = isBot ? 'none' : '';

            const botGroup = document.querySelector('.nav-group[data-group="bot"]');
      if (botGroup) setRoleOnly(botGroup, isBot, 'flex');

      document.querySelectorAll('.livechat-op-only').forEach(el => setRoleOnly(el, isOperatorOrAdmin));
      const livechatGroup = document.querySelector('.nav-group[data-group="livechat"]');
      if (livechatGroup) setRoleOnly(livechatGroup, isOperatorOrAdmin, 'flex');

      document.querySelectorAll('.nav-extra').forEach(el => {
        if (!el.classList.contains('admin-only') &&
            !el.classList.contains('livechat-op-only') &&
            !el.classList.contains('bot-only')) {
          setRoleOnly(el, !isBot);
        }
      });

      if (isBot) {
        document.querySelectorAll('.nav-solo, .nav-group:not([data-group="bot"])').forEach(el => setRoleOnly(el, false));
        const mw = document.getElementById('market-wrapper');
        if (mw) mw.style.display = 'none';
        if (currentPage !== 'bot-dashboard') switchPage('bot-dashboard');
        return;
      }

      if (botGroup) setRoleOnly(botGroup, false);
      document.querySelectorAll('.bot-only, [data-role-only="BOT"]').forEach(el => setRoleOnly(el, false));
      document.querySelectorAll('.activity-admin-only').forEach(el => setRoleOnly(el, isAdmin, ''));

      applyMenuAccess();
      restoreNavGroups();
      if (!window.__kdWarmed) {
        window.__kdWarmed = true;
        // Lanjutkan pantauan tarik data yang masih berjalan (mis. sesudah reload),
        // lalu siapkan data menu yang biasa dibuka -- saat browser sedang santai.
        setTimeout(() => { lapJobsFetch(); warmRecentPages(); }, 1500);
      }
      const filterGrid = document.getElementById('activityFilterGrid');
      if (filterGrid) filterGrid.classList.toggle('activity-admin-grid', isAdmin);
      const dateRow = document.getElementById('activityDateRow');
      if (dateRow) dateRow.classList.toggle('is-compact', !isAdmin);
      const scope = document.getElementById('activityScopeText');
      if (scope) scope.textContent = isAdmin
        ? 'Aktivitas semua user selama 7 hari terakhir (log lebih lama dihapus otomatis).'
        : 'Riwayat akun Anda sendiri hari ini.';
    }
    function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
    // Argumen string yang AMAN ditaruh di atribut handler inline, mis.
    // onclick="fn(${jsArg(nilai)})". JSON.stringify membuat literal JS yang valid
    // (kutip, backslash, baris baru ter-escape) lalu escapeHtml mencegah nilai
    // keluar dari atribut "...". Dulu cuma kutip tunggal yang di-escape, jadi
    // nilai berisi " (dari data scrape / livechat) bisa menyisipkan HTML.
    function jsArg(v){return escapeHtml(JSON.stringify(String(v==null?'':v)));}
    // Shim /api mengirim error server (HTTP 500, mis. sesi habis / maintenance /
    // bukan ADMIN) ke handler SUKSES sebagai {success:false,message}. Handler
    // yang mengubah state atau menampilkan "berhasil" wajib cek ini dulu.
    function apiFailed(res){return !res || res.success === false;}
    function apiMessage(res, fallback){return (res && res.message) || fallback || 'Gagal memproses permintaan.';}
    function restoreDraft(){
      let d = null;
      try { d = JSON.parse(localStorage.getItem('daygroup_draft') || 'null'); } catch (e) { d = null; }
      if (!d) return;
      const inputText = document.getElementById('inputText');
      const marketSelect = document.getElementById('marketSelect');
      const angkaInput = document.getElementById('angkaInput');
      if (inputText) inputText.value = d.text || '';
      if (marketSelect) marketSelect.value = d.market || '';
      if (angkaInput) angkaInput.value = d.angka || '';
      if (d.text) {
        try { autoGenerate(); } catch (e) {}
      }
    }
    function saveDraft(){
      try {
        const inputText = document.getElementById('inputText');
        const marketSelect = document.getElementById('marketSelect');
        const angkaInput = document.getElementById('angkaInput');
        localStorage.setItem('daygroup_draft', JSON.stringify({
          text: inputText ? inputText.value : '',
          market: marketSelect ? marketSelect.value : '',
          angka: angkaInput ? angkaInput.value : ''
        }));
      } catch (e) {}
    }
    // Debounce: dulu tiap ketukan menulis seluruh teks ke localStorage (berat untuk Result besar). Disiram juga saat tab ditutup.
    let draftTimer = null;
    function saveDraftSoon(){ clearTimeout(draftTimer); draftTimer = setTimeout(()=>{ draftTimer = null; saveDraft(); }, 300); }
    ['inputText','marketSelect','angkaInput'].forEach(id=>document.getElementById(id).addEventListener('input',saveDraftSoon));
    window.addEventListener('pagehide', ()=>{ if (draftTimer) { clearTimeout(draftTimer); draftTimer = null; saveDraft(); } });
    // Session Timeout DIHAPUS TOTAL untuk SEMUA akun (termasuk admin) — tidak ada
    // lagi logout otomatis karena tidak aktif. Fungsi ini dibiarkan ada (bukan
    // dihapus) supaya pemanggil lama (mis. applyAuthenticatedSession) tidak error;
    // isinya sengaja jadi no-op.
    function resetSessionTimer(){
      clearTimeout(inactivityTimer);
    }
    function statCards(s) {
      const arr = [
        ['Aktivitas Hari Ini', s.today],
        ['Login', s.login],
        ['Pengiriman', s.sends],
        ['Berhasil', s.success],
        ['Gagal', s.failed]
      ];
      if (s.topUser) arr.push(['User Teraktif', s.topUser]);
      if (Number(s.backupTotal || 0) > 0) arr.push(['Arsip Backup', s.backupTotal]);
      return arr.map(item => `<div class="mini-card"><div class="text-[10px] text-slate-300 font-semibold">${escapeHtml(item[0])}</div><div class="text-xl font-black mt-1 text-slate-50">${escapeHtml(item[1])}</div></div>`).join('');
    }

    function compactLogPreview(value, maxLength) {
      const text = String(value || '').replace(/\s+/g, ' ').trim();
      if (!text) return '-';
      const limit = Number(maxLength) || 90;
      return text.length > limit ? text.slice(0, limit).trim() + '…' : text;
    }

    function activityStatusBadge(status) {
      const value = String(status || 'INFO').toUpperCase();
      let cls = 'log-status-info';
      let icon = 'fa-circle-info';

      if (value === 'BERHASIL' || value === 'TERKIRIM') {
        cls = 'log-status-success';
        icon = 'fa-circle-check';
      } else if (value === 'GAGAL' || value === 'ERROR') {
        cls = 'log-status-error';
        icon = 'fa-circle-xmark';
      } else if (value === 'DIBLOKIR' || value === 'SEBAGIAN') {
        cls = 'log-status-warning';
        icon = value === 'DIBLOKIR' ? 'fa-ban' : 'fa-triangle-exclamation';
      }

      return `<span class="log-status-badge ${cls}">
        <i class="fa-solid ${icon}"></i>${escapeHtml(value)}
      </span>`;
    }

    function activityActionBadge(action) {
      const value = String(action || 'AKTIVITAS').toUpperCase();
      let icon = 'fa-bolt';

      if (value.includes('LOGIN')) icon = 'fa-right-to-bracket';
      else if (value.includes('LOGOUT')) icon = 'fa-right-from-bracket';
      else if (value.includes('SEND') || value.includes('KIRIM')) icon = 'fa-paper-plane';
      else if (value.includes('COPY')) icon = 'fa-copy';
      else if (value.includes('HALAMAN')) icon = 'fa-window-maximize';
      else if (value.includes('DUPLIKAT')) icon = 'fa-shield-halved';

      return `<span class="log-action-badge">
        <i class="fa-solid ${icon}"></i>${escapeHtml(value)}
      </span>`;
    }

    function expandableLogText(value, emptyText) {
      const full = String(value || '').trim();
      if (!full) return `<span class="text-slate-600">${escapeHtml(emptyText || '-')}</span>`;

      const preview = compactLogPreview(full, 105);
      const needsExpand = full.replace(/\s+/g, ' ').trim().length > 105 || full.includes('\n');

      if (!needsExpand) {
        return `<div class="log-plain-text">${escapeHtml(full)}</div>`;
      }

      return `<details class="log-details">
        <summary>
          <span>${escapeHtml(preview)}</span>
          <span class="log-details-label">Lihat detail</span>
        </summary>
        <div class="log-details-full">${escapeHtml(full)}</div>
      </details>`;
    }

    function renderLogs(rows, target) {
      const body = document.getElementById(target);
      if (!body) return;

      if (!Array.isArray(rows) || !rows.length) {
        body.innerHTML = '<tr><td colspan="6" class="table-empty-cell"><span class="table-empty-inner"><i class="fa-solid fa-clock-rotate-left"></i>Belum ada aktivitas yang cocok dengan filter.</span></td></tr>';
        return;
      }

      body.innerHTML = rows.map(row => {
        const dateParts = String(row[0] || '').split(' ');
        const date = dateParts[0] || '-';
        const time = dateParts.slice(1).join(' ') || '';

        return `<tr class="activity-log-row">
          <td class="log-time-cell">
            <b>${escapeHtml(date)}</b>
            <span>${escapeHtml(time)}</span>
          </td>
          <td><span class="log-user-chip"><i class="fa-solid fa-user"></i>${escapeHtml(row[1] || '-')}</span></td>
          <td>${activityActionBadge(row[2])}</td>
          <td>${activityStatusBadge(row[3])}</td>
          <td>${expandableLogText(row[4], 'Tidak ada keterangan')}</td>
          <td>${expandableLogText(row[5], 'Tidak ada data')}</td>
        </tr>`;
      }).join('');
      FX.reveal(Array.from(body.querySelectorAll('tr')).slice(0, 28), { y: 8, step: 12, duration: 320, scale: 1 });
    }

    // Riwayat aktivitas hanya punya SATU tampilan (menu Aktivitas). Dulu Admin
    // punya salinan kedua ("Dashboard & Aktivitas") dengan id adminActivity*.
    const ACTIVITY_FILTERS = ['Search','UserFilter','ActionFilter','StatusFilter','DateFrom','DateTo'];
    function activityEl(suffix) { return document.getElementById('activity' + suffix); }

    function renderSkeletonRows(target, count, cols, rowClass) {
      const body = document.getElementById(target);
      if (!body) return;
      cols = cols || 7;
      rowClass = rowClass == null ? 'activity-log-row' : rowClass;
      const row = `<tr class="${rowClass}">${Array.from({length: cols}).map(() => `<td><span class="skeleton-bar" style="width:${60 + Math.round(Math.random()*30)}%"></span></td>`).join('')}</tr>`;
      body.innerHTML = row.repeat(count || 6);
    }

    function getActivityRequest(withFacets) {
      const value = suffix => {
        const el = activityEl(suffix);
        return el ? String(el.value || '').trim() : '';
      };

      return {
        page: activityView.page,
        pageSize: activityView.pageSize,
        query: value('Search'),
        username: value('UserFilter'),
        action: value('ActionFilter'),
        status: value('StatusFilter'),
        dateFrom: value('DateFrom'),
        dateTo: value('DateTo'),
        // filterOptions (DISTINCT full-scan D1) hanya saat load manual, bukan auto-refresh
        facets: !!withFacets
      };
    }

    function fillActivitySelect(id, placeholder, values) {
      const select = document.getElementById(id);
      if (!select) return;
      if (values == null) return; // auto-refresh tanpa facets -> pertahankan opsi lama
      const current = select.value;
      const options = [`<option value="">${escapeHtml(placeholder)}</option>`]
        .concat((values || []).map(value => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`));
      select.innerHTML = options.join('');
      if ([...select.options].some(option => option.value === current)) select.value = current;
    }

    function updateActivityMeta(data) {
      const pagination = data.pagination || {page:1,totalPages:1,total:0,hasPrev:false,hasNext:false};

      const meta = activityEl('Meta');
      if (meta) {
        const scope = data.role === 'ADMIN' ? 'semua user, 7 hari terakhir' : 'akun Anda, hari ini';
        meta.textContent = `${pagination.total} aktivitas ditemukan • ${scope}`;
      }

      const label = activityEl('PageLabel');
      if (label) label.textContent = `Halaman ${pagination.page} / ${pagination.totalPages}`;

      const prev = activityEl('PrevBtn');
      const next = activityEl('NextBtn');
      if (prev) prev.disabled = !pagination.hasPrev;
      if (next) next.disabled = !pagination.hasNext;

      activityView.page = pagination.page || 1;
    }

    function applyActivityFilters() {
      activityView.page = 1;
      loadDashboard(true);
    }

    function resetActivityFilters() {
      ACTIVITY_FILTERS.forEach(suffix => {
        const el = activityEl(suffix);
        if (el) el.value = '';
      });
      activityView.page = 1;
      loadDashboard(true);
    }

    function changeActivityPage(direction) {
      activityView.page = Math.max(1, activityView.page + Number(direction || 0));
      loadDashboard(false);
    }

    let lastLogSignature = '';

    // Render data aktivitas ke DOM. Dipakai loadDashboard (fetch manual) DAN live-poll.
    function applyDashboardData(data) {
      if (!data.pagination) data.pagination = { page:1, pageSize:75, total:(data.rows||[]).length, totalPages:1, hasPrev:false, hasNext:false };

      const userStats = document.getElementById('userStats');
      if (userStats) userStats.innerHTML = statCards(data.stats);

      // Hanya render ulang tabel bila isinya benar-benar berubah -> tidak mengganggu
      // baris log yang sedang dibuka user saat auto-refresh.
      const sig = (data.rows.length ? String(data.rows[0][0]) + '|' + String(data.rows[0][4] || '') : 'empty')
        + '#' + ((data.pagination && data.pagination.total) || 0)
        + '@' + ((data.pagination && data.pagination.page) || 1);
      if (lastLogSignature !== sig) {
        renderLogs(data.rows, 'activityBody');
        lastLogSignature = sig;
      }
      updateActivityMeta(data);

      const options = data.filterOptions || null;
      fillActivitySelect('activityUserFilter', 'Semua User', options && options.usernames);
      fillActivitySelect('activityActionFilter', 'Semua Aksi', options && options.actions);
      fillActivitySelect('activityStatusFilter', 'Semua Status', options && options.statuses);

      // Form maintenance admin punya loader sendiri (loadMaintenanceState) --
      // data aktivitas bisa dari cache lama, jadi tidak dipakai untuk form itu.
      if (data.maintenance && data.role !== 'ADMIN') setMaintenanceLock(data.maintenance.enabled, data.maintenance.message);

      pageDataCache.activity = data;
      pageFetchedAt.activity = Date.now();
    }

    function loadDashboard(forceRefresh) {
      if (!currentUser) return;

      // Skeleton hanya kalau belum ada data yang bisa ditampilkan (hindari "kedip"
      // saat refresh diam-diam / polling).
      if (!pageDataCache.activity) { renderSkeletonRows('activityBody', 6, 6); lastLogSignature = ''; }
      const meta = activityEl('Meta');
      const slowNoticeTimer = setTimeout(() => {
        if (meta) meta.textContent = 'Masih memuat, data cukup banyak... mohon tunggu sebentar.';
      }, 5000);

      google.script.run
        .withSuccessHandler(data => {
          clearTimeout(slowNoticeTimer);
          if (apiFailed(data) || !data.stats || !Array.isArray(data.rows)) {
            const message = apiMessage(data, 'Format data aktivitas dari server tidak lengkap. Coba muat ulang halaman.');
            if (!pageDataCache.activity) renderLogs([], 'activityBody');
            if (meta) meta.textContent = message;
            return;
          }
          applyDashboardData(data);
        })
        .withFailureHandler(error => {
          clearTimeout(slowNoticeTimer);
          const message = (error && error.message) || 'Gagal menghubungi server.';
          if (!pageDataCache.activity) renderLogs([], 'activityBody');
          if (meta) meta.textContent = message + ' Coba muat ulang; kalau berlanjut, hubungi admin.';
          toast(message);
        })
        .getDashboardData(currentSessionToken, getActivityRequest(true));
    }

    function runActivityBackupNow() {
      const status = document.getElementById('backupActivityStatus');
      const btn = document.getElementById('logPruneBtn');
      if (status) status.textContent = 'Memangkas log lebih tua dari 7 hari...';
      if (btn) btn.disabled = true;
      google.script.run
        .withSuccessHandler(result => {
          if (btn) btn.disabled = false;
          const message = apiMessage(result, apiFailed(result) ? 'Gagal membersihkan log.' : 'Log lama sudah dibersihkan.');
          if (status) status.textContent = message;
          toast(message);
          // Jumlah baris berubah -> menu Aktivitas memuat ulang saat dibuka berikutnya.
          if (!apiFailed(result)) pageFetchedAt.activity = 0;
        })
        .withFailureHandler(error => {
          if (btn) btn.disabled = false;
          const message = (error && error.message) || 'Gagal membersihkan log.';
          if (status) status.textContent = message;
          toast(message);
        })
        .adminRunActivityBackup(currentSessionToken);
    }

    let autoPostEnabledState = null;
    function paintAutoPostToggle() {
      const btn = document.getElementById('autoPostToggleBtn');
      const status = document.getElementById('autoPostStatus');
      if (btn) {
        const on = !!autoPostEnabledState;
        btn.innerHTML = on
          ? '<i class="fa-solid fa-power-off mr-2"></i>NONAKTIFKAN AUTO POSTING'
          : '<i class="fa-solid fa-power-off mr-2"></i>AKTIFKAN AUTO POSTING';
        btn.className = (on
          ? 'bg-gradient-to-r from-rose-500 to-red-600 text-white'
          : 'bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-950')
          + ' px-4 py-3 rounded-2xl text-[10px] font-extrabold';
      }
      if (status && autoPostEnabledState !== null) {
        status.textContent = autoPostEnabledState
          ? 'Status: AKTIF — router akan mengirim tiap sesi jam selama ada operator login.'
          : 'Status: NONAKTIF — tidak ada prediksi/penutup yang dikirim otomatis.';
        status.className = 'text-[10px] mt-2 ' + (autoPostEnabledState ? 'text-emerald-400' : 'text-rose-300');
      }
    }
    function loadAutoPostStatus() {
      google.script.run
        .withSuccessHandler(d => {
          if (d && typeof d.autoPostEnabled === 'boolean') { autoPostEnabledState = d.autoPostEnabled; paintAutoPostToggle(); }
        })
        .withFailureHandler(() => {})
        .adminListActiveSessions(currentSessionToken);
    }
    function toggleAutoPost() {
      const turnOn = !autoPostEnabledState;
      const btn = document.getElementById('autoPostToggleBtn');
      if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>MENYIMPAN...'; }
      const done = (result, ok) => {
        if (btn) btn.disabled = false;
        // Status hanya dibalik kalau server benar-benar menerima perubahan.
        if (ok && !apiFailed(result)) autoPostEnabledState = turnOn;
        else ok = false;
        paintAutoPostToggle();
        toast((result && result.message) || (ok ? 'Tersimpan' : 'Gagal'));
      };
      const run = turnOn
        ? google.script.run.withSuccessHandler(r => done(r, true)).withFailureHandler(e => done({ message: (e && e.message) || 'Gagal' }, false)).setupAutoPostTriggers(currentSessionToken)
        : google.script.run.withSuccessHandler(r => done(r, true)).withFailureHandler(e => done({ message: (e && e.message) || 'Gagal' }, false)).adminSetAutoPost(currentSessionToken, false);
    }

    function showAutoPostWebhook() {
      const box = document.getElementById('autoPostWebhookBox');
      if (box) { box.style.display = 'block'; box.textContent = 'Mengambil URL webhook...'; }
      google.script.run
        .withSuccessHandler(r => {
          if (!r || !r.url || !box) { toast('Gagal mengambil URL cron'); return; }
          const times = (r.slots || []).join(', ');
          const fld = (label, val) =>

            + '<input readonly onclick="this.select()" value="' + String(val).replace(/"/g, '&quot;') + '" style="width:100%;margin-top:3px;padding:7px 9px;border-radius:9px;background:rgba(2,6,23,.55);border:1px solid rgba(34,211,238,.25);color:#a5f3fc;font-size:9px;font-family:monospace">';
          box.innerHTML =
            'Pasang di <b>cron-job.org</b> (gratis) — method <b>GET</b>, jalankan <b>tiap 1 menit</b>:'
            + fld('Auto Posting Prediksi', r.url)
            + (r.urlInvest ? fld('Pump Scan INVEST', r.urlInvest) : '')
            + '<div style="margin-top:8px">Jam sesi (' + escapeHtml(r.timezone || 'WIB') + '): <b class="text-cyan-300">' + escapeHtml(times) + '</b></div>'
            + '<div style="margin-top:4px;color:#64748b">Router memilih sendiri sesi yang jatuh tempo, susulan sampai 25 menit.</div>';
          try { navigator.clipboard.writeText(r.url); toast('URL cron auto-posting disalin'); } catch (e) {}
        })
        .withFailureHandler(e => {
          if (box) box.textContent = 'Gagal: ' + ((e && e.message) || e);
        })
        .adminGetAutoPostWebhook(currentSessionToken);
    }

    function runAutoPostNow() {
      const status = document.getElementById('autoPostStatus');
      if (status) status.textContent = 'Menjalankan router auto posting sekarang...';
      google.script.run
        .withSuccessHandler(result => {
          const message = (result && result.message) || 'Router auto posting dijalankan.';
          if (status) status.textContent = message;
          toast(message);
          loadActiveSessions();
        })
        .withFailureHandler(error => {
          const message = (error && error.message) || 'Gagal menjalankan router auto posting.';
          if (status) status.textContent = message;
          toast(message);
        })
        .adminRunAutoPostNow(currentSessionToken);
    }

    let lastSessionsSignature = '';
    function renderActiveSessions(data) {
      const meta = document.getElementById('activeSessionsMeta');
      const body = document.getElementById('activeSessionsBody');
      if (!body) return;
      const rows = (data && Array.isArray(data.sessions)) ? data.sessions : [];
      if (meta) {
        const apState = data && data.autoPostEnabled ? 'AKTIF' : 'NONAKTIF';
        meta.textContent = `${data ? data.totalUsers : 0} user online • ${data ? data.totalSessions : 0} sesi • Auto Posting: ${apState} • per ${data ? data.generatedAt : '-'}`;
      }
      const sig = JSON.stringify(rows.map(s => [s.username, s.sessions, s.expiresAt, s.autoPostEligible]));
      if (sig === lastSessionsSignature) return; // tak ada perubahan -> jangan render ulang
      lastSessionsSignature = sig;
      if (!rows.length) {
        body.innerHTML = '<tr><td colspan="7" class="p-3 text-center text-slate-500 py-6">Tidak ada user yang sedang login.</td></tr>';
        return;
      }

    let centerNoticeResolver = null;
    let centerNoticeTimer = null;
    let centerNoticeShowing = false;
    const centerNoticeQueue = [];

    // Modal ini cuma satu di DOM, jadi kalau ada pemanggilan openCenterNotice() kedua
    // saat modal pertama masih terbuka (mis. notifikasi background muncul di tengah
    // dialog konfirmasi), request kedua diantre dulu -- BUKAN menimpa resolver yang
    // sedang aktif. Kalau ditimpa, promise pemanggil pertama tidak akan pernah resolve
    // dan kode yang `await`-nya (mis. konfirmasi hapus user) nge-hang selamanya.
    function openCenterNotice(options) {
      if (centerNoticeShowing) {
        return new Promise(resolve => centerNoticeQueue.push({ options, resolve }));
      }
      return showCenterNotice(options);
    }

    function showCenterNotice(options) {
      centerNoticeShowing = true;
      const config = options || {};
      const modal = document.getElementById('centerNoticeModal');
      const iconBox = document.getElementById('centerNoticeIcon');
      const icon = iconBox.querySelector('i');
      const title = document.getElementById('centerNoticeTitle');
      const message = document.getElementById('centerNoticeMessage');
      const actions = document.getElementById('centerNoticeActions');
      const cancelBtn = document.getElementById('centerNoticeCancel');
      const confirmBtn = document.getElementById('centerNoticeConfirm');

      clearTimeout(centerNoticeTimer);

      const type = config.type || 'info';
      const iconMap = {
        info: 'fa-circle-info',
        success: 'fa-circle-check',
        warning: 'fa-triangle-exclamation',
        danger: 'fa-trash-can'
      };

      const noticeCard = modal.querySelector('.center-notice-card');
      if (noticeCard) noticeCard.classList.toggle('center-notice-alert', !!config.alert);
      iconBox.className = `center-notice-icon ${type}`;
      icon.className = `fa-solid ${iconMap[type] || iconMap.info}`;
      title.textContent = config.title || 'Informasi';
      message.textContent = config.message || '';

      confirmBtn.textContent = config.confirmText || 'OK';
      confirmBtn.className = `center-notice-btn ${type === 'danger' ? 'danger' : type === 'warning' ? 'warning' : 'primary'}`;

      const showCancel = !!config.showCancel;
      cancelBtn.style.display = showCancel ? 'block' : 'none';
      cancelBtn.textContent = config.cancelText || 'BATAL';
      actions.classList.toggle('two', showCancel);

      modal.classList.add('open');
      document.body.classList.add('modal-open');

      return new Promise(resolve => {
        centerNoticeResolver = resolve;

        const finish = answer => {
          clearTimeout(centerNoticeTimer);
          modal.classList.remove('open');
          document.body.classList.remove('modal-open');
          const resolver = centerNoticeResolver;
          centerNoticeResolver = null;
          centerNoticeShowing = false;
          if (resolver) resolver(answer);
          const next = centerNoticeQueue.shift();
          if (next) showCenterNotice(next.options).then(next.resolve);
        };

        confirmBtn.onclick = () => finish(true);
        cancelBtn.onclick = () => finish(false);

        if (config.autoCloseMs && !showCancel) {
          centerNoticeTimer = setTimeout(() => finish(true), config.autoCloseMs);
        }
      });
    }

    function notifyCenter(message, type, title) {
      return openCenterNotice({
        title: title || (type === 'success' ? 'Berhasil' : type === 'danger' ? 'Terjadi Kesalahan' : type === 'warning' ? 'Perhatian' : 'Informasi'),
        message: String(message || ''),
        type: type || 'info',
        confirmText: 'TUTUP',
        autoCloseMs: type === 'success' ? 1800 : 0
      });
    }

    function confirmCenter(options) {
      return openCenterNotice(Object.assign({
        showCancel: true,
        confirmText: 'YA, LANJUTKAN',
        cancelText: 'BATAL'
      }, options || {}));
    }

    async function deleteManagedUser(encoded) {
      const username = decodeURIComponent(encoded);
      const approved = await confirmCenter({
        type: 'danger',
        title: 'Hapus Akun User?',
        message: `Akun "${username}" akan dihapus permanen dari database panel.

Tindakan ini tidak dapat dibatalkan.`,
        confirmText: 'YA, HAPUS AKUN'
      });
      if (!approved) return;

      showActionPopup('LOADING','Menghapus User',`Sedang menghapus akun ${username}...`,'fa-user-minus');

      google.script.run
        .withSuccessHandler(result => {
          closeActionPopup();
          // Shim /api mengirim error server ke success handler -> cek dulu.
          if (apiFailed(result)) { notifyCenter(apiMessage(result, 'Gagal menghapus user.'), 'danger', 'Gagal Menghapus'); return; }
          notifyCenter(result.message || 'User berhasil dihapus.', 'success', 'User Dihapus');
          loadUsers(true);
          pageFetchedAt.activity = 0;
        })
        .withFailureHandler(error => {
          closeActionPopup();
          notifyCenter((error && error.message) || 'Gagal menghapus user.', 'danger', 'Gagal Menghapus');
        })
        .adminDeleteUser(currentSessionToken, username);
    }
