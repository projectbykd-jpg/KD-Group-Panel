  <script>
    function readStoredSessionToken() {
      try {
        const local = localStorage.getItem("daygroup_session");
        if (local) return String(local).trim();
      } catch (e) {}
      try {
        const m = document.cookie.match(/(?:^|;\s*)kd_session=([^;]+)/);
        return m ? decodeURIComponent(m[1]) : "";
      } catch (e) { return ""; }
    }
    function persistSessionToken(token) {
      const value = String(token || "").trim();
      if (!value) return;
      try { localStorage.setItem("daygroup_session", value); } catch (e) {}
      try {
        document.cookie = "kd_session=" + encodeURIComponent(value) + "; Max-Age=1814400; Path=/; SameSite=Lax" + (location.protocol === "https:" ? "; Secure" : "");
      } catch (e) {}
    }
    function clearStoredSessionToken() {
      try { localStorage.removeItem("daygroup_session"); } catch (e) {}
      try { document.cookie = "kd_session=; Max-Age=0; Path=/; SameSite=Lax" + (location.protocol === "https:" ? "; Secure" : ""); } catch (e) {}
    }

    let currentUser = "";
    let currentSessionToken = readStoredSessionToken();
    let globalPredictionsData = [];
    let globalClosingPrediction = null;
    // Data hasil 1x panggilan getBootstrapData saat panel dibuka. Dipakai sekali lalu
    // dikosongkan, supaya navigasi berikutnya tetap mengambil data segar dari server.
    let bootstrapPrefetch = null;
    let selectedClosingSlot = "";
    let resultData = {};
    let currentProfile = null;
    let pendingSendText = ""; let pendingPreview = null; let lastSendResult = null; let maintenanceState = false; let inactivityTimer; let adminUsersData = []; let activePredictionIndex = null; let activePredictionKind = "schedule"; let activeClosingSlot = ""; let lastPredictionPendingWebsites = [];
    const activityView = { page:1, pageSize:75 };

    /* ===== FX: micro-interaction bergaya animejs.com (staggered reveal, count-up,
       spring pop). Semua opsional — kalau anime.js gagal dimuat atau user pilih
       reduced-motion, panel tetap jalan normal tanpa animasi. Durasi sengaja
       pendek (<=520ms) supaya tidak menghambat kerja CS. ===== */
    const FX = {
      get on() {
        try {
          if (!window.anime) return false;
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
          return localStorage.getItem('dg_fx') !== 'off';
        } catch (e) { return !!window.anime; }
      },
      // baris/kartu muncul dengan efek naik + skala, di-stagger.
      // PENTING: begitu selesai, inline transform/opacity DIBERSIHKAN — kalau
      // dibiarkan, ratusan <tr> memegang layer compositor sendiri -> scroll berat.
      reveal(nodes, opt) {
        opt = opt || {};
        const list = (nodes && nodes.length != null) ? Array.from(nodes) : (nodes ? [nodes] : []);
        if (!list.length) return;
        const clear = () => list.forEach(n => { n.style.opacity = ''; n.style.transform = ''; n.style.willChange = ''; });
        if (!FX.on) { clear(); return; }
        anime.remove(list);
        anime({
          targets: list,
          opacity: [0, 1],
          translateY: [opt.y != null ? opt.y : 10, 0],
          scale: [opt.scale != null ? opt.scale : 0.985, 1],
          duration: opt.duration || 460,
          delay: anime.stagger(opt.step || 42, { start: opt.start || 0 }),
          easing: opt.easing || 'cubicBezier(.2,.8,.2,1)',
          complete: clear
        });
      },
      // kartu-kartu utama pada sebuah halaman
      page(container) {
        if (!container) return;
        const sel = container.querySelectorAll(':scope > .glass-card, :scope > .grid > .glass-card, :scope > div > .glass-card');
        FX.reveal(sel.length ? sel : container.querySelectorAll(':scope > *'), { y: 14, step: 55, duration: 480 });
      },
      // angka menghitung naik dari 0; format ribuan otomatis. el butuh data-fx-count.
      // Guard: HANYA jalan kalau data-fx-count = satu angka bersih (mis. "1,234"),
      // bukan string gabungan seperti "2 (2,632,014,000)" -- kalau tidak match,
      // dibiarkan apa adanya tanpa count-up supaya nilai gabungan tidak rusak.
      countUp(root) {
        const els = (root || document).querySelectorAll('[data-fx-count]');
        els.forEach(el => {
          const raw = String(el.getAttribute('data-fx-count')).trim();
          if (!/^-?[0-9][0-9,]*(\.[0-9]+)?$/.test(raw)) return;
          const to = Number(raw.replace(/,/g, '')) || 0;
          if (el.getAttribute('data-fx-done') === String(to)) return;
          el.setAttribute('data-fx-done', String(to));
          if (!FX.on) { el.textContent = to.toLocaleString('en-US'); return; }
          const obj = { v: 0 };
          anime({
            targets: obj, v: to, duration: Math.min(900, 260 + Math.log10(Math.max(to, 1)) * 220),
            easing: 'easeOutExpo',
            update: () => { el.textContent = Math.round(obj.v).toLocaleString('en-US'); }
          });
        });
      },
      // "denyut" spring kecil saat sebuah nilai berubah (pasaran, angka 2D)
      pop(el) {
        if (!el || !FX.on) return;
        anime.remove(el);
        anime({ targets: el, scale: [0.82, 1], opacity: [0.35, 1], duration: 520, easing: 'spring(1, 80, 12, 0)' });
      },
      // reveal teks huruf-per-huruf dengan "scramble" (acak) sebelum mengunci.
      // el hanya boleh berisi teks (mis. #market). Aman: kalau FX mati -> set teks biasa.
      scramble(el, opt) {
        opt = opt || {};
        if (!el) return;
        const finalText = (opt.text != null ? String(opt.text) : el.textContent) || '';
        if (!FX.on) { el.textContent = finalText; return; }
        const glyphs = opt.glyphs || 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
        const step = opt.step || 30;
        el.textContent = '';
        const spans = finalText.split('').map(ch => {
          const s = document.createElement('span');
          s.textContent = ch === ' ' ? ' ' : ch;
          s.style.display = 'inline-block';
          s.style.opacity = '0';
          el.appendChild(s);
          return { s, ch };
        });
        spans.forEach((it, i) => {
          if (it.ch === ' ') { it.s.style.opacity = '1'; return; }
          const st = { p: 0 };
          anime({
            targets: st, p: 1, duration: 460, delay: i * step + (opt.start || 0), easing: 'easeOutQuad',
            update: () => {
              it.s.style.opacity = String(Math.min(1, st.p * 2));
              it.s.textContent = st.p < 0.75 ? glyphs[(Math.random() * glyphs.length) | 0] : it.ch;
            },
            complete: () => { it.s.style.opacity = '1'; it.s.textContent = it.ch; }
          });
        });
      },
      // reveal saat elemen masuk viewport (daftar/tabel panjang). Sekali jalan.
      scrollReveal(nodes, opt) {
        const list = FX._list ? FX._list(nodes) : ((nodes && nodes.length != null) ? Array.from(nodes) : (nodes ? [nodes] : []));
        if (!list.length) return;
        if (!FX.on || !('IntersectionObserver' in window)) { list.forEach(n => { n.style.opacity=''; n.style.transform=''; }); return; }
        list.forEach(n => { n.style.opacity = '0'; });
        const io = new IntersectionObserver((entries, obs) => {
          const vis = entries.filter(e => e.isIntersecting).map(e => e.target);
          if (vis.length) { FX.reveal(vis, opt || { y: 14, step: 26, duration: 420 }); vis.forEach(t => obs.unobserve(t)); }
        }, { rootMargin: '0px 0px -6% 0px', threshold: 0.04 });
        list.forEach(n => io.observe(n));
      },
      _list(nodes) { return (nodes && nodes.length != null) ? Array.from(nodes) : (nodes ? [nodes] : []); },
      // urutan masuk saat panel terbuka (login / resume sesi)
      enter() {
        if (!FX.on) return;
        try {
          const tl = anime.timeline({ easing: 'cubicBezier(.2,.8,.2,1)', duration: 520 });
          const header = document.querySelector('#app-container .header-frozen');
          const sidebar = document.querySelector('#app-container .sidebar-frozen');
          const navs = document.querySelectorAll('#app-container .nav-group, #app-container .nav-solo');
          const content = document.querySelectorAll('#main-panel > .grid > *, #main-panel > .glass-card');
          if (sidebar) tl.add({ targets: sidebar, opacity: [0, 1], translateX: [-18, 0] }, 0);
          if (header) tl.add({ targets: header, opacity: [0, 1], translateY: [-14, 0] }, 60);
          if (navs.length) tl.add({ targets: navs, opacity: [0, 1], translateX: [-10, 0], delay: anime.stagger(38) }, 140);
          if (content.length) tl.add({ targets: content, opacity: [0, 1], translateY: [14, 0], scale: [0.98, 1], delay: anime.stagger(50) }, 220);
        } catch (e) {}
      }
    };

    /* ===== Navigasi instan + auto-refresh "realtime" (polling adaptif) =====
       Apps Script tak punya WebSocket/SSE, jadi panel polling 1 endpoint gabungan
       (getLivePanelData) dengan interval yang menyesuaikan keaktifan user & tab. */
    let currentPage = 'home';
    let currentAdminPanel = 'users';                        // tab admin yang sedang dibuka
    const pageDataCache = { activity:null };               // hasil render terakhir per halaman
    const pageFetchedAt = { activity:0, prediction:0, users:0, sesi:0, invest:0, bot:0 };
    let headerSummaryLoadedOnce = false;
    let livePollTimer = null;
    let livePollInFlight = false;
    let livePollStartedAt = 0;
    let livePollFailStreak = 0;
    let lastUserActivityAt = Date.now();
    const NAV_FRESH_MS = 12000;   // data < 12 dtk dianggap masih segar saat pindah menu
    const shioIcons = { "KUDA": "🐴", "ULAR": "🐍", "NAGA": "🐉", "KELINCI": "🐇", "HARIMAU": "🐅", "KERBAU": "🐃", "TIKUS": "🐀", "BABI": "🐖", "ANJING": "🐕", "AYAM": "🐓", "MONYET": "🐒", "KAMBING": "🐐" };
    // =========================================================
    // DYNAMIC WEBSITE THEME ENGINE V3 — FINAL 12 WEBSITE PRESETS + SIDEBAR LOGOS
    // Theme dan logo mengikuti website yang diakses user.
    // =========================================================
    const SITE_THEME_PRESETS = {
      HUGO:  {name:'HUGOTOGEL', primary:'#0FA7F4', secondary:'#1B7DD6', accent:'#25D5FF', bg:'#060E15', panel:'#0E2A5D'},
      FOLA:  {name:'FOLATOTO', primary:'#2593CF', secondary:'#1B56B1', accent:'#0FA7F4', bg:'#07121A', panel:'#13366D'},
      LIMA:  {name:'LIMATOGEL', primary:'#41e0ff', secondary:'#19b5ff', accent:'#ffe34f', bg:'#08131f', panel:'#102436'},
      SOHO:  {name:'SOHOTOGEL', primary:'#8dfd27', secondary:'#39d353', accent:'#ffd447', bg:'#081108', panel:'#122112'},
      RETRO: {name:'RETROTOGEL', primary:'#ffd84f', secondary:'#ffb100', accent:'#ff5449', bg:'#120d08', panel:'#24190f'},
      YEL:   {name:'YELTOTO', primary:'#b054ff', secondary:'#712bff', accent:'#ffd64f', bg:'#190624', panel:'#2b0f42'},
      DODO:  {name:'DODOTOGEL', primary:'#ff432e', secondary:'#c41212', accent:'#ffc233', bg:'#180607', panel:'#2a0d10'},
      AXIS:  {name:'AXISTOGEL', primary:'#ff9a1f', secondary:'#ff6a00', accent:'#ffd64a', bg:'#180d07', panel:'#2b160d'},
      REMBO: {name:'REMBOTOGEL', primary:'#ff4b33', secondary:'#ff9a1f', accent:'#ffd74e', bg:'#160607', panel:'#2a0e10'},
      HELEN: {name:'HELEN555', primary:'#c288ff', secondary:'#8d4dff', accent:'#f7d9a4', bg:'#171022', panel:'#2a1d3d'},
      XO:    {name:'XOTOGEL', primary:'#34d9ff', secondary:'#1eb8c9', accent:'#86efac', bg:'#07151a', panel:'#0e242b'},
      SENJA: {name:'SENJATOGEL', primary:'#ff9f43', secondary:'#ff5ca8', accent:'#b46cff', bg:'#1b0c17', panel:'#301626'}
    };

    const SITE_THEME_ALIASES = {
      HUGO:'HUGO', HUGOTOGEL:'HUGO',
      FOLA:'FOLA', FOLATOTO:'FOLA',
      LIMA:'LIMA', LIMATOGEL:'LIMA',
      SOHO:'SOHO', SOHOTOGEL:'SOHO',
      RETRO:'RETRO', RETROTOGEL:'RETRO',
      YEL:'YEL', YELTOTO:'YEL',
      DODO:'DODO', DODOTOGEL:'DODO',
      AXIS:'AXIS', AXISTOGEL:'AXIS',
      REMBO:'REMBO', REMBOTOGEL:'REMBO',
      HELEN:'HELEN', HELEN555:'HELEN', HELENTOGEL:'HELEN',
      XO:'XO', XOTOGEL:'XO',
      SENJA:'SENJA', SENJATOGEL:'SENJA'
    };

    const SITE_LOGO_PRESETS = {
      HUGO:{single:'/HUGO.svg', pair:'/HUGO.svg'},
      FOLA:{single:'/FOLA.svg', pair:'/FOLA.svg'},
      REMBO:{single:'/REMBO.svg', pair:'/REMBO.svg'},
      HELEN:{single:'/HELEN.svg', pair:'/HELEN.svg'},
      DODO:{single:'/DODO.svg', pair:'/DODO.svg'},
      AXIS:{single:'/AXIS.svg', pair:'/AXIS.svg'},
      RETRO:{single:'/RETRO.svg', pair:'/RETRO.svg'},
      YEL:{single:'/YEL.svg', pair:'/YEL.svg'},
      LIMA:{single:'/LIMA.svg', pair:'/LIMA.svg'},
      SOHO:{single:'/SOHO.svg', pair:'/SOHO.svg'},
      XO:{single:'/XO.svg', pair:'/XO.svg'},
      SENJA:{single:'/SENJA.svg', pair:'/SENJA.svg'}
    };

    function normalizeThemeWebsite(value) {
      const raw = String(value || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
      return SITE_THEME_ALIASES[raw] || raw;
    }

    function hexToRgbTuple(hex) {
      const clean = String(hex || '#000000').replace('#','');
      const full = clean.length === 3 ? clean.split('').map(x => x+x).join('') : clean.padEnd(6,'0').slice(0,6);
      return [parseInt(full.slice(0,2),16)||0, parseInt(full.slice(2,4),16)||0, parseInt(full.slice(4,6),16)||0];
    }

    function rgbTupleToHex(rgb) {
      return '#' + rgb.map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
    }

    function mixThemeColor(colors, offset) {
      if (!colors.length) return '#22d3ee';
      const tuples = colors.map(hexToRgbTuple);
      const shifted = tuples.map((c,i) => c.map((v,k) => Math.min(255, v * (1 + (((i+k+offset)%3)-1) * .035))));
      return rgbTupleToHex([0,1,2].map(k => shifted.reduce((s,c)=>s+c[k],0)/shifted.length));
    }

    function setThemeCssVariable(name, hex) {
      const root = document.documentElement;
      root.style.setProperty(name, hex);
      root.style.setProperty(name + '-rgb', hexToRgbTuple(hex).join(','));
    }

    function buildWebsiteTheme(websites) {
      const keys = [...new Set((Array.isArray(websites) ? websites : String(websites || '').split(','))
        .map(normalizeThemeWebsite).filter(Boolean))];
      const themes = keys.map(k => SITE_THEME_PRESETS[k]).filter(Boolean);

      if (!themes.length) {
        return {keys:[], names:['KD-GROUP'], primary:'#22d3ee', secondary:'#3b82f6', accent:'#f472b6', bg:'#020617', panel:'#0f172a', fusion:false};
      }
      if (themes.length === 1) {
        const t = themes[0];
        return {keys, names:[t.name], primary:t.primary, secondary:t.secondary, accent:t.accent, bg:t.bg, panel:t.panel, fusion:false};
      }

      // Multi-site final logic:
      // - website pertama = theme dominan
      // - website kedua = warna sekunder utama
      // - website ketiga dan seterusnya = penguat accent
      // Background/panel dirata-ratakan agar tetap elegan dan tidak berantakan.
      const primary = themes[0].primary;
      const secondary = themes[1].secondary || themes[1].primary || themes[0].secondary;
      const accent = themes.length === 2 ? (themes[1].accent || themes[0].accent) : mixThemeColor(themes.map(t=>t.accent || t.primary), 1);
      const bg = mixThemeColor(themes.map(t=>t.bg), 2);
      const panel = mixThemeColor(themes.map(t=>t.panel), 0);
      return {keys, names:themes.map(t=>t.name), primary, secondary, accent, bg, panel, fusion:true};
    }


    function renderSidebarSiteLogos(websites) {
      const wrap = document.getElementById('sidebar-site-logos');
      if (!wrap) return [];
      const keys = [...new Set((Array.isArray(websites) ? websites : String(websites || '').split(','))
        .map(normalizeThemeWebsite).filter(key => !!SITE_LOGO_PRESETS[key]))];

      if (!keys.length) {
        wrap.style.display = 'none';
        wrap.innerHTML = '';
        return [];
      }

      if (keys.length === 1) {
        const key = keys[0];
        const meta = SITE_LOGO_PRESETS[key];
        wrap.innerHTML = `
          <div class="site-logo-single">
            <div class="site-logo-item" title="${escapeHtml((SITE_THEME_PRESETS[key] && SITE_THEME_PRESETS[key].name) || key)}">
              <img src="${meta.single}" alt="${escapeHtml(key)} logo" loading="lazy" decoding="async" referrerpolicy="no-referrer">
            </div>
          </div>`;
      } else {
        const shown = keys.slice(0, 2);
        const logoItems = shown.map(key => {
          const meta = SITE_LOGO_PRESETS[key];
          return `
            <div class="site-logo-item" title="${escapeHtml((SITE_THEME_PRESETS[key] && SITE_THEME_PRESETS[key].name) || key)}">
              <img src="${meta.pair}" alt="${escapeHtml(key)} logo" loading="lazy" decoding="async" referrerpolicy="no-referrer">
            </div>`;
        }).join('');
        wrap.innerHTML = `
          <div class="site-logo-pair">${logoItems}</div>
          ${keys.length > 2 ? `<div class="site-logo-more"><i class="fa-solid fa-layer-group"></i>+${keys.length - 2} website</div>` : ''}`;
      }
      wrap.style.display = 'block';
      return keys;
    }

        function renderSessionWebsites(websites) {
      const nameEl = document.getElementById('session-sites-name');
      const logosEl = document.getElementById('session-logos');
      if (!nameEl || !logosEl) return;

      const rawSites = Array.isArray(websites)
        ? websites
        : String(websites || '').split(',');

      const rawKeys = [...new Set(rawSites
        .map(v => String(v || '').trim())
        .filter(Boolean))];

      const keys = [...new Set(
        rawKeys
          .map(normalizeThemeWebsite)
          .filter(key => !!SITE_THEME_PRESETS[key])
      )];

      // Jangan pernah membuat header kosong. Jika preset logo belum ada,
      // tetap tampilkan nama website dari profil user.
      const displayNames = rawKeys.map(v => {
        const key = normalizeThemeWebsite(v);
        return SITE_THEME_PRESETS[key]?.name || v.trim().toUpperCase();
      });

      if (!displayNames.length) {
        nameEl.textContent = '-';
        logosEl.innerHTML = '';
        return;
      }

      nameEl.textContent = displayNames.join(' + ');

      logosEl.innerHTML = rawKeys.map(raw => {
        const key = normalizeThemeWebsite(raw);
        const meta = SITE_LOGO_PRESETS[key];
        const label = SITE_THEME_PRESETS[key]?.name || raw.trim().toUpperCase();

        if (!meta || !meta.single) {
          return `
            <div class="session-logo-item" title="${escapeHtml(label)}">
              <div class="session-logo-fallback"><i class="fa-solid fa-globe"></i></div>
              <span>${escapeHtml(label)}</span>
            </div>`;
        }

        return `
          <div class="session-logo-item" title="${escapeHtml(label)}">
            <img src="${meta.single}" alt="${escapeHtml(label)}" loading="eager" decoding="async" referrerpolicy="no-referrer">
            <span>${escapeHtml(label)}</span>
          </div>`;
      }).join('');
    }

    function applyWebsiteTheme(websites) {
      const theme = buildWebsiteTheme(websites || (currentProfile && currentProfile.websites) || []);
      document.body.classList.add('theme-dynamic');
      document.body.classList.toggle('theme-fusion', !!theme.fusion);
      document.body.dataset.themeSites = theme.keys.join(',');
      setThemeCssVariable('--theme-primary', theme.primary);
      setThemeCssVariable('--theme-secondary', theme.secondary);
      setThemeCssVariable('--theme-accent', theme.accent);
      setThemeCssVariable('--theme-bg', theme.bg);
      setThemeCssVariable('--theme-panel', theme.panel);
      document.documentElement.style.setProperty('--theme-panel-rgb', hexToRgbTuple(theme.panel).join(','));

      const badge = document.getElementById('theme-sites');
      const label = document.getElementById('theme-sites-label');
      if (label) {
        const max = 3;
        const shown = theme.names.slice(0,max);
        label.textContent = shown.join(' + ') + (theme.names.length > max ? ` +${theme.names.length-max}` : '');
        label.title = theme.names.join(' + ');
      }
      if (badge) badge.style.display = currentProfile ? 'inline-flex' : 'none';
      // Sidebar memakai key theme yang sudah dikenali. Header wajib memakai
      // data website asli dari profil user agar website user tidak pernah hilang
      // hanya karena preset theme/logo belum tersedia.
      const rawWebsites = websites || (currentProfile && currentProfile.websites) || [];
      renderSidebarSiteLogos(theme.keys);
      renderSessionWebsites(rawWebsites);
      return theme;
    }

    function resetWebsiteTheme() {
      document.body.classList.remove('theme-fusion');
      applyWebsiteTheme([]);
      const badge = document.getElementById('theme-sites');
      if (badge) badge.style.display = 'none';
      const logoWrap = document.getElementById('sidebar-site-logos');
      if (logoWrap) { logoWrap.style.display = 'none'; logoWrap.innerHTML = ''; }
    }


    function clearLocalSession() {
      clearStoredSessionToken();
      // Safari/iOS Private Browsing atau kebijakan storage tertentu dapat
      // melempar saat localStorage ditulis/dihapus. Storage tidak boleh pernah
      // memblokir transisi login/logout atau membuat halaman menjadi blank.
      try { localStorage.removeItem("daygroup_user"); } catch (e) {}
      try { localStorage.removeItem("daygroup_profile"); } catch (e) {}
      currentSessionToken = "";
      currentUser = "";
      currentProfile = null;
      resetWebsiteTheme();
    }

    function resetSidebarScroll() {
      const sidebar = document.querySelector('#app-container > .sidebar-frozen');
      if (!sidebar) return;
      sidebar.scrollTop = 0;
      sidebar.scrollLeft = 0;
    }

    // Pastikan seluruh menu normal langsung "mount" setelah autentikasi.
    // CSS legacy menyembunyikan .nav-extra sebagai default; jangan menunggu
    // refresh/repaint browser untuk membuat menu terlihat.
    function syncSidebarAfterLogin() {
      const nav = document.querySelector('#app-container .nav-groups');
      if (!nav) return;

      const role = String((currentProfile && currentProfile.role) || '').trim().toUpperCase();
      const isAdmin = role === 'ADMIN';
      const isBot = role === 'BOT';
      const isOperatorOrAdmin = isAdmin || role === 'OPERATOR';

      const show = (el, yes, display) => {
        if (!el) return;
        if (yes) {
          el.hidden = false;
          el.style.setProperty('display', display || 'block', 'important');
        } else {
          el.hidden = true;
          el.style.setProperty('display', 'none', 'important');
        }
      };

      const home = document.getElementById('nav-home');
      const automation = nav.querySelector('.nav-group[data-group="utama"]');
      const lapor = nav.querySelector('.nav-group[data-group="lapor"]');
      const activity = document.getElementById('nav-activity');
      const admin = document.getElementById('nav-admin');
      const bot = nav.querySelector('.nav-group[data-group="bot"]');
      const livechat = nav.querySelector('.nav-group[data-group="livechat"]');

      if (isBot) {
        show(home, false);
        show(automation, false, 'flex');
        show(lapor, false, 'flex');
        show(activity, false);
        show(admin, false);
        show(livechat, false, 'flex');
        show(bot, true, 'flex');
        bot.querySelectorAll('.nav-group-body > button').forEach(btn => show(btn, true, 'flex'));
        return;
      }

      show(home, true, 'flex');
      show(automation, true, 'flex');
      show(lapor, true, 'flex');
      show(activity, true, 'flex');
      show(bot, false, 'flex');
      show(admin, isAdmin, 'flex');
      show(livechat, isOperatorOrAdmin, 'flex');

      automation && automation.querySelectorAll('.nav-group-body > button').forEach(btn => show(btn, true, 'flex'));
      lapor && lapor.querySelectorAll('.nav-group-body > button').forEach(btn => show(btn, true, 'flex'));
      livechat && livechat.querySelectorAll('.nav-group-body > button').forEach(btn => show(btn, isOperatorOrAdmin, 'flex'));

    function openLoginScreen(message) {
      resetSidebarScroll();
      document.getElementById('app-container').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
      document.body.classList.add('justify-center');
      const maintModal = document.getElementById('maintenanceModal');
      if (maintModal) maintModal.classList.remove('open');
      document.body.classList.remove('modal-open');
      if (message) document.getElementById('login-err').innerText = message;
    }

    function applyAuthenticatedSession(res, tokenOverride) {
      currentSessionToken = String(tokenOverride || res.sessionToken || currentSessionToken || '');
      currentUser = String(res.user || res.username || '');
      // Profil sesi adalah sumber kebenaran. Normalisasi websites di sini
      // supaya header selalu membaca assignment user terbaru dari server,
      // termasuk format JSON/string yang mungkin datang dari versi backend lama.
      const rawProfile = (res && res.profile && typeof res.profile === 'object') ? res.profile : res;
      const normalizeWebsites = (value) => {
        if (Array.isArray(value)) return value.flatMap(v => String(v ?? '').split(',')).map(v => v.trim()).filter(Boolean);
        if (typeof value === 'string') {
          const s = value.trim();
          if (!s) return [];
          try {
            const parsed = JSON.parse(s);
            if (Array.isArray(parsed)) return parsed.flatMap(v => String(v ?? '').split(',')).map(v => v.trim()).filter(Boolean);
          } catch (e) {}
          return s.split(',').map(v => v.trim()).filter(Boolean);
        }
        return [];
      };
      const serverWebsites = normalizeWebsites(rawProfile && rawProfile.websites);
      const sessionProfile = Object.assign({}, rawProfile || res, { websites: serverWebsites });
      currentProfile = sessionProfile;
      res = sessionProfile;
      persistSessionToken(currentSessionToken);
      shioMapLoad();
      // Cache sesi hanya optimasi resume; kegagalan storage tidak boleh
      // menghentikan render panel setelah autentikasi berhasil.
      try { localStorage.setItem("daygroup_user", currentUser); } catch (e) {}
      try { localStorage.setItem("daygroup_profile", JSON.stringify(res)); } catch (e) {}
      const loginScreen = document.getElementById('login-screen');
      const appContainer = document.getElementById('app-container');
      if (loginScreen) {
        loginScreen.style.setProperty('display', 'none', 'important');
      }
      if (appContainer) {
        appContainer.hidden = false;
        appContainer.style.setProperty('display', 'flex', 'important');
      }
      document.body.classList.remove('justify-center');

      // Setelah login, mulai dari posisi paling atas agar Dashboard/Automation/
      // Laporan Harian tidak ikut "tertinggal" di posisi scroll sesi sebelumnya.
      requestAnimationFrame(() => resetSidebarScroll());

      const sidebarUser = document.getElementById('sidebar-user');
      if (sidebarUser) sidebarUser.innerText = currentUser.toUpperCase();
      const sessionAdmin = document.getElementById('session-admin-name');
      if (sessionAdmin) sessionAdmin.textContent = currentUser.toUpperCase();
      // masuk panel: sidebar dari kiri, header dari atas, menu & konten di-stagger
      setTimeout(() => FX.enter(), 30);
      applyWebsiteTheme(sessionProfile.websites);
      // switchPage('home') sudah memanggil loadHeaderSummary() di bagian akhirnya,
      // jadi tidak perlu dipanggil lagi di sini (dulu jadi 2x panggil server).
      const sessionRole = String((res && res.role) || '').trim().toUpperCase();
      const botOnly = sessionRole === 'BOT';

      // Terapkan role SEBELUM navigasi pertama, lalu ulangi sesudah render.
      // Ini mencegah menu terlihat setengah/tertinggal saat transisi login.
      applyProfileUI();
      syncSidebarAfterLogin();
      restoreDraft();
      resetSessionTimer();
      switchPage(botOnly ? 'bot-dashboard' : 'home');
      applyProfileUI();
      syncSidebarAfterLogin();

      // Re-assert beberapa frame setelah DOM/layout repaint agar login pertama
      // tidak membutuhkan browser refresh untuk menampilkan menu.
      requestAnimationFrame(() => {
        syncSidebarAfterLogin();
        resetSidebarScroll();
      });
      setTimeout(() => {
        syncSidebarAfterLogin();
        resetSidebarScroll();
      }, 120);
      setTimeout(() => syncSidebarAfterLogin(), 500);

      // Kunci maintenance dievaluasi begitu panel terbuka (login / resume sesi).
      if (res && res.maintenance) setMaintenanceLock(res.maintenance.enabled, res.maintenance.message);
      if (!botOnly) startLivePolling();
    }

    /* ===== MODE MAINTENANCE — overlay otomatis untuk NON-ADMIN =====
       Dipanggil dari: login, resume sesi, live-poll, dan render dashboard.
       Muncul/hilang sendiri tanpa refresh. Admin tidak pernah melihat overlay ini. */
    function setMaintenanceLock(enabled, message) {
      const modal = document.getElementById('maintenanceModal');
      if (!modal) return;
      const isAdmin = !!(currentProfile && currentProfile.role === 'ADMIN');
      // Untuk ADMIN, jangan sentuh maintenanceState (dikelola switch + saveMaintenance
      // sebagai optimistic UI); admin tidak pernah melihat overlay.
      if (isAdmin) return;
      maintenanceState = !!enabled;
      const wasOpen = modal.classList.contains('open');

      if (enabled && currentUser) {
        const msgEl = document.getElementById('maintenanceModalMessage');
        if (msgEl) msgEl.textContent = String(message || 'Panel sedang dalam pemeliharaan. Mohon tunggu sebentar.');
        if (!wasOpen) {
          modal.classList.add('open');
          document.body.classList.add('modal-open');
        }
      } else if (wasOpen) {
        modal.classList.remove('open');
        if (!document.querySelector('.modal-shell.open')
            && !document.getElementById('centerNoticeModal').classList.contains('open')
            && document.getElementById('actionPopup').style.display === 'none') {
          document.body.classList.remove('modal-open');
        }
        if (!enabled && currentUser) toast('Panel kembali aktif');
      }
    }

    function renderHeaderSummary(box, data) {
      if (!box) return;
      const s = (data && data.stats) || {};
      const failed = Number(s.failed || 0);

        <span class="header-stat"><span class="header-stat-dot ok"></span><b data-fx-count="${Number(s.success||0)}">${Number(s.success||0)}</b>&nbsp;Berhasil</span>
        <span class="header-stat"><span class="header-stat-dot ${failed > 0 ? 'bad' : 'ok'}"></span><b data-fx-count="${failed}">${failed}</b>&nbsp;Gagal</span>
        <span class="header-stat"><span class="header-stat-dot info"></span><b data-fx-count="${Number(s.sends||0)}">${Number(s.sends||0)}</b>&nbsp;Pengiriman</span>
        <span class="header-stat"><span class="header-stat-dot info"></span><b data-fx-count="${Number(s.today||0)}">${Number(s.today||0)}</b>&nbsp;Total Aktivitas</span>

    function renderHomeDashboard(data) {
      const stats = (data && data.stats) || {};
      const setCount = (id, value) => {
        const el = document.getElementById(id);
        if (!el) return;
        const n = Number(value || 0);
        el.setAttribute('data-fx-count', String(n));
        el.textContent = n.toLocaleString('en-US');
      };

      setCount('homeStatSuccess', stats.success);
      setCount('homeStatFailed', stats.failed);
      setCount('homeStatSends', stats.sends);
      setCount('homeStatToday', stats.today);
      setCount('homeMiniSends', stats.sends);
      setCount('homeMiniToday', stats.today);

      // Rasio sukses (berhasil / (berhasil + gagal)) -> donat
      const okN = Number(stats.success || 0), badN = Number(stats.failed || 0);
      const pct = (okN + badN) ? Math.round(okN * 100 / (okN + badN)) : null;
      const arc = document.getElementById('homeDonutArc'), pctEl = document.getElementById('homeDonutPct');
      if (arc) arc.setAttribute('stroke-dasharray', (pct == null ? 0 : pct) + ' 100');
      if (pctEl) pctEl.textContent = pct == null ? '–' : pct + '%';
      // Salam sesuai jam WIB + tanggal
      const wib = new Date(Date.now() + (7 * 60 + new Date().getTimezoneOffset()) * 60000);
      const hh = wib.getHours();
      const greet = hh < 4 ? 'Selamat malam' : hh < 11 ? 'Selamat pagi' : hh < 15 ? 'Selamat siang' : hh < 19 ? 'Selamat sore' : 'Selamat malam';
      const gEl = document.getElementById('homeGreeting'); if (gEl) gEl.textContent = greet + ', ' + (currentUser || 'User');
      const dEl = document.getElementById('homeGreetDate');
      if (dEl) dEl.textContent = wib.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      const roleEl = document.getElementById('homeRoleChip');
      if (roleEl) roleEl.innerHTML = '<i class="fa-solid fa-shield-halved"></i>' + escapeHtml(String((currentProfile && currentProfile.role) || 'USER'));
      const mEl = document.getElementById('homeMaintPill'); if (mEl) mEl.hidden = !(data && data.maintenance && data.maintenance.enabled);

      const userEl = document.getElementById('homeDashboardUser');
      if (userEl) userEl.innerHTML = '<i class="fa-solid fa-user"></i>' + escapeHtml(currentUser || 'User');

      const syncEl = document.getElementById('homeDashboardSync');
      if (syncEl) {
        const now = new Date();
        syncEl.innerHTML = '<i class="fa-solid fa-rotate"></i>Sync ' + now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      }

      const list = document.getElementById('homeActivityList');
      if (!list) return;
      const rows = Array.isArray(data && data.rows) ? data.rows.slice(0, 6) : [];
      if (!rows.length) {
        list.innerHTML = '<div class="home-activity-empty"><i class="fa-solid fa-inbox"></i> Belum ada aktivitas terbaru.</div>';
        return;
      }

      list.innerHTML = rows.map(row => {
        const rawTs = String(row[0] || '-');
        const parts = rawTs.split(' ');
        const time = parts.slice(1).join(' ') || parts[0] || '-';
        const action = String(row[2] || 'Aktivitas');
        const status = String(row[3] || 'INFO').toUpperCase();
        const detail = String(row[4] || row[5] || 'Tidak ada keterangan');
        const ok = /(BERHASIL|TERKIRIM|SUCCESS|SUKSES)/i.test(status);
        const bad = /(GAGAL|ERROR|FAILED|FAIL)/i.test(status);
        const icon = bad ? 'fa-triangle-exclamation' : ok ? 'fa-circle-check' : 'fa-bolt';
        const tone = bad ? 'bad' : ok ? 'ok' : 'info';
        return '<div class="home-activity-row">' +
          '<span class="home-activity-icon ' + tone + '"><i class="fa-solid ' + icon + '"></i></span>' +
          '<div class="min-w-0 flex-1">' +
            '<div class="home-activity-top"><b>' + escapeHtml(action) + '</b><span>' + escapeHtml(time) + '</span></div>' +
            '<div class="home-activity-detail">' + escapeHtml(compactLogPreview(detail, 120)) + '</div>' +
          '</div>' +
        '</div>';
      }).join('');

      const nodes = list.querySelectorAll('.home-activity-row');
      FX.reveal(nodes, { y: 8, step: 40, duration: 360, scale: 0.99 });
      FX.countUp(document.getElementById('homeDashboardStats'));
    }

    // ---------- Dashboard: grafik per jam, jadwal prediksi, top operator ----------
    let homeInsightsSig = '';
    function renderHomeInsights(d) {
      if (!d || !d.success) return;
      const sc = document.getElementById('homeHourlyScope'); if (sc) sc.textContent = d.scope === 'all' ? 'Total semua user' : 'Akun Anda';
      const sig = JSON.stringify([d.scope, d.hourly, d.hourlyFailed, d.topUsers, d.schedule, d.closing, Math.floor((d.nowMinutes || 0) / 5)]);
      if (sig === homeInsightsSig) return; // tidak ada yang berubah -> jangan gambar ulang
      homeInsightsSig = sig;
      const nowH = Math.floor((d.nowMinutes || 0) / 60);
      const max = Math.max(1, ...d.hourly);
      const bars = document.getElementById('homeHourly');
      if (bars) bars.innerHTML = d.hourly.map((n, h) => {
        const bad = d.hourlyFailed[h] || 0, ok = Math.max(0, n - bad);
        const ph = n ? Math.max(6, Math.round(n * 100 / max)) : 0;           // tinggi total (%)
        const badPct = n ? Math.round(bad * 100 / n) : 0;
        return `<div class="dash-bar ${n ? '' : 'empty'} ${h === nowH ? 'now' : ''}" title="${String(h).padStart(2, '0')}:00 — ${n} aktivitas${bad ? ', ' + bad + ' gagal' : ''}">
          <i class="bad" style="height:${ph * badPct / 100}%"></i><i class="ok" style="height:${ph - ph * badPct / 100}%"></i></div>`;
      }).join('');
      // Jadwal: sesi + kata penutup, urut jam; yang sudah lewat = selesai, pertama yang belum = berikutnya
      const items = (d.schedule || []).map(x => ({ jam: x.jam, nama: x.nama, kind: 'slot', total: x.total }))
        .concat((d.closing || []).map(j => ({ jam: j, nama: 'Kata-kata penutup', kind: 'close' })))
        .sort((a, b) => a.jam.localeCompare(b.jam));
      const mins = j => { const p = j.split(':'); return Number(p[0]) * 60 + Number(p[1]); };
      let nextIdx = items.findIndex(x => mins(x.jam) > (d.nowMinutes || 0));
      const box = document.getElementById('homeSchedule');
      if (box) box.innerHTML = items.map((x, i) => {
        const st = mins(x.jam) <= (d.nowMinutes || 0) ? 'done' : (i === nextIdx ? 'next' : '');
        const badge = st === 'done' ? 'SELESAI' : st === 'next' ? 'BERIKUTNYA' : (x.kind === 'slot' ? x.total + ' pasaran' : 'NANTI');
        return `<div class="dash-slot ${st} ${x.kind === 'close' ? 'close' : ''}"><span class="t">${escapeHtml(x.jam)}</span><span class="dot"></span><span class="n" title="${escapeHtml(x.nama)}">${escapeHtml(x.nama)}</span><span class="b">${badge}</span></div>`;
      }).join('') || '<div class="home-activity-empty">Belum ada jadwal.</div>';
      const chip = document.getElementById('homeNextSlot');
      if (chip) {
        if (nextIdx < 0) { chip.className = 'dashboard-chip'; chip.innerHTML = '<i class="fa-solid fa-check-double"></i>Semua sesi hari ini selesai'; }
        else {
          const diff = mins(items[nextIdx].jam) - (d.nowMinutes || 0), h = Math.floor(diff / 60), m = diff % 60;
          chip.className = 'dashboard-chip is-next';
          chip.innerHTML = '<i class="fa-solid fa-hourglass-half"></i>Berikutnya ' + escapeHtml(items[nextIdx].jam) + ' · ' + (h ? h + 'j ' : '') + m + 'm lagi';
        }
      }
      const top = document.getElementById('homeTopCard'), rank = document.getElementById('homeTopUsers');
      const isAdmin = !!(currentProfile && currentProfile.role === 'ADMIN');
      if (top) top.hidden = !(isAdmin && (d.topUsers || []).length);
      if (rank && isAdmin) {
        const topMax = Math.max(1, ...(d.topUsers || []).map(u => u.n));
        rank.innerHTML = (d.topUsers || []).map((u, i) => `<div class="dash-rank-row"><span class="no">${i + 1}</span>
          <div class="bar"><i style="width:${Math.round(u.n * 100 / topMax)}%"></i><span>${escapeHtml(u.username)}</span></div><span class="v">${u.n}</span></div>`).join('');
      }
    }

    function loadHomeDashboard(force) {

    function loadHeaderSummary() {
      if (!currentUser) return;
      const box = document.getElementById('headerSummary');

      // Sudah punya data dari getBootstrapData? Pakai itu, jangan panggil server lagi.
      if (bootstrapPrefetch && bootstrapPrefetch.dashboard) {
        const cached = bootstrapPrefetch.dashboard;
        bootstrapPrefetch.dashboard = null; // konsumsi sekali saja
        renderHeaderSummary(box, cached);
        headerSummaryLoadedOnce = true;
        return;
      }

      google.script.run
        .withSuccessHandler(data => { renderHeaderSummary(box, data); headerSummaryLoadedOnce = true; })
        .withFailureHandler(() => { if (box) box.innerHTML = '<span class="header-stat"><span class="header-stat-dot bad"></span>Gagal memuat ringkasan</span>'; })
        .getDashboardData(currentSessionToken, { page: 1, pageSize: 1, facets: false });

    window.addEventListener("DOMContentLoaded", () => {
      // CSS/UI utama sudah terpasang saat DOM siap; sekarang izinkan paint.
      document.documentElement.classList.remove('kd-booting');
      if (!currentSessionToken) {
        clearLocalSession();
        openLoginScreen('');
        return;
      }

      // Jika server sedang transient/error, jangan memaksa operator login ulang.
      // Profil cache hanya dipakai untuk mempertahankan UI sementara; server tetap
      // menjadi sumber kebenaran dan akan menggantinya begitu bootstrap berhasil.
      let cachedProfile = null;
      try {
        cachedProfile = JSON.parse(localStorage.getItem("daygroup_profile") || "null");
      } catch (e) {}
      if (cachedProfile && (cachedProfile.user || cachedProfile.username)) {
        applyAuthenticatedSession(cachedProfile, currentSessionToken);
        window.__sessionCacheShown = true;
      }

      const verifyBootstrap = (attempt) => {
        google.script.run
          .withSuccessHandler(res => {
            if (res && res.success && res.profile) {
              bootstrapPrefetch = res;
              applyAuthenticatedSession(res.profile, currentSessionToken);
              window.__bootstrapRetry = 0;
              return;
            }
            if (res && res.success) {
              applyAuthenticatedSession(res, currentSessionToken);
              window.__bootstrapRetry = 0;
              return;
            }

            // Token benar-benar ditolak oleh server: baru hapus sesi lokal.
            // Error sementara tidak boleh memaksa login ulang.
            const msg = (res && res.message) || 'Sesi belum dapat diverifikasi.';
            if (attempt < 2) {
              setTimeout(() => verifyBootstrap(attempt + 1), 800 * (attempt + 1));
              return;
            }
            if (!window.__sessionCacheShown || /sesi tidak valid|telah berakhir|tidak ditemukan|tidak aktif|terkunci/i.test(msg)) {
              clearLocalSession();
              openLoginScreen(msg);
            }
          })
          .withFailureHandler(() => {
            if (attempt < 2) {
              setTimeout(() => verifyBootstrap(attempt + 1), 800 * (attempt + 1));
              return;
            }
            // Kalau cache masih valid, pertahankan panel dan jangan logout paksa.
            // Polling berikutnya akan mencoba validasi lagi.
            if (!window.__sessionCacheShown) {
              openLoginScreen('Koneksi ke server sedang bermasalah. Silakan coba lagi.');
            }
          })
          .getBootstrapData(currentSessionToken);
      };

      verifyBootstrap(0);
    });

    document.getElementById('pass').addEventListener('keypress', function (e) { if (e.key === 'Enter') { handleLogin(); } });
    document.getElementById('user').addEventListener('keypress', function (e) { if (e.key === 'Enter') { document.getElementById('pass').focus(); } });

    function handleLogin() {
      const u = document.getElementById('user').value.trim();
      const p = document.getElementById('pass').value;
      const btn = document.getElementById('btnLogin');
      const err = document.getElementById('login-err');
      if(!u || !p) { err.innerText = "Lengkapi data!"; return; }
      err.innerText = '';
      btn.innerText = "Memverifikasi…";
      btn.disabled = true;
      google.script.run
        .withSuccessHandler(res => {
          btn.innerText = "Masuk";
          btn.disabled = false;
          if(res && res.success) {
            applyAuthenticatedSession(res, res.sessionToken);
            toast("Selamat Datang, " + res.user);
          } else {
            err.innerText = (res && res.message) || 'Login gagal.';
          }
        })
        .withFailureHandler(error => {
          btn.innerText = "Masuk";
          btn.disabled = false;
          err.innerText = (error && error.message) || 'Tidak dapat menghubungi server.';
        })
        .checkLogin(u, p);
    }

    // Hentikan SEMUA poller per-menu (PGA Pending, WD Listed, Auto Prediksi, Sesi Chat, ticker job). Dulu hanya Live/Invest
    // yang berhenti, sehingga timer lain terus menembak server dengan token kosong setelah logout / sesi berakhir.

      if (wdListedTimer) { clearInterval(wdListedTimer); wdListedTimer = null; }
      clearInterval(autoInputTimer); autoInputTimer = null;

      if (lapJobsTicker) { clearInterval(lapJobsTicker); lapJobsTicker = null; }

    function handleLogout() {
      const token = currentSessionToken;
      if (token) google.script.run.withFailureHandler(() => {}).logoutSession(token);
      const maintModal = document.getElementById('maintenanceModal');
      if (maintModal) maintModal.classList.remove('open');
      document.body.classList.remove('modal-open');
      clearLocalSession();
      stopLivePolling();
      stopInvestPolling();
      stopAllPagePollers();

    function togglePasswordVisibility() {

      const btn = document.getElementById('passToggle');
      if (!input || !btn) return;
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';

    ['keydown', 'keyup'].forEach(evt => document.getElementById('pass').addEventListener(evt, e => {
      const warn = document.getElementById('caps-warn');
      if (warn && e.getModifierState) warn.hidden = !e.getModifierState('CapsLock');
    }));

    // Sesi ditolak server di tengah kerja (habis 21 hari, dihapus admin, akun
    // dinonaktifkan/terkunci): shim /api memancarkan 'kd:session-expired'.
    // Dulu panel tetap terbuka dan setiap tombol gagal diam-diam sampai
    // operator reload sendiri. Sekarang langsung kembali ke layar login.
    window.addEventListener('kd:session-expired', e => {
      if (!currentUser) return;
      const msg = (e && e.detail) || 'Sesi berakhir. Silakan login kembali.';

    let lapConfig = null;

    // Hasil laporan dimuat SESUAI menu yang sedang dibuka. Sebelumnya
    // lapGetConfig() ikut menarik SEMUA blob lap_result, termasuk snapshot
    // Mozart debug yang besar, setiap operator membuka menu Laporan Harian.
    const LAP_PAGE_MODULES = {
      'lap-admin': ['register','registerMeta','reportAgent','reportAgentMeta','checkCoin','checkCoinMeta','idSelisih','withdrawPgaIdf'],
      'lap-motion': ['_motionMeta','motionDpPga','motionPendingError','motionWd'],
      'lap-mozart': ['_mozartMeta','mozartDepo','mozartWd'],
      'lap-setting': []
    };

    let lapConfigWaiters = null;
    function lapEnsureConfig(cb) {
      if (lapConfig) { cb && cb(); return; }
      if (lapConfigWaiters) { lapConfigWaiters.push(cb); return; }
      lapConfigWaiters = [cb];
      const finish = () => { const w = lapConfigWaiters || []; lapConfigWaiters = null; w.forEach(f => f && f()); };
      google.script.run.withSuccessHandler(res => {
        if (res && res.success) lapConfig = res.config || {};
        finish();
      }).withFailureHandler(finish).lapGetConfig(currentSessionToken);
    }

    // Ambil hasil laporan untuk satu menu. Hasil disimpan di cache per menu
    // beserta "tanda tangan" ringkas, supaya refresh di belakang layar hanya
    // menggambar ulang tabel kalau datanya memang berubah.
    const lapInflight = Object.create(null);
    // Hash ringan (djb2) atas isi penuh: dulu array hanya dibandingkan lewat panjang + baris pertama + terakhir,
    // sehingga perubahan status di tengah daftar tidak pernah menggambar ulang tabel.
    function lapHash(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return h >>> 0; }
    function lapResultsSig(results) {
      return Object.keys(results || {}).sort().map(k => {
        const v = results[k];
        const j = JSON.stringify(v == null ? null : v) || '';
        return k + ':' + (Array.isArray(v) ? v.length : '') + ':' + j.length + ':' + lapHash(j);
      }).join('|');
    }
    function lapFetchResults(page, cb) {
      const modules = LAP_PAGE_MODULES[page] || [];
      if (!modules.length) { cb && cb(true, {}, false); return; }
      if (lapInflight[page]) { lapInflight[page].push(cb); return; }
      lapInflight[page] = [cb];
      const finish = (ok, results, changed) => { const cbs = lapInflight[page] || []; delete lapInflight[page]; cbs.forEach(f => f && f(ok, results, changed)); };
      google.script.run.withSuccessHandler(res => {
        const ok = !!(res && res.success);
        const results = ok && res.results ? res.results : {};
        const prev = lapPageCache[page];
        const sig = ok ? lapResultsSig(results) : '';
        const changed = !prev || prev.sig !== sig;
        if (ok) lapPageCache[page] = { at: Date.now(), results, sig };
        finish(ok, results, changed);
      }).withFailureHandler(() => finish(false, {}, false)).lapGetResults(currentSessionToken, modules);
    }
    // Dipanggil saat kursor/jari menyentuh menu laporan: data mulai diambil
    // ~100-300 ms sebelum menu benar-benar terbuka.
    function lapPrefetch(page) {
      if (!LAP_PAGES.includes(page) || !menuAllowed(page)) return;
      lapEnsureConfig();
      const c = lapPageCache[page];
      if (!c || Date.now() - c.at > LAP_CACHE_MS) lapFetchResults(page);
    }

    function renderLapPage(page, force) {
      const host = document.getElementById('lap-page');
      if (!host) return;

        if (seq !== lapRenderSeq) return;

          FX.reveal(card.querySelectorAll('.lap-tbl'), { y: 14, step: 40, start: 120 });
        }

      };
      const cached = lapPageCache[page];
      // 1) Instan: data terakhir dari cache (umur berapa pun). Kalau sudah basi,
      //    ambil yang baru di belakang layar & gambar ulang HANYA bila berubah.
      if (!force && lapConfig && (cached || !(LAP_PAGE_MODULES[page] || []).length)) {
        paint(cached ? cached.results : {});
        if (!cached || Date.now() - cached.at < LAP_CACHE_MS) return;
        lapFetchResults(page, (ok, results, changed) => {
          if (ok && changed && seq === lapRenderSeq && currentPage === page) paint(results);
        });
        return;
      }
      // 2) Belum pernah dimuat: tampilkan kerangka seketika (dulu layar kosong
      //    total selama menunggu), lalu ambil config & hasil BERSAMAAN.
      if (!force || !host.querySelector('.glass-card')) host.innerHTML = lapSkeletonHtml(page);
      let pending = 2, out = null;
      const done = () => { if (--pending === 0) paint(out); };
      lapEnsureConfig(done);
      lapFetchResults(page, (ok, results) => { out = ok ? results : (cached ? cached.results : {}); done(); });
    }

    function lapSetRange(prefix, daysBack) {

      const end = daysBack === 7 ? new Date(Date.now() + 7*3600*1000).toISOString().slice(0,10) : d;

    // ---------- MOTION ----------
    // motionv2.com KADANG menantang/menolak trafik IP datacenter Worker (WAF
    // adaptif -- kadang lolos, kadang balas kosong tanpa pesan error jelas,
    // gejalanya "DP 0 WD 0 padahal ada data"). Diganti total ke pola sama
    // persis dengan Lap Mozart: skrip di-generate, di-paste di Console tab

    // ================= PGA PENDING (live -- sinkron dari skrip Console tab Motion) =================

    // daftar HIDUP yang harus selalu mencerminkan apa yang SEDANG tampil di
    // motionv2.com/withdraw-request dengan badge "PGA Pending" -- baris yang
    // sudah tidak ada di sana (sudah diproses/hilang) harus otomatis hilang dari
    // sini juga. motionv2.com KADANG menolak trafik server (WAF, sama seperti
    // Lap Motion) -- jadi TIDAK ditarik dari Worker, tapi DIBACA LANGSUNG dari
    // tabel yang sudah dirender di layar oleh skrip Console yang jalan di tab
    // Motion (bukan lewat API-nya sama sekali), setiap 2 detik selama tab itu
    // terbuka, lalu didorong (POST) ke panel. Panel di sini cuma poll snapshot
    // terakhir tiap 2 detik juga -- lihat src/lib/pga-pending.ts untuk kenapa
    // disimpan di KV dgn TTL pendek (bukan Turso): biar baris yang berhenti
    // disinkron otomatis basi & hilang sendiri tanpa job pembersih terpisah.
    let pgaPendingRows = [];
    let pgaPendingUpdatedAt = 0;
    let pgaPendingTimer = null;
    // WD LISTED -- checklist manual (dari PGA Pending yang dicentang+COPY),
    // PERSISTEN di Turso (lihat src/lib/wd-listed.ts), tampil lintas operator
    // berdasarkan WEBSITE yang sama, bukan cuma yang menambahkan.
    let wdListedRows = [];
    let wdListedTimer = null;
    let wdListedSig = '';

    function pgaPendingConsoleScript() {
      const panel = location.origin;
      const token = currentSessionToken || '';
      return "(async()=>{\n"
        + "  const O=location.origin, PANEL=" + JSON.stringify(panel) + ", TOKEN=" + JSON.stringify(token) + ";\n"
        + "  if(!/motionv2/i.test(O)){alert('Buka skrip ini di TAB MOTION (motionv2.com), bukan di sini.');return;}\n"
        + "  if(window.__pgaPendingTimer){clearInterval(window.__pgaPendingTimer);console.log('%cPGA Pending: skrip lama (interval biasa) dihentikan, mulai ulang.','color:#ff0');}\n"
        + "  if(window.__pgaPendingWorker){try{window.__pgaPendingWorker.terminate();}catch(e){}console.log('%cPGA Pending: skrip lama (worker) dihentikan, mulai ulang.','color:#ff0');}\n"
        + "  const norm=s=>String(s||'').replace(/\\s+/g,' ').trim();\n"
        // Halaman WD Request BUKAN <table> HTML -- dibangun dari <div> MUI, dan
        // (ketahuan dari testing user) punya DUA representasi teks per baris
        // (mis. varian ringkas utk breakpoint sempit) yang SAMA-SAMA ikut
        // kebaca di .innerText/.textContent baris, bikin ekstraksi berbasis
        // "potong teks antar label" (versi sebelumnya) kacau -- label & nilai
        // bisa duplikat/beda urutan. Jadi PINDAH ke ekstraksi POSISIONAL yg
        // tidak peduli itu: kolom STATUS ditemukan dulu (anak langsung baris
        // yang MEMUAT badge "PGA Pending" itu sendiri, dicek via .contains --
        // bukan cocokkan teks), lalu WEBSITE/ID TRANS/TANGGAL/ID USER/JUMLAH
        // diambil RELATIF terhadap posisi kolom STATUS itu (mundur 7,6,5,4,1
        // kolom) -- urutan 8 kolom [WEBSITE, ID TRANS, TANGGAL, ID USER, NAMA
        // REKENING, NO. REKENING, JUMLAH, STATUS] SELALU berurutan spt itu di
        // DOM (dikonfirmasi dari console.log user), jadi tidak peduli ada
        // berapa kolom lain (checkbox dsb) sebelum WEBSITE -- itu yg bikin
        // pendekatan ini kebal thd checkbox/kolom tambahan yang mungkin
        // muncul/hilang tergantung breakpoint. "Grabbed PGA PGA Pending 000"
        // adalah TEKS TETAP (konvensi log internal pemilik), BUKAN dibaca dari
        // Motion -- dikonfirmasi dari isi kolom Status di Google Sheet log
        // yang sudah ada, semua baris (vendor/website apapun) sama persis.
        + "  function scan(){\n"
        + "    const found=[]; const seenStatus=new Set();\n"
        + "    const badges=Array.prototype.filter.call(document.querySelectorAll('body *'),el=>el.children.length===0&&/PGA Pending/i.test(el.textContent||''));\n"
        + "    badges.forEach(badge=>{\n"
        // Naik dari badge: begitu ketemu langkah di mana PARENT node saat ini
        // punya >=8 anak sekaligus, parent itu = "row" (baris data, minimal 8
        // kolom: WEBSITE..STATUS, biasanya 10 dgn checkbox+ACTION), dan node
        // (anak langsung row yg dilewati barusan) = kolom STATUS. Murni hitung
        // jumlah anak, TIDAK baca teks sama sekali -- kebal thd duplikasi teks
        // responsive yang bikin pendekatan berbasis label kacau sebelumnya.
        + "      let node=badge, statusCell=null, row=null;\n"
        + "      for(let i=0;i<20&&node&&node.parentElement;i++){\n"
        + "        const parent=node.parentElement;\n"
        + "        if(parent.children.length>=8){statusCell=node;row=parent;break;}\n"
        + "        node=parent;\n"
        + "      }\n"
        + "      if(!row||!statusCell||seenStatus.has(statusCell))return; seenStatus.add(statusCell);\n"
        + "      const cells=Array.from(row.children);\n"
        + "      const statusIdx=cells.indexOf(statusCell);\n"
        + "      if(statusIdx<7)return;\n"
        + "      const cellText=c=>c?norm(c.innerText||c.textContent):'';\n"
        // Kadang (tergantung breakpoint/varian render) label kolomnya IKUT
        // kebawa nempel di depan nilai dlm sel yang sama (mis. sel WEBSITE
        // isinya \"WEBSITE XOTOGEL\", bukan cuma \"XOTOGEL\") -- dibersihkan di
        // sini apapun bentuknya: kalau labelnya tidak ada pun, ini no-op aman.\n"
        + "      const strip=(t,labelRe)=>t.replace(new RegExp('^'+labelRe+'\\\\.?:?\\\\s*','i'),'').trim();\n"
        + "      const statusFull=cellText(statusCell);\n"
        + "      const refM=statusFull.match(/PGA Ref No:?\\s*(\\S+)/i);\n"
        + "      const vendM=statusFull.match(/Vendor Name:?\\s*([^]*)$/i);\n"
        // Baris yang PGA Ref No-nya belum muncul (badge PGA Pending sudah ada
        // tapi ref-nya belum ke-assign di Motion) SENGAJA dilewati total --
        // bukan cuma disembunyikan dari tombol COPY, tapi tidak masuk List
        // sama sekali, karena datanya memang belum lengkap buat dicatat.
        + "      if(!refM)return;\n"
        + "      found.push({\n"
        + "        website: strip(cellText(cells[statusIdx-7]),'WEBSITE'),\n"
        + "        idTrans: strip(cellText(cells[statusIdx-6]),'ID\\\\s*TRANS'),\n"
        + "        tanggal: strip(cellText(cells[statusIdx-5]),'TANGGAL'),\n"
        + "        idUser: strip(cellText(cells[statusIdx-4]),'ID\\\\s*USER'),\n"
        + "        jumlah: parseInt(strip(cellText(cells[statusIdx-1]),'JUMLAH').replace(/[^0-9]/g,''),10)||0,\n"
        + "        statusText: 'Grabbed PGA PGA Pending 000',\n"
        + "        pgaRefNo: refM?refM[1]:'',\n"
        + "        vendorName: vendM?norm(vendM[1]):'',\n"
        + "      });\n"
        + "    });\n"
        + "    return found;\n"
        + "  }\n"
        + "  async function tick(){\n"
        + "    try{\n"
        + "      const rows=scan();\n"
        + "      document.title='['+rows.length+' PGA Pending] MOTION';\n"
        // console.table setiap tick -- kalau masih ada kolom yg salah/kosong,
        // KELIHATAN LANGSUNG di Console tanpa perlu diagnosa terpisah lagi.
        + "      if(rows.length)console.table(rows);\n"
        + "      await fetch(PANEL+'/api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'pgaPendingSync',token:TOKEN,rows:rows})});\n"
        + "    }catch(e){console.log('PGA Pending: sync gagal -- ',(e&&e.message)||e);}\n"
        + "  }\n"
        + "  console.log('%cPGA Pending: mulai sinkron tiap 2 detik. Biarkan tab ini TETAP TERBUKA di halaman WD Request.','color:#0f0;font-weight:bold');\n"
        + "  tick();\n"
        // Timer LEWAT WEB WORKER, bukan setInterval biasa di thread utama --
        // Chrome (dan browser lain) MELAMBATKAN setInterval sampai cuma 1x per
        // MENIT kalau tab-nya di-background/minimize (buat hemat baterai),
        // padahal justru tujuan fitur ini supaya tab Motion boleh dikecilkan
        // sambil kerja di tempat lain. Timer di dalam Worker TIDAK kena
        // pelambatan itu, jadi tetap tiap 2 detik walau tab tidak aktif.
        // Fallback ke setInterval biasa kalau Worker gagal dibuat (mis. CSP
        // situsnya melarang blob: worker).\n"
        + "  try{\n"
        + "    const workerSrc='setInterval(function(){postMessage(1)},2000);';\n"
        + "    const blobUrl=URL.createObjectURL(new Blob([workerSrc],{type:'application/javascript'}));\n"
        + "    const worker=new Worker(blobUrl);\n"
        + "    worker.onmessage=tick;\n"
        + "    worker.onerror=function(e){console.log('PGA Pending: Worker error, fallback ke setInterval biasa --',e&&e.message);worker.terminate();window.__pgaPendingWorker=null;window.__pgaPendingTimer=setInterval(tick,2000);};\n"
        + "    window.__pgaPendingWorker=worker;\n"
        + "    console.log('%cPGA Pending: timer pakai Web Worker -- tetap tiap 2 detik walau tab Motion di-background/minimize.','color:#0ff');\n"
        + "  }catch(e){\n"
        + "    console.log('PGA Pending: Web Worker gagal dibuat, fallback ke setInterval biasa (bisa melambat kalau tab di-background) --',(e&&e.message)||e);\n"
        + "    window.__pgaPendingTimer=setInterval(tick,2000);\n"
        + "  }\n"
        + "  alert('PGA Pending: sinkron otomatis jalan tiap 2 detik selama tab ini tetap terbuka di halaman WD Request.\\n\\nBuka panel -> menu PGA Pending.');\n"
        + "})();";
    }
    function pgaPendingCopyScript() {
      const code = pgaPendingConsoleScript();
      const done = () => toast('Skrip disalin. Buka motionv2.com -> WD Request, Console, tempel, Enter. Biarkan tab tetap terbuka.');
      navigator.clipboard.writeText(code).then(done).catch(() => {
        const ta = document.getElementById('pgaPendingCode');
        if (ta) { document.getElementById('pgaPendingCodeWrap').hidden = false; ta.focus(); ta.select(); try { document.execCommand('copy'); done(); } catch(e){ toast('Salin manual dari kotak di bawah'); } }
      });
    }

    function stopPgaPendingPolling() {
      if (pgaPendingTimer) { clearInterval(pgaPendingTimer); pgaPendingTimer = null; }
    }
    function startPgaPendingPolling() {
      stopPgaPendingPolling();
      pollPgaPendingStatus();
      pgaPendingTimer = setInterval(pgaPendingTick, 2000);
    }
    // Poller berkala: lewati bila tab tersembunyi atau permintaan sebelumnya belum selesai (dulu menumpuk bila server lambat).
    let pgaPollBusy = false;
    function pgaPendingTick() { if (document.hidden || pgaPollBusy) return; pollPgaPendingStatus(); }
    function pollPgaPendingStatus() {
      pgaPollBusy = true;
      google.script.run.withSuccessHandler(res => {
        pgaPollBusy = false;
        if (!res || !res.success) return;
        const rows = res.rows || [];
        const sig = (res.updatedAt || 0) + ':' + JSON.stringify(rows);
        const unchanged = sig === pgaPendingSig;
        pgaPendingSig = sig;
        pgaPendingRows = rows;
        pgaPendingUpdatedAt = res.updatedAt || 0;
        pgaPendingRepaint(unchanged);
      }).withFailureHandler(() => { pgaPollBusy = false; }).pgaPendingStatus(currentSessionToken);
    }
    let pgaPendingSig = '';
    function pgaPendingRepaint(onlyLabel) {
      // onlyLabel: data sama -> cukup segarkan teks 'Update terakhir N detik lalu', jangan bangun ulang tabel.
      if (!onlyLabel && lapTblState['pga_pending']) { lapTblState['pga_pending'].rows = pgaPendingRows; lapTblRepaint('pga_pending'); }
      const cnt = document.getElementById('pgaPendingLiveCount');
      if (cnt) cnt.textContent = pgaPendingRows.length;
      const upd = document.getElementById('pgaPendingUpdatedAt');
      if (upd) {
        if (!pgaPendingUpdatedAt) {
          upd.textContent = 'Belum ada data masuk — jalankan skrip di tab Motion (menu WD Request).';
          upd.className = 'text-[10px] text-amber-400 mt-1';
        } else {
          const secAgo = Math.max(0, Math.round((Date.now() - pgaPendingUpdatedAt) / 1000));
          upd.textContent = 'Update terakhir ' + secAgo + ' detik lalu';
          upd.className = 'text-[10px] mt-1 ' + (secAgo > 15 ? 'text-rose-400' : 'text-emerald-400');
        }
      }
    }
    function renderPgaPendingPage() {
      const host = document.getElementById('pga-pending-page');
      if (!host) return;
      const code = pgaPendingConsoleScript();
      const escCode = c => c.replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));
      host.innerHTML = lapHeaderCard('fa-tower-broadcast', 'PGA Pending', 'Live sync withdraw berstatus PGA Pending dari motionv2.com/withdraw-request.', `
        <details class="glass-inner rounded-2xl border border-rose-500/20 text-[11px] text-slate-300 leading-relaxed pga-collapse">
          <summary class="p-4 flex items-center gap-2 cursor-pointer select-none">
            <span class="font-bold text-rose-300 flex-1"><i class="fa-solid fa-satellite-dish mr-1"></i>Cara pakai</span>
            <i class="fa-solid fa-chevron-down pga-collapse-caret"></i>
          </summary>
          <div class="px-4 pb-4 -mt-1">
            List ini TIDAK ditarik server (Motion sering menolak trafik server/WAF) — dibaca LANGSUNG dari tabel WD Request oleh skrip yang jalan di tab Motion, tiap 2 detik, selama tab itu terbuka. Baris yang sudah hilang dari WD Request otomatis hilang dari sini juga dalam hitungan detik.
            <ol class="list-decimal ml-4 mt-1.5 space-y-1">
              <li>Buka tab <b>Motion</b> (motionv2.com) → menu <b>WD REQUEST</b>, pastikan sudah login.</li>
              <li>Klik <b>Salin Skrip</b> di bawah.</li>
              <li>Tekan <b>F12</b> → tab <b>Console</b> (pertama kali Chrome minta ketik <code>allow pasting</code> dulu lalu Enter).</li>
              <li>Tempel (Ctrl+V) → <b>Enter</b>. Biarkan tab Motion itu TETAP TERBUKA (boleh dikecilkan, jangan ditutup).</li>
              <li>Balik ke sini — List di bawah update sendiri tiap 2 detik.</li>
            </ol>
            <div class="flex flex-wrap gap-2 mt-3">
              <button onclick="pgaPendingCopyScript()" class="bg-gradient-to-r from-rose-400 to-orange-500 text-slate-950 font-extrabold px-4 py-2 rounded-xl text-xs"><i class="fa-regular fa-copy mr-1"></i>Salin Skrip</button>
              <button onclick="document.getElementById('pgaPendingCodeWrap').hidden=!document.getElementById('pgaPendingCodeWrap').hidden" class="glass-inner px-4 py-2 rounded-xl text-xs font-bold"><i class="fa-solid fa-code mr-1"></i>Lihat Skrip</button>
            </div>
            <div id="pgaPendingCodeWrap" hidden class="mt-2">
              <textarea id="pgaPendingCode" readonly onclick="this.select()" class="w-full h-32 glass-inner rounded-xl p-2 text-[10px] font-mono text-slate-200 leading-tight">${escCode(code)}</textarea>
            </div>
          </div>
        </details>
        <div class="flex items-center justify-between flex-wrap gap-2 mt-1">
          <span class="text-[11px] font-bold text-slate-300">Baris aktif: <span id="pgaPendingLiveCount" class="text-rose-400">${pgaPendingRows.length}</span></span>
          <div id="pgaPendingUpdatedAt" class="text-[10px] text-slate-500">Memuat…</div>
        </div>
        <div id="pgaPendingTableWrap">
          ${lapTable('pga_pending', ['WEBSITE','ID TRANS','TANGGAL','ID USER','JUMLAH','STATUS','PGA REF NO','VENDOR'], pgaPendingRows,
            r => `<tr>${td(r.website)}${td(r.idTrans,'text-[10px]')}${td(r.tanggal)}${td(r.idUser,'font-bold text-cyan-300')}${td('Rp '+lapFmt(r.jumlah),'text-right text-emerald-400')}${td(r.statusText,'text-[10px] text-rose-300')}${td(r.pgaRefNo,'text-[10px]')}${td(r.vendorName,'text-amber-300')}</tr>`,
            r => [r.vendorName, r.website, r.idTrans, r.tanggal, r.idUser, 'Rp '+lapFmt(r.jumlah), r.statusText, r.pgaRefNo, 'Pending'].join('\t'),
            ['website','idTrans','idUser','pgaRefNo','vendorName'], {title:'PGA Pending', open:true, checkable:true})}
        </div>
        <div class="mt-1">
          <div id="wdListedTableWrap">
            ${lapTable('wd_listed', ['WEBSITE','ID TRANS','TANGGAL','ID USER','JUMLAH','PGA REF NO','VENDOR','CEK TERAKHIR','ACTION'], wdListedRows,
              r => `<tr>${td(r.website)}${td(r.idTrans,'text-[10px]')}${td(r.tanggal)}${td(r.idUser,'font-bold text-cyan-300')}${td('Rp '+lapFmt(r.jumlah),'text-right text-emerald-400')}${tdRaw(`<a href="https://dbb2b.q2checkout.com/struk/disbursement/${encodeURIComponent(r.pgaRefNo)}" target="_blank" rel="noopener" class="text-[10px] underline decoration-dotted">${escapeHtml(r.pgaRefNo)}</a>`)}${td(r.vendorName,'text-amber-300')}${tdRaw(r.checkStatus?(`<span class="${wdListedStatusClass(r.checkStatus)}">${escapeHtml(r.checkStatus)}</span>${r.checkDate?`<div class="text-[9px] text-slate-500 mt-0.5">${escapeHtml(r.checkDate)}</div>`:''}`):'<span class="text-slate-600">—</span>')}${tdRaw(`<div class="flex items-center gap-1.5"><button onclick="wdListedCheckClick(${Number(r.id)},this)" class="lap-pg-btn !w-auto px-2" title="Cek status terbaru"><i class="fa-solid fa-rotate"></i> CEK</button><button onclick="wdListedDeleteClick(${Number(r.id)})" class="lap-pg-btn !w-auto px-2 text-rose-400" title="Hapus dari list"><i class="fa-solid fa-xmark"></i></button></div>`)}</tr>`,
              r => r.pgaRefNo,
              ['website','idTrans','idUser','pgaRefNo','vendorName'], {title:'WD Listed', open:true, checkable:true})}
          </div>
        </div>`);
      lapTblMountAll();
      pgaPendingRepaint();
      // Checklist+COPY di tabel PGA Pending SEKALIGUS mendaftarkan baris yang
      // dicentang ke WD Listed -- tombol COPY bawaan lapTable tidak diubah
      // (tabel lain yang pakai checkable nanti tidak ikut kepengaruh), cuma
      // "disambar" khusus di sini supaya tetap menyalin ke clipboard SAMA
      // seperti biasa, plus kirim ke wdListedSync kalau memang ada centangan.
      const origPgaCopy = window['__lapCopy_pga_pending'];
      window['__lapCopy_pga_pending'] = (ev) => {
        const st = lapTblState['pga_pending'];
        if (st && st.checkable && st.selected.size) {
          const list = lapTblFiltered('pga_pending').filter((r,i) => st.selected.has(st.copyFn(r,i)));
          if (list.length) wdListedSyncRows(list);
        }
        origPgaCopy(ev);
      };
      // Format COPY WD Listed BEDA TOTAL dari tabel lain (bukan 1 baris per
      // transaksi) -- tiap baris jadi blok multi-baris (WEB/Trans ID/Date
      // Trans/User ID/Status/PGA Ref. No), dipisah 1 baris kosong antar blok,
      // dan SATU baris "KET : DONE FU KE TICKETING" di paling akhir (cuma
      // sekali walau yang dicentang banyak) -- jadi TIDAK dipakaikan copyFn
      // bawaan lapTable (yang isinya cuma pgaRefNo, dipakai internal buat
      // identitas checkbox saja), tombol COPY-nya di-timpa total di sini.
      window['__lapCopy_wd_listed'] = (ev2) => {
        ev2 && ev2.stopPropagation();
        const st = lapTblState['wd_listed'];
        let list = lapTblFiltered('wd_listed');
        if (st && st.checkable && st.selected.size) {
          list = list.filter((r,i) => st.selected.has(st.copyFn(r,i)));
        }
        if (!list.length) { toast('Data kosong'); return; }
        const pad2 = n => String(n).padStart(2,'0');
        // "9/17/2026 3:34:43 AM" (apa adanya dari Motion) -> "09/17/2026 03:34:43"
        // (format 24 jam berpadding, sesuai contoh yang diminta).
        const formatDateTrans = t => {
          const m = String(t||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})\s*(AM|PM)?$/i);
          if (!m) return t || '';
          let [, mo, d, y, h, mi, s, ap] = m;
          h = parseInt(h, 10);
          if (ap) {
            const apUp = ap.toUpperCase();
            if (apUp === 'PM' && h !== 12) h += 12;
            if (apUp === 'AM' && h === 12) h = 0;
          }
          return pad2(mo) + '/' + pad2(d) + '/' + y + ' ' + pad2(h) + ':' + mi + ':' + s;
        };
        const block = r => 'WEB : ' + r.website + '\nTrans ID : ' + r.idTrans + '\nDate Trans : ' + formatDateTrans(r.tanggal) +
          '\nUser ID : ' + r.idUser + '\nStatus : ' + r.statusText + '\nPGA Ref. No: ' + r.pgaRefNo;
        const text = list.map(block).join('\n\n') + '\n\nKET : DONE FU KE TICKETING';
        navigator.clipboard.writeText(text).then(() => toast(list.length + ' baris disalin'));
      };
      loadWdListed();
      wdListedTimer && clearInterval(wdListedTimer);
      wdListedTimer = setInterval(wdListedTick, 8000);
    }
    let wdListedBusy = false;
    function wdListedTick() { if (document.hidden || wdListedBusy) return; loadWdListed(); }
    function wdListedStatusClass(status) {
      const s = String(status||'').toLowerCase();
      if (s.indexOf('success') >= 0 || s.indexOf('sukses') >= 0 || s.indexOf('paid') >= 0) return 'text-emerald-400 font-bold';
      if (s.indexOf('fail') >= 0 || s.indexOf('gagal') >= 0 || s.indexOf('reject') >= 0) return 'text-rose-400 font-bold';
      return 'text-amber-400 font-bold';
    }
    function wdListedSyncRows(rows) {
      google.script.run.withSuccessHandler(res => {
        if (res && res.success) { toast((res.added||0) + ' baris masuk ke WD Listed'); loadWdListed(); }
      }).withFailureHandler(() => {}).wdListedSync(currentSessionToken, rows);
    }
    function loadWdListed() {
      wdListedBusy = true;
      google.script.run.withSuccessHandler(res => {
        wdListedBusy = false;
        if (!res || !res.success) return;
        const sig = JSON.stringify(res.rows || []);
        if (sig === wdListedSig && wdListedRows.length) return; // sama -> jangan bangun ulang tabel
        wdListedSig = sig;
        wdListedRows = res.rows || [];
        if (lapTblState['wd_listed']) { lapTblState['wd_listed'].rows = wdListedRows; lapTblRepaint('wd_listed'); }
      }).withFailureHandler(() => { wdListedBusy = false; }).wdListedGetList(currentSessionToken);
    }
    function wdListedCheckClick(id, btn) {
      if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; }
      google.script.run.withSuccessHandler(res => {
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-rotate"></i> CEK'; }

    function lapMozartConsoleScript() {
      const panel = location.origin;
      const token = currentSessionToken || '';
      return "(async()=>{\n"
        + "  const O=location.origin, PANEL=" + JSON.stringify(panel) + ", TOKEN=" + JSON.stringify(token) + ";\n"
        + "  if(!/limatogel|makintajir|mozart/i.test(O)){alert('Buka skrip ini di TAB MOZART, bukan di sini.');return;}\n"
        + "  const p2=n=>('0'+n).slice(-2), td=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());\n"
        + "  const sd=prompt('Tanggal MULAI (YYYY-MM-DD)',td(new Date())); if(!sd)return;\n"
        + "  const ed=prompt('Tanggal AKHIR (YYYY-MM-DD)',sd); if(!ed)return;\n"
        + "  const FR=j=>{if(Array.isArray(j))return j;let b=[];for(const k in j){const v=j[k];if(Array.isArray(v)){if((v.length===0||typeof v[0]==='object')&&v.length>=b.length)b=v;}else if(v&&typeof v==='object'){const n=FR(v);if(n.length>b.length)b=n;}}return b;};\n"
        + "  const pull=async(path,bd)=>{const rows=[];for(let i=0;i<400;i++){const r=await fetch(O+path,{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({...bd,page_number:i,page_size:100})});if(!r.ok){if(i===0)throw new Error(path+' HTTP '+r.status);break;}const rr=FR(await r.json());rows.push(...rr);console.log(path,'hal',i,'(+'+rr.length+')');if(rr.length<100)break;}return rows;};\n"
        + "  const tryEP=async(m,path,body)=>{try{const o={method:m,credentials:'include',headers:{'content-type':'application/json'}};if(m==='POST')o.body=JSON.stringify(body||{});const r=await fetch(O+path,o);if(!r.ok)return null;const j=await r.json();return {path,data:j};}catch(e){return null;}};\n"
        + "  const seen=performance.getEntriesByType('resource').map(e=>e.name).filter(u=>u.indexOf(O)===0&&/bank|account|rekening|mbank|panel/i.test(u)).map(u=>u.slice(O.length).split('?')[0]);\n"
        + "  const accCand=['/api/bank/fetchBank','/api/bank-account/fetchBankAccount','/api/account/fetchAccount','/api/mbanking/fetchMbanking','/api/bank/fetch','/api/bank','/api/account'];\n"
        + "  const accountsRaw=[]; for(const p of [...new Set([...seen,...accCand])]){const g=await tryEP('POST',p,{})||await tryEP('GET',p); if(g&&g.data){accountsRaw.push(g); console.log('  meta ok:',p);}}\n"
        + "  const panelsRaw=[]; for(const p of ['/api/panel/fetchPanel','/api/panel/fetch','/api/panel','/api/panels','/api/panel/list']){const g=await tryEP('POST',p,{})||await tryEP('GET',p); if(g&&g.data){panelsRaw.push(g); console.log('  panel ok:',p);}}\n"
        + "  const findIds=v=>{const out=[];const w=x=>{if(Array.isArray(x)){x.forEach(w);return;}if(!x||typeof x!=='object')return;const id=x.id??x.ID??x.panel_id;const nm=x.name||x.panel_name||x.label||x.domain;if(id!=null&&nm)out.push({id:String(id),name:String(nm)});Object.values(x).forEach(w);};w(v);return out;};\n"
        + "  let panelList=[]; panelsRaw.forEach(pr=>panelList=panelList.concat(findIds(pr.data)));\n"
        + "  const uniq={}; panelList.forEach(p=>uniq[p.id]=p.name); panelList=Object.keys(uniq).map(id=>({id,name:uniq[id]}));\n"
        + "  console.log('%cPanel terdeteksi:','color:#ff0',panelList);\n"
        + "  const targets = panelList.length ? panelList.map(p=>p.id) : [0];\n"
        + "  let dep=[], wd=[];\n"
        + "  for(const pid of targets){\n"
        + "    console.log('%cMozart panel '+pid+': deposit...','color:#0ff');\n"
        + "    const d=await pull('/api/transactions/fetchTransaction',{panel_id:pid===0?0:Number(pid),start_date:sd,end_date:ed,not_done_filter:false,filter_by:null});\n"
        + "    d.forEach(r=>r._panelId=String(pid)); dep=dep.concat(d);\n"
        + "    console.log('%cMozart panel '+pid+': withdraw...','color:#0ff');\n"
        + "    const w=await pull('/api/wd/fetchWithdrawal',{panel_id:pid===0?0:Number(pid),start_date:sd,end_date:ed,filter_by:{minimum_amount:0}});\n"
        + "    w.forEach(r=>r._panelId=String(pid)); wd=wd.concat(w);\n"
        + "  }\n"
        + "  const x=await fetch(PANEL+'/api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'lapMozartImport',token:TOKEN,startDate:sd,endDate:ed,depositRows:dep,withdrawRows:wd,accountsRaw:accountsRaw,panelsRaw:panelsRaw})});\n"
        + "  const jr=await x.json(); console.log(jr);\n"
        + "  alert(jr.success?('Mozart terkirim ke panel OK\\nDP '+jr.deposit+' / WD '+jr.withdraw+'\\n\\nBuka panel -> Lap Mozart -> Muat Ulang.'):('Gagal: '+(jr.message||'?')));\n"
        + "})();";
    }
