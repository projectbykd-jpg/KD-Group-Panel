        (g[k] = g[k] || { name: k, count: 0, sum: 0 }).count++;
        g[k].sum += Number(r.amount || 0);
      });
      const list = Object.values(g).sort((a,b) => b.sum - a.sum);
      const grand = list.reduce((n,x) => n + x.sum, 0);
      const gc = list.reduce((n,x) => n + x.count, 0);
      const dl = lapMozRangeLabel(meta);
      const ket = c => `${prefix} ${dl} (${c} Transactions)`;
      return lapTable(id, ['REKENING BANK', 'KETERANGAN', 'NOMINAL'], list,
        r => `<tr>${td(r.name,'font-bold text-slate-200')}${td(ket(r.count),'text-slate-400 text-[10px]')}${td('Rp ' + lapFmt(r.sum),'text-right text-emerald-300 font-bold')}</tr>`,
        r => `${r.name} - ${ket(r.count)} - ${lapFmt(r.sum)}`,
        ['name'],
        { title, open: true, footer: lapMozFooter(prefix + ' ' + dl + ' — SEMUA REKENING', gc, grand) });
    }
    function lapMozRangeLabel(meta) {
      const at = (meta && meta.at) || '';
      const [a, b] = at.split('|');
      const f = s => { const p = String(s||'').split('-'); if (p.length !== 3) return s || '-';
        const bl = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
        return `${+p[2]} ${bl[+p[1]-1]||p[1]} ${p[0]}`; };
      if (!a) return '';
      return (!b || a === b) ? f(a) : f(a) + ' – ' + f(b);
    }

    // ---------- Total Deposit / Withdraw per operator (tabel History Operator) ----------
    // Operator khusus (Blazz, Khanpay, ...) diatur admin di menu Admin > Lap Admin.
    // Total Deposit = total History Operator DIKURANGI deposit operator khusus.
    let lapSpecialOps = null, lapSpecialOpsAt = 0;
    function lapLoadSpecialOps(done) {
      if (lapSpecialOps && Date.now() - lapSpecialOpsAt < 60000) { done(); return; }
      google.script.run.withSuccessHandler(r => {
        lapSpecialOps = (r && r.success && Array.isArray(r.operators)) ? r.operators : (lapSpecialOps || []);
        lapSpecialOpsAt = Date.now(); done();
      }).withFailureHandler(() => { lapSpecialOps = lapSpecialOps || []; done(); }).lapGetSpecialOps(currentSessionToken);
    }
    function lapOpTotals() {
      const meta = (lapResults.reportAgentMeta && lapResults.reportAgentMeta[0]) || {};
      const sum = meta.summary;
      if (!sum || !sum.total || !Array.isArray(sum.rows)) return null;
      const cfg = lapSpecialOps || [];
      const per = cfg.map(c => ({ label: c.label || c.operator, deposit: 0 }));
      sum.rows.forEach(r => {
        const name = String(r.operator || '').toLowerCase();
        const i = cfg.findIndex(c => c.operator && name.includes(String(c.operator).toLowerCase()));
        if (i >= 0) per[i].deposit += Number(r.deposit || 0);
      });
      const special = per.reduce((n, x) => n + x.deposit, 0);
      // Jumlah dari baris operator tidak ambigu (angka baris "Total" tersimpan bisa bergeser kolom pada data lama) -> dipakai lebih dulu.
      const rows = sum.rows;
      const all = rows.length ? rows.reduce((n, r) => n + Number(r.deposit || 0), 0) : Number(sum.total.deposit || 0);
      const wd = rows.length ? rows.reduce((n, r) => n + Number(r.withdraw || 0), 0) : Number(sum.total.withdraw || 0);
      return { all, deposit: all - special, withdraw: wd, per };
    }
    function lapOpCardsHtml() {
      const t = lapOpTotals();
      if (!t) return `<div class="lap-stat-empty">Total Deposit &amp; Withdraw belum ada untuk periode ini. Klik <b>TARIK DATA</b> (data lama belum memuat tabel History Operator).</div>`;
      return lapStatCard('Deposit Semua Operator', lapFmt(t.all), 'text-sky-300')
        + lapStatCard('Total Deposit', lapFmt(t.deposit), 'text-emerald-400')
        + t.per.map(x => lapStatCard('Total ' + escapeHtml(x.label), lapFmt(x.deposit), 'text-amber-300')).join('')
        + lapStatCard('Total Withdraw', lapFmt(t.withdraw), 'text-rose-400');
    }

    // ---------- ADMIN (via GitHub Actions) ----------

          ${lapStatCard('WD PGA-IDF', lapFmt(wd.length) + ' (' + lapFmt(ccmeta.totalNominalWdPgaIdf) + ')', 'text-cyan-400')}

            (r,i) => `<tr>${td(i+1)}${td(r.username,'font-bold text-slate-200')}${td(lapFmt(r.deposit),'text-right '+((r.deposit>0)?'text-emerald-400 font-bold':''))}${td(lapFmt(r.withdraw),'text-right')}${td(lapFmt(r.winLose),'text-right font-bold '+((r.winLose>=0)?'text-emerald-400':'text-rose-400'))}${td(r.type,'text-[10px]')}</tr>`,

            (r,i) => [i+1,r.userId,r.nominal].join('\t'), ['userId'], {title:'ID Selisih', open:true})}
          <div class="flex flex-col gap-1.5 mt-3 mb-1 glass-inner rounded-xl p-2">
            <div class="flex flex-wrap gap-1.5 items-center"><span class="text-[9px] font-bold text-slate-500">ACTION:</span>${acts.map(a => raChip(a, `lapToggleRA('actions',${jsArg(a)},this)`)).join('')}</div>

          </div>
          ${lapTable('report_agent', ['NO','TGL TERIMA','USER','ACTION','DARI BANK','TUJUAN BANK','JUMLAH','STATUS','OPERATOR'], ra,
            (r,i) => `<tr>${td(i+1)}${td(r.tanggalTerima)}${td(r.user,'font-bold text-slate-200')}${td(r.action,'text-[10px]')}${td(r.dariBank,'text-[10px]')}${td(r.tujuanBank,'text-[10px]')}${td(r.jumlah,'text-right font-bold')}${td(r.status,'text-center text-emerald-400')}${td(r.operator,'text-indigo-400')}</tr>`,
            (r,i) => [i+1,r.tanggalTerima,r.user,r.action,r.dariBank,r.tujuanBank,r.jumlah,r.status,r.operator].join('\t'), ['user','dariBank','tujuanBank','operator'], {title:'Report Agent'})}
          ${lapTable('withdraw_pga_idf', ['NO','DATE','USER (TO)','OPERATOR (BY)','NOMINAL'], wd,
            (r,i) => `<tr>${td(i+1)}${td(r.date)}${td(r.to,'font-bold text-cyan-300')}${td(r.by,'text-indigo-300')}${td(lapFmt(r.nominal),'text-right font-bold text-cyan-400')}</tr>`,
            (r,i) => [i+1,r.date,r.to,r.by,r.nominal].join('\t'), ['to','by'], {title:'Withdraw PGA-IDF'})}
          <div class="text-[10px] text-slate-500 mt-3 mb-1">Riwayat koin: <b class="text-slate-300">${lapFmt(cc.length)}</b> baris · ${lapFmt(ccmeta.pagesScanned)} halaman di-scan · baris abu-abu = transaksi PGA/reject (tidak dihitung selisih)</div>
          ${lapTable('check_coin', ['NO','DATE','INFO','TO','BY','DEPOSIT','WITHDRAW','LAST COIN','SELISIH','HITUNG'],
            (lapResults.checkCoin || []),
            (r,i) => { const sel = r.selisih !== 0 && !r.excluded; const bg = r.isFinalRow ? 'bg-cyan-950/40 font-bold text-cyan-300' : (sel ? 'bg-rose-950/25' : (r.excluded ? 'opacity-45' : ''));
              return `<tr class="${bg}">${td(r.no)}${td(r.date)}${td(r.info,'font-semibold')}${td(r.to,'font-bold')}${td(r.by)}${td(r.deposit?lapFmt(r.deposit):'','text-right text-emerald-400')}${td(r.withdraw?lapFmt(r.withdraw):'','text-right text-rose-400')}${td(lapFmt(r.lastCoin),'text-right')}${td(r.excluded?'—':lapFmt(r.selisih),'text-right '+(sel?'text-rose-400 font-bold':'text-slate-600'))}${td(r.excluded?'—':lapFmt(r.calcCoin),'text-right text-cyan-400')}</tr>`; },
            (r,i) => [r.no,r.date,r.info,r.to,r.by,r.deposit,r.withdraw,r.lastCoin,r.selisih,r.calcCoin].join('\t'), ['to','by','info'], {title:'Riwayat Koin (Check Selisih)'})}
        </div>`);
      if (lapTblState.register) lapTblState.register.prefilter = rows => lapAdminF.refType==='all' ? rows : rows.filter(r => r.type === lapAdminF.refType);
      if (lapTblState.report_agent) lapTblState.report_agent.prefilter = rows => rows.filter(r =>
        lapAdminF.actions.has((r.action||'').trim()) && lapAdminF.agents.has((r.operator||'').trim()));
    }
    function raChip(label, fn) { return `<span class="lap-chip on" onclick="${fn}">${escapeHtml(label)}</span>`; }
    let lapAdminF = { refType:'all', actions:new Set(), agents:new Set() };
    function lapRegFilter(type, el) {
      lapAdminF.refType = type;
      document.querySelectorAll('#lap-page .lap-chip[data-rf]').forEach(c => c.classList.toggle('on', c === el));
      if (lapTblState.register) { lapTblState.register.page = 1; lapTblRepaint('register'); }
    }
    function lapToggleRA(kind, val, el) {
      const set = lapAdminF[kind]; if (!set) return;
      if (set.has(val)) set.delete(val); else set.add(val);
      el.classList.toggle('on', set.has(val));
      if (lapTblState.report_agent) { lapTblState.report_agent.page = 1; lapTblRepaint('report_agent'); }
    }
    function lapFocusSelisih(userId) {
      if (!userId) return;
      const st = lapTblState.check_coin;
      if (st) { st.q = String(userId).toLowerCase(); st.open = true; lapTblRepaint('check_coin', true); }
      document.getElementById('lapTbl_check_coin')?.scrollIntoView({ behavior: 'smooth', block:'start' });
      toast('Difokuskan ke riwayat koin: ' + userId);
    }
    function lapRunAdmin() {
      lapEnsureConfig(() => {
        if (!lapConfig || !lapConfig.linkAdmin || !lapConfig.cookiesAdmin) { toast('Isi Link & Cookie Admin di Setting dulu'); switchPage('lap-setting'); return; }
        const sd = lapDateVal('lapAdminStart'), ed = lapDateVal('lapAdminEnd');
        if (!sd || !ed) { toast('Pilih tanggal'); return; }
        lapBusy('lapAdmin', true, 'Memicu GitHub Actions...');
        google.script.run.withSuccessHandler(res => {
          if (apiFailed(res)) { lapBusy('lapAdmin', false, ''); toast(apiMessage(res, 'Gagal memicu tarik data')); return; }
          // Tampilkan progres SEKETIKA (tidak menunggu putaran polling pertama).
          if (res.jobId && !lapJobsState.jobs.some(j => j.id === res.jobId)) {
            lapJobsState.jobs.unshift({ id: res.jobId, kind: 'admin', status: 'pending', message: res.message || '', startDate: sd, endDate: ed, source: 'github', createdAt: lapWibNow(), updatedAt: lapWibNow() });
          }
          lapBusy('lapAdmin', true, res.reused ? 'Proses sebelumnya masih berjalan — progres di bawah.' : 'Berjalan — boleh pindah menu, progres tetap tersimpan.');
          lapJobsPaint();
          lapJobsFetch();
        }).withFailureHandler(e => { lapBusy('lapAdmin', false, ''); toast((e && e.message) || 'Gagal'); })
          .lapRunAdmin(currentSessionToken, sd, ed);
      });
    }

    // ===== Progres & riwayat "Tarik Data" (disimpan di server: lap_job) =====
    // Pemantau ini GLOBAL: tetap jalan walau operator pindah menu, dan setelah
    // reload langsung melanjutkan job yang masih berjalan. Poll hanya selama
    // ada job aktif (pending/running), jadi tidak membebani server saat diam.
    let lapJobsState = { jobs: [], fetchedAt: 0, offsetMs: 0 };
    let lapJobsTimer = null;
    let lapJobsTicker = null;
    const LAP_JOB_KIND_LABEL = { admin: 'Lap Admin', motion: 'Lap Motion', mozart: 'Lap Mozart' };
    const lapJobIsActive = j => j.status === 'pending' || j.status === 'running';
    // Waktu server = WIB tanpa zona ("yyyy-MM-dd HH:mm:ss").
    function lapWibMs(ts) { const d = new Date(String(ts || '').replace(' ', 'T') + '+07:00'); return isNaN(d) ? 0 : d.getTime(); }
    function lapWibNow() { return new Date(Date.now() + lapJobsState.offsetMs + 7 * 3600 * 1000).toISOString().slice(0, 19).replace('T', ' '); }
    function lapFmtDur(ms) {
      const s = Math.max(0, Math.round(ms / 1000));
      return s >= 3600 ? Math.floor(s / 3600) + 'j ' + Math.floor(s % 3600 / 60) + 'm' : Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }
    function lapJobsFetch(cb) {
      if (!currentUser || !LAP_PAGES.some(menuAllowed)) { cb && cb(); return; }
      clearTimeout(lapJobsTimer);
      google.script.run.withSuccessHandler(r => {
        if (apiFailed(r)) { lapJobsSchedule(); cb && cb(); return; }
        const wasActive = new Map(lapJobsState.jobs.filter(lapJobIsActive).map(j => [j.id, j]));
        lapJobsState = { jobs: r.jobs || [], fetchedAt: Date.now(), offsetMs: r.now ? lapWibMs(r.now) - Date.now() : 0 };
        lapJobsState.jobs.forEach(j => { if (wasActive.has(j.id) && !lapJobIsActive(j)) lapJobFinished(j); });
        lapJobsPaint();
        lapJobsSchedule();
        cb && cb();
      }).withFailureHandler(() => { lapJobsSchedule(); cb && cb(); }).lapJobs(currentSessionToken);
    }
    function lapJobsSchedule() {
      clearTimeout(lapJobsTimer);
      const active = lapJobsState.jobs.some(lapJobIsActive);
      if (currentUser && active) lapJobsTimer = setTimeout(() => lapJobsFetch(), 5000);
      // Detik berjalan pada progres (murah: cuma update teks yang terlihat).
      if (active && !lapJobsTicker) lapJobsTicker = setInterval(lapJobsTick, 1000);
      if (!active && lapJobsTicker) { clearInterval(lapJobsTicker); lapJobsTicker = null; }
      const busy = document.getElementById('navLapBusy');
      if (busy) busy.hidden = !active;
      const busyMobile = document.getElementById('navLapBusyMobile');
      if (busyMobile) busyMobile.hidden = !active;
    }
    function lapJobFinished(j) {
      const label = LAP_JOB_KIND_LABEL[j.kind] || 'Laporan';
      if (j.status === 'done') {
        if (j.kind === 'admin') {
          lapPageCache['lap-admin'] = null;
          lapBusy('lapAdmin', false, '');
          if (currentPage === 'lap-admin') renderLapPage('lap-admin', true);
        }
        toast(label + ' selesai — data terbaru sudah tersimpan.');
      } else {
        if (j.kind === 'admin') lapBusy('lapAdmin', false, '');
        toast(label + ' gagal: ' + (j.message || j.status));
      }
    }
    function lapJobsTick() {
      document.querySelectorAll('[data-lap-since]').forEach(el => {
        el.textContent = lapFmtDur(Date.now() + lapJobsState.offsetMs - lapWibMs(el.getAttribute('data-lap-since')));
      });
    }
    function lapJobsCardHtml(kind) {
      return '<div class="lap-jobs" data-lap-jobs="' + escapeHtml(kind) + '"></div>';
    }
    function lapJobStatusBadge(j) {
      const map = { pending: ['is-run', 'fa-hourglass-half', 'Antre'], running: ['is-run', 'fa-gear fa-spin', 'Berjalan'], done: ['is-ok', 'fa-check', 'Selesai'], error: ['is-bad', 'fa-xmark', 'Gagal'], stale: ['is-bad', 'fa-triangle-exclamation', 'Macet'] };
      const m = map[j.status] || ['is-run', 'fa-circle', j.status];
      return '<span class="lap-job-badge ' + m[0] + '"><i class="fa-solid ' + m[1] + '"></i>' + escapeHtml(m[2]) + '</span>';
    }
    function lapJobSteps(j) {
      // Job GitHub Actions: Dipicu -> Antre -> Mengambil data -> Tersimpan.
      const steps = ['Dipicu', 'Antre di GitHub Actions', 'Mengambil data', 'Tersimpan di panel'];
      const at = j.status === 'pending' ? 1 : j.status === 'running' ? 2 : j.status === 'done' ? 4 : (j.updatedAt && j.updatedAt !== j.createdAt ? 2 : 1);
      const failed = j.status === 'error' || j.status === 'stale';
      return '<ol class="lap-steps">' + steps.map((s, i) => {
        const state = i < at ? 'done' : i === at ? (failed ? 'fail' : 'now') : 'todo';
        const icon = state === 'done' ? 'fa-check' : state === 'fail' ? 'fa-xmark' : state === 'now' ? 'fa-circle-notch fa-spin' : 'fa-circle';
        return '<li class="is-' + state + '"><span class="lap-step-dot"><i class="fa-solid ' + icon + '"></i></span><span class="lap-step-label">' + escapeHtml(s) + '</span></li>';
      }).join('') + '</ol>';
    }
    function lapJobsPaint() {
      document.querySelectorAll('[data-lap-jobs]').forEach(box => {
        const kind = box.getAttribute('data-lap-jobs');
        const jobs = lapJobsState.jobs.filter(j => j.kind === kind);
        const active = jobs.find(lapJobIsActive);
        const label = LAP_JOB_KIND_LABEL[kind] || 'Laporan';
        let html = '<div class="lap-jobs-head"><span><i class="fa-solid fa-list-check"></i>Progres &amp; Riwayat Tarik Data</span>' +
          '<button type="button" class="lap-jobs-refresh" onclick="lapJobsFetch()" title="Muat ulang progres" aria-label="Muat ulang progres"><i class="fa-solid fa-rotate"></i></button></div>';
        if (active) {
          html += '<div class="lap-job-active">' +
            '<div class="lap-job-active-top"><b>' + escapeHtml(label) + ' · ' + escapeHtml(active.startDate || '') + (active.endDate && active.endDate !== active.startDate ? ' s/d ' + escapeHtml(active.endDate) : '') + '</b>' +
            '<span class="lap-job-elapsed-wrap"><i class="fa-regular fa-clock"></i><span data-lap-since="' + escapeHtml(active.createdAt) + '">' + lapFmtDur(Date.now() + lapJobsState.offsetMs - lapWibMs(active.createdAt)) + '</span></span></div>' +
            lapJobSteps(active) +
            '<div class="lap-job-note">' + escapeHtml(active.message || '') + ' <span class="text-slate-500">— boleh ditinggal ke menu lain, progres tetap tersimpan.</span></div></div>';
        }
        const rows = jobs.filter(j => j !== active).slice(0, 5);
        if (rows.length) {
          html += '<div class="lap-jobs-table-wrap"><table class="lap-jobs-table stack-sm"><thead><tr><th>Waktu</th><th>Periode</th><th>Status</th><th>Durasi</th><th>Keterangan</th></tr></thead><tbody>' +
            rows.map(j => {
              const dur = lapWibMs(j.updatedAt) - lapWibMs(j.createdAt);
              return '<tr><td data-label="Waktu">' + escapeHtml(String(j.createdAt).slice(5, 16)) + '</td>' +
                '<td data-label="Periode">' + escapeHtml(j.startDate || '-') + (j.endDate && j.endDate !== j.startDate ? '<br><span class="text-slate-500">s/d ' + escapeHtml(j.endDate) + '</span>' : '') + '</td>' +
                '<td data-label="Status">' + lapJobStatusBadge(j) + '</td>' +
                '<td data-label="Durasi">' + (j.source === 'import' ? '<span class="text-slate-500">import</span>' : (dur > 0 ? lapFmtDur(dur) : '-')) + '</td>' +
                '<td class="lap-job-msg stack-full" data-label="Keterangan">' + escapeHtml(j.message || '') + '</td></tr>';

      if (key === 'backup') key = 'maintenance';
      if (ADMIN_PANELS.indexOf(key) < 0) key = 'users';

      document.querySelectorAll('#admin-page .admin-tab').forEach(t =>
        t.classList.toggle('active', t.dataset.adminTab === key));
      document.querySelectorAll('#admin-page .admin-panel').forEach(p =>
        p.classList.toggle('active', p.dataset.adminPanel === key));
      const sel = document.getElementById('adminTabSelect');
      if (sel && sel.value !== key) sel.value = key;

      // Muat data panel yang dibuka (pakai cache/freshness di masing-masing loader).
      if (key === 'users') {

    function showPredictionSendResult(result) {
      activePredictionKind = result && result.kind === 'closing' ? 'closing' : 'schedule';
      if (activePredictionKind === 'closing') {
        activePredictionIndex = -1;
        activeClosingSlot = String(result.activeSlot || activeClosingSlot || '');
      } else {
        activePredictionIndex = Number(result.predictionIndex);
        activeClosingSlot = '';
      }
      lastPredictionPendingWebsites = Array.isArray(result.pendingWebsites) ? result.pendingWebsites : [];
      const rows = Array.isArray(result.websiteResults) ? result.websiteResults : [];
      let success = 0;
      let already = 0;
      let failed = 0;
      let processing = 0;

      const cards = rows.map(item => {
        const status = String(item.status || 'GAGAL').toUpperCase();
        let statusClass = 'fail';
        let statusLabel = status;
        let icon = 'fa-triangle-exclamation';

        if (status === 'BERHASIL') {
          success++;
          statusClass = 'ok';
          statusLabel = 'TERKIRIM';
          icon = 'fa-circle-check';
        } else if (status === 'SUDAH DIKIRIM') {
          already++;
          statusClass = 'already';
          icon = 'fa-shield-halved';
        } else if (status === 'SEDANG DIPROSES') {
          processing++;
          statusClass = 'processing';
          icon = 'fa-spinner fa-spin';
        } else {
          failed++;
        }

        return `
          <div class="prediction-site-card">
            <div class="prediction-site-head">
              <div class="prediction-site-name"><i class="fa-brands fa-telegram mr-2 text-cyan-400"></i>${escapeHtml(item.website || '-')}</div>
              <span class="prediction-site-status ${statusClass}"><i class="fa-solid ${icon} mr-1"></i>${escapeHtml(statusLabel)}</span>
            </div>
            <div class="prediction-site-reason">${escapeHtml(item.reason || '-')}</div>
          </div>
        `;
      }).join('');

      document.getElementById('predictionSendList').innerHTML = cards || '<div class="text-xs text-slate-400">Tidak ada website yang diproses.</div>';
      document.getElementById('predictionResultTitle').textContent = result.predictionName || 'Hasil pengiriman prediksi';
      const predSummary = [];
      if (success) predSummary.push(`<span class="summary-pill status-ok">${success} terkirim</span>`);
      if (already) predSummary.push(`<span class="summary-pill status-skip">${already} diblokir duplikat</span>`);
      if (failed) predSummary.push(`<span class="summary-pill status-bad">${failed} belum terkirim</span>`);
      if (processing) predSummary.push(`<span class="summary-pill status-skip">${processing} diproses</span>`);
      if (!predSummary.length) predSummary.push(`<span class="summary-pill status-skip">Tidak ada yang diproses</span>`);
      if (result && result.performance) {
        const ms = Number(result.performance.totalMs || result.durationMs || 0);
        if (ms) predSummary.push(`<span class="summary-pill status-skip">⚡ ${(ms / 1000).toFixed(1)}s</span>`);
      }
      document.getElementById('predictionResultSummary').innerHTML = predSummary.join('');

      const retryBtn = document.getElementById('predictionRetryPendingBtn');
      retryBtn.style.display = lastPredictionPendingWebsites.length ? 'block' : 'none';
      retryBtn.innerHTML = `<i class="fa-solid fa-paper-plane mr-2"></i>KIRIM ${lastPredictionPendingWebsites.length} WEBSITE BELUM TERKIRIM`;
      document.getElementById('predictionResultActions').classList.toggle('two', lastPredictionPendingWebsites.length > 0);
      document.getElementById('predictionSendModal').classList.add('open');
    }

    function retryPendingPrediction() {
      if (!lastPredictionPendingWebsites.length) return;

    // Ringkasan header di-refresh oleh live-poll adaptif (startLivePolling),
    // yang otomatis berhenti saat tab tidak terlihat. Interval lama dihapus.

    /* ================= LIVE POLL ADAPTIF =================
       Pengganti WebSocket/SSE (tidak tersedia di Apps Script). Satu endpoint
       gabungan (getLivePanelData) dipoll dengan interval yang menyesuaikan:
         - tab tidak terlihat  -> berhenti total
         - user aktif          -> 15 dtk
         - idle 1.5-5 mnt       -> 30 dtk
         - idle > 5 mnt         -> 60 dtk
       Begitu tab kembali fokus / user pindah menu -> langsung sinkron 1x. */
    function markUserActive(){ lastUserActivityAt = Date.now(); }
    ['click','keydown','touchstart','mousemove','scroll'].forEach(ev =>
      document.addEventListener(ev, markUserActive, { passive:true }));

    function livePollDelayMs(){
      // Overlay maintenance sedang tampil -> cek lebih sering (10 dtk) supaya panel
      // langsung terbuka begitu admin mematikan maintenance, walau tab di belakang.
      if (maintenanceState && document.getElementById('maintenanceModal').classList.contains('open')) {
        return document.hidden ? 20000 : 10000;
      }
      // Tab tidak terlihat: TIDAK berhenti total, hanya melambat ke 2 menit supaya
      // data tetap "hangat" tanpa boros kuota. Begitu tab dibuka lagi -> sinkron 1x instan.
      if (document.hidden) return 180000;
      if (livePollFailStreak >= 4) return 90000; // endpoint bermasalah -> jangan spam
      const idle = Date.now() - lastUserActivityAt;
      // Halaman Aktivitas butuh refresh log lebih sering.
      // Halaman lain (Result/Prediksi/Invest/Lap) cuma perlu status header -> lebih lambat,
      // hemat request Worker & baca D1 (16 CS x poll cepat = dekat limit 100k req/hari).
      const onLog = currentPage === 'activity';
      if (idle > 300000) return onLog ? 75000 : 150000;
      if (idle > 90000)  return onLog ? 45000 : 90000;
      return onLog ? 20000 : 45000;
    }

    function scheduleLivePoll(){
      clearTimeout(livePollTimer);
      livePollTimer = setTimeout(() => pumpLivePoll(false), livePollDelayMs());
    }

    function activityFiltersActive(){
      return ACTIVITY_FILTERS.some(suffix => {

        return el && String(el.value || '').trim();

    function pumpLivePoll(immediate){
      if (!currentUser) return;
      if (document.hidden && !immediate) { scheduleLivePoll(); return; }
      // Watchdog: kalau permintaan sebelumnya "nyangkut" > 35 dtk, anggap gagal
      // supaya rantai polling tidak pernah macet permanen.
      if (livePollInFlight) {
        if (Date.now() - livePollStartedAt < 35000) return;
        livePollInFlight = false;
      }
      livePollStartedAt = Date.now();

      const wantActivity = currentPage === 'activity'
        && activityView.page === 1
        && !activityFiltersActive();
      const wantSessions = currentPage === 'admin' && currentAdminPanel === 'sesi';
      const req = wantActivity ? getActivityRequest(false) : null;

      livePollInFlight = true;
      google.script.run
        .withSuccessHandler(res => {
          livePollInFlight = false;
          livePollFailStreak = 0;
          // Status maintenance ikut tiap poll -> overlay member muncul/hilang otomatis.
          if (res && res.maintenance) {
            setMaintenanceLock(res.maintenance.enabled, res.maintenance.message);
          } else if (res && res.success === false
                     && /maintenance|pemeliharaan|perbaikan|maintening/i.test(res.message || '')) {
            // Cadangan untuk server LAMA: getLivePanelData menolak non-admin saat
            // maintenance dengan melempar pesannya -> tampilkan overlay dari pesan itu.
            setMaintenanceLock(true, res.message);
          }
          if (res && res.success) {
            if (res.summary) {
              renderHeaderSummary(document.getElementById('headerSummary'), res.summary);
              headerSummaryLoadedOnce = true;
            }
            if (res.activity && wantActivity && res.activity.stats && Array.isArray(res.activity.rows)) {
              applyDashboardData(res.activity);
            }
            if (res.sessions && wantSessions) renderActiveSessions(res.sessions);
          }
          scheduleLivePoll();
        })
        .withFailureHandler(() => {
          livePollInFlight = false;
          livePollFailStreak++;
          // Endpoint gabungan mungkin belum ter-deploy -> pakai jalur lama.
          if (livePollFailStreak >= 2) {
            if (!headerSummaryLoadedOnce || livePollFailStreak === 2) loadHeaderSummary();
            if (currentPage === 'admin' && currentAdminPanel === 'sesi') loadActiveSessions();
          }
          scheduleLivePoll();
        })
        .getLivePanelData(currentSessionToken, { activity: req, sessions: wantSessions });
    }

    function startLivePolling(){
      livePollFailStreak = 0;

    let toastHideTimer = null;
    function toast(message) {
      const text = String(message || '').replace(/^[^\wÀ-ÿ]+/u, '').trim();
      const lower = text.toLowerCase();
      const type =
        lower.includes('gagal') || lower.includes('error') || lower.includes('❌')
          ? 'danger'
          : lower.includes('berhasil') || lower.includes('disalin') || lower.includes('selamat')
            ? 'success'
            : lower.includes('peringatan') || lower.includes('diblokir')
              ? 'warning'
              : 'info';
      const iconMap = { success:'fa-circle-check', danger:'fa-circle-xmark', warning:'fa-triangle-exclamation', info:'fa-circle-info' };

      const box = document.getElementById('toast');
      const icon = document.getElementById('toast-icon');
      const msg = document.getElementById('toast-msg');
      if (!box || !msg) return;

      box.className = `floating-toast type-${type}`;
      if (icon) icon.innerHTML = `<i class="fa-solid ${iconMap[type]}"></i>`;
      msg.textContent = text;

      // Reflow paksa (SINKRON, bukan requestAnimationFrame) supaya animasi "show" jalan
      // lagi meski toast sebelumnya belum sempat hilang. requestAnimationFrame menunda
      // penambahan class "show" ke frame berikutnya -- kalau hideToast() (dipanggil
      // switchPage() tiap pindah menu) kebetulan jalan di jeda itu, timer auto-hide yang
      // baru saja dijadwalkan di bawah ini sudah kadung dibatalkan duluan, lalu "show"
      // baru ditambahkan belakangan tanpa ada timer yang akan menghapusnya lagi -> toast
      // nyangkut permanen sampai reload. Reflow paksa lewat offsetWidth tidak punya jeda
      // async sama sekali, jadi race ini tidak mungkin terjadi lagi.
      void box.offsetWidth;
      box.classList.add('show');

      clearTimeout(toastHideTimer);
      toastHideTimer = setTimeout(() => box.classList.remove('show'), 2600);
    }
    function hideToast() {
      clearTimeout(toastHideTimer);
      const b = document.getElementById('toast');

    }

    let shioNames = ['KUDA','ULAR','NAGA','KELINCI','HARIMAU','KERBAU','TIKUS','BABI','ANJING','AYAM','MONYET','KAMBING'], shioZero = 'KELINCI';
    function shioMapLoad() {
      google.script.run.withSuccessHandler(r => {

    function getShioLocal(num) {

    function processTextLocal(text) {
      try {
        if (!text || text.length < 5) return { market:'UNKNOWN', status:'SALAH', shio:'', twoDigit:'', output:'', prize1:'', prize2:'', prize3:'' };
        const marketMatch = text.match(/Pasaran\s+(.*)/i);
        const market = marketMatch ? marketMatch[1].trim() : 'UNKNOWN';
        const prize1 = ((text.match(/Prize\s*1[^0-9]*(\d{4})/i) || [])[1] || '');
        if (!prize1) return { market, status:'SALAH', shio:'', twoDigit:'', output:'', prize1:'', prize2:'', prize3:'' };
        const prize2 = ((text.match(/Prize\s*2[^0-9]*(\d{4})/i) || [])[1] || '');
        const prize3 = ((text.match(/Prize\s*3[^0-9]*(\d{4})/i) || [])[1] || '');
        const twoDigit = Number(prize1.slice(-2));
        const shio = getShioLocal(twoDigit);
        const shioInput = ((text.match(/Shio\s*:\s*([A-Z]+)/i) || [])[1] || '').toUpperCase();
        const status = shioInput ? (shioInput === shio ? 'BENAR' : 'SALAH') : 'BENAR';
        let output = text.trim();
        output = output.replace(/Prize\s*1\s*:/gi, 'Prize 1️⃣ :').replace(/Prize\s*2\s*:/gi, 'Prize 2️⃣ :').replace(/Prize\s*3\s*:/gi, 'Prize 3️⃣ :');
        if (/Shio\s*:/i.test(output)) output = output.replace(/Shio\s*:.*$/im, 'Shio : ' + shio);
        else output += '\n\nShio : ' + shio;
        output = output.replace(/Selamat kepada para pemenang jackpot\s*\.?/i, 'Selamat kepada para pemenang jackpot 🙏🏻');
        return { market, status, shio, twoDigit, output, prize1, prize2, prize3 };
      } catch (_) {
        return { market:'UNKNOWN', status:'SALAH', shio:'', twoDigit:'', output:'', prize1:'', prize2:'', prize3:'' };
      }
    }

    /* Tombol "Tempel": ambil isi clipboard lalu masukkan ke input.
       - textarea: ganti seluruh isi + jalankan autoGenerate (preview langsung terisi).
       - angka: ambil 4 digit pertama yang ketemu kalau ada, kalau tidak pakai apa adanya. */
    async function pasteFromClipboard(targetId, isTextarea) {
      const el = document.getElementById(targetId);
      if (!el) return;
      let text = '';
      try {
        text = await navigator.clipboard.readText();
      } catch (e) {
        toast('❌ Browser menolak akses clipboard. Tekan lama lalu pilih Tempel, atau Ctrl+V manual.');
        el.focus();
        return;
      }
      text = String(text || '').trim();
      if (!text) { toast('Clipboard kosong'); return; }

      if (isTextarea) {
        el.value = text;
        el.dispatchEvent(new Event('input', { bubbles: true }));
        autoGenerate();
        toast('📋 Teks berhasil ditempel');
      } else {
        const digits = (text.match(/\d{4,}/) || [text.replace(/\D/g, '')])[0] || '';
        el.value = digits.slice(0, 12);
        el.dispatchEvent(new Event('input', { bubbles: true }));
        toast(el.value ? '📋 Angka ditempel: ' + el.value : 'Tidak ada angka di clipboard');
      }
      el.focus();
    }

    /* Buka date-picker native saat field tanggal diklik di mana saja (bukan cuma ikon). */

    }

    // Tahap 1 (FOLD): tombol diperas jadi kapsul kecil. Tahap 2 (FLY): pesawat besar
    // lepas landas dari titik tengah kapsul lalu terbang pergi.
    const SEND_FOLD_MS = 260;
    const SEND_FLY_MS = 560;
    // Popup loading sengaja DITUNDA sampai seluruh animasi ini selesai, supaya popup
    // (yang menutupi seluruh kartu) tidak langsung menimpa animasi tombol.
    const SEND_PLANE_DURATION_MS = SEND_FOLD_MS + SEND_FLY_MS;

    function dgPrefersReducedMotion_() {
      try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
      catch (e) { return false; }
    }

    // Dijalankan lewat Web Animations API (element.animate()), BUKAN class+CSS.
    // Tombol ini juga punya `active:scale-95` (Tailwind) dan efek tekan universal
    // (button:active{transform:scale(.965)}) yang rebutan properti `transform` yang
    // sama di saat bersamaan dengan animasi lipat — itu sumber "patah-patah"
    // sebelumnya. WAAPI selalu menang atas transisi CSS manapun untuk properti yang
    // sama, jadi tidak ada lagi rebutan, hasilnya mulus di semua kondisi.
    // Return value: {animated:boolean, landing:{x,y}|null}. `landing` = titik tujuan
    // pesawat DI LAYAR (viewport) — dipakai showActionPopup supaya popup Loading
    // terasa "terbuka" dari titik itu.
    //
    // Lintasannya dihitung MANUAL (kurva Bezier kuadratik di JS -> daftar titik ->
    // dijadikan keyframe transform:translate biasa). Sebelumnya sempat memakai CSS
    // Motion Path (offset-path), tapi ternyata perilakunya TIDAK bisa diandalkan
    // untuk elemen position:fixed di berbagai browser (arah lintasan jadi salah,
    // pesawat "hilang" di tempat yang tidak terduga). Pendekatan manual ini 100%
    // dikontrol sendiri (matematika translate biasa, sudah terbukti benar).
    function launchSendPlane(btnEl) {
      if (!btnEl || typeof btnEl.animate !== 'function' || dgPrefersReducedMotion_()) {
        return { animated: false, landing: null };
      }

      // Titik tengah tombol DI LAYAR. Karena scale() melipat tombol di sekitar
      // titik tengahnya sendiri, titik ini TIDAK berpindah selama animasi lipat.
      const btnRect = btnEl.getBoundingClientRect();
      const startX = btnRect.left + btnRect.width / 2;
      const startY = btnRect.top + btnRect.height / 2;

      // Tujuan pesawat = TITIK TENGAH LAYAR — di situlah popup Loading akan tampil
      // (#actionPopup ditengahkan lewat flexbox), supaya pesawat benar-benar
      // "terbang menuju tempat popup akan berada", lalu titik itu membuka popupnya.
      const targetX = window.innerWidth / 2;
      const targetY = window.innerHeight / 2;
      const landing = { x: targetX, y: targetY };

      // Vektor start->target, dan titik kontrol kurva digeser TEGAK LURUS terhadap
      // garis lurus itu supaya lintasannya sungguhan melengkung (bukan diagonal lurus).
      const dx = targetX - startX;
      const dy = targetY - startY;
      const dist = Math.max(1, Math.hypot(dx, dy));
      const perpX = -dy / dist;
      const perpY = dx / dist;
      const bulge = Math.min(220, dist * 0.4);
      const controlX = dx / 2 + perpX * bulge;
      const controlY = dy / 2 + perpY * bulge;

      // Titik pada kurva Bezier kuadratik P0=(0,0) P1=control P2=(dx,dy), t di [0,1].
      // Semua koordinat RELATIF terhadap titik start (startX,startY).
      function bezierPoint(t) {
        const mt = 1 - t;
        return {
          x: 2 * mt * t * controlX + t * t * dx,
          y: 2 * mt * t * controlY + t * t * dy
        };
      }

      // Sudut arah gerak SESAAT di titik t (turunan kurva, dihitung numerik via selisih
      // titik sedikit sebelum & sesudah t) -> dipakai supaya moncong pesawat betulan
      // menghadap ke arah dia terbang di titik manapun, bukan angka rotasi tetap yang
      // tidak nyambung kalau tombolnya ada di posisi berbeda di layar.
      function curveTangentDeg(t) {
        const ahead = bezierPoint(Math.min(1, t + .03));
        const behind = bezierPoint(Math.max(0, t - .03));
        return Math.atan2(ahead.y - behind.y, ahead.x - behind.x) * 180 / Math.PI;
      }
      // Ikon fa-paper-plane menghadap timur-laut (kanan-atas, ~-45°) saat rotate(0deg)
      // di CSS -> offset ini menyamakan "arah hadap" ikon dengan arah tangen kurva.
      const PLANE_ICON_ANGLE_OFFSET = 45;

      const startRadius = getComputedStyle(btnEl).borderRadius || '16px';

      btnEl.style.willChange = 'transform';
      const runningAnimations = [];

      // Tahap 1 — lipat: tombol diperas jadi kapsul kecil.
      runningAnimations.push(btnEl.animate([
        { transform: 'scale(1,1) rotate(0deg)', borderRadius: startRadius },
        { transform: 'scale(.16,.56) rotate(-3deg)', borderRadius: '999px' }
      ], { duration: SEND_FOLD_MS, easing: 'cubic-bezier(.55,0,.85,.05)', fill: 'forwards' }));

      // Teks/ikon asli fade out bersamaan dengan lipatan.
      ['.btn-send-icon', '.btn-send-label', '.btn-send-suffix'].forEach(function (sel) {
        const el = btnEl.querySelector(sel);
        if (el) runningAnimations.push(el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 140, fill: 'forwards' }));
      });

      // Setelah lipatan selesai -> kembalikan tombol ke gaya CSS aslinya (cancel()
      // menghapus efek WAAPI) dan buang elemen pesawat/jejak.
      const restore = function () {
        runningAnimations.forEach(function (a) { try { a.cancel(); } catch (e) {} });
        btnEl.style.willChange = '';
      };

      // Titik sampel di sepanjang kurva + nilai opacity/scale/rotate pesawat di tiap
      // titik itu (t=0 di tombol, t=1 di tengah layar / titik popup).
      const PLANE_KEYS = [
        { t: 0,    op: 0,  sc: .3 },
        { t: .15,  op: 1,  sc: 1.3 },
        { t: .35,  op: 1,  sc: .95 },
        { t: .55,  op: 1,  sc: .65 },
        { t: .78,  op: 1,  sc: .45 },
        { t: .93,  op: .5, sc: .35 },
        { t: 1,    op: 0,  sc: .3 }
      ];
      const TRAIL_KEYS = [
        { t: 0,   op: 0,  sx: .1 },
        { t: .12, op: .9, sx: .35 },
        { t: .3,  op: .85, sx: .7 },
        { t: .5,  op: .6, sx: 1 },
        { t: .68, op: .3, sx: 1 },
        { t: .8,  op: 0,  sx: 1 }
      ];

      const launchPlane = function () {
        // Tahap 2 — pesawat besar lepas landas dari titik tengah kapsul. Ditaruh di
        // document.body (position:fixed) supaya ukurannya tetap proporsional, tidak
        // ikut kegepeng oleh transform scale non-seragam tombol.
        const trail = document.createElement('span');
        trail.className = 'send-launch-trail';
        trail.style.left = startX + 'px';
        trail.style.top = startY + 'px';
        document.body.appendChild(trail);

        const plane = document.createElement('i');
        plane.className = 'fa-solid fa-paper-plane send-launch-plane';
        plane.style.left = startX + 'px';
        plane.style.top = startY + 'px';
        document.body.appendChild(plane);

        const planeFrames = PLANE_KEYS.map(function (k) {
          const pt = bezierPoint(k.t);
          const rot = curveTangentDeg(k.t) + PLANE_ICON_ANGLE_OFFSET;
          return {
            transform: 'translate(calc(-50% + ' + Math.round(pt.x) + 'px), calc(-50% + ' + Math.round(pt.y) + 'px)) scale(' + k.sc + ') rotate(' + rot.toFixed(1) + 'deg)',
            opacity: k.op,
            offset: k.t
          };
        });
        plane.animate(planeFrames, { duration: SEND_FLY_MS, easing: 'linear', fill: 'forwards' });

        // Jejak: sudutnya dihitung dari arah gerak sesaat (titik sedikit di depan
        // pada kurva yang sama) supaya tampak seperti ekor asap mengikuti lengkungan.
        const trailFrames = TRAIL_KEYS.map(function (k) {
          const pt = bezierPoint(k.t);
          const ahead = bezierPoint(Math.min(1, k.t + .04));
          const angle = Math.atan2(ahead.y - pt.y, ahead.x - pt.x) * 180 / Math.PI;
          return {
            transform: 'translate(calc(-50% + ' + Math.round(pt.x) + 'px), calc(-50% + ' + Math.round(pt.y) + 'px)) rotate(' + angle.toFixed(1) + 'deg) scaleX(' + k.sx + ')',
            opacity: k.op,
            offset: k.t
          };
        });
        trail.animate(trailFrames, { duration: SEND_FLY_MS, easing: 'linear', fill: 'forwards' });

        setTimeout(function () {
          plane.remove();
          trail.remove();
          restore();
        }, SEND_FLY_MS);
      };

      runningAnimations[0].finished.then(launchPlane, launchPlane);
      return { animated: true, landing: landing };
    }

    // Kedip hijau "✓ TERKIRIM" sesaat pada tombol saat pengiriman sukses.
    function flashSendSuccess(btnEl) {
      if (!btnEl) return;
      const icon = btnEl.querySelector('.btn-send-icon');
      const label = btnEl.querySelector('.btn-send-label');
      if (!icon || !label) return;
      const prevIconClass = icon.className;
      const prevLabelText = label.textContent;
      btnEl.classList.add('is-sent');
      icon.className = 'fa-solid fa-check btn-send-icon';
      label.textContent = 'TERKIRIM';
      setTimeout(() => {
        btnEl.classList.remove('is-sent');
        icon.className = prevIconClass;
        label.textContent = prevLabelText;
      }, 1400);
    }

    // =========================================================
    // FAST AUTO SEND
    // Satu klik = satu panggilan server.
    // Backend membaca Users, Sosmed, dan Sent Registry sekali,
    // melewati duplikat, lalu langsung mengirim website yang belum.
    // =========================================================
    function triggerAutoSend(btnEl) {
      const txt = document.getElementById('inputText').value.trim();
      if (!txt) {
        toast('❌ Input Data Kosong!');
        return;
      }

      const btn = btnEl || document.getElementById('autoSendBtn');
      // Cegah klik/ketuk ganda: popup loading baru muncul setelah animasi, jadi tanpa penjaga ini dua pengiriman bisa berjalan.
      if (btn && btn.dataset.sending === '1') return;
      if (btn) { btn.dataset.sending = '1'; setTimeout(() => { delete btn.dataset.sending; }, 6000); }
      const launch = launchSendPlane(btn);

      // Popup loading (menutupi seluruh kartu) sengaja ditunda sampai animasi
      // pesawat selesai terbang, supaya animasinya tidak langsung ketutupan.
      // Kalau animasi di-skip (mis. prefers-reduced-motion), jangan ikut menunda.
      if (launch.animated) setTimeout(() => dispatchAutoSend(txt, btn, launch.landing), SEND_PLANE_DURATION_MS);
      else dispatchAutoSend(txt, btn, null);
    }

    function dispatchAutoSend(txt, btn, landingPoint) {
      pendingSendText = txt;
      // landingPoint (titik pesawat mendarat di layar) dipakai supaya popup Loading
      // terasa "membuka" dari situ, bukan muncul begitu saja di tengah layar.
      showActionPopup(
        'LOADING',
        'Auto Send Berjalan',
        'Memeriksa izin, melewati duplikat, dan mengirim website yang belum...',
        'fa-paper-plane',
        landingPoint
      );

      google.script.run
        .withSuccessHandler(result => {
          closeActionPopup();

          if (!result) {
            showActionPopup(
              'ERROR',
              'Tidak Ada Respons',
              'Server tidak mengembalikan hasil pengiriman.',
              'fa-triangle-exclamation'
            );
            return;
          }

          if (result.blocked && (!result.websiteResults || !result.websiteResults.length)) {
            showActionPopup(
              'ERROR',
              'Pengiriman Diblokir',
              result.message || 'Pengiriman tidak dapat diproses.',
              'fa-ban'
            );
            return;
          }

          // Hasil selalu ditampilkan, termasuk website duplikat,
          // tidak diizinkan, gagal, dan berhasil.
          if (result.success || result.partial) flashSendSuccess(btn);
          pendingPreview = null;
          showSendResult(result);
          autoInputNotify(result.autoInput);
        })
        .withFailureHandler(err => {
          showActionPopup(
            'ERROR',
            'Pengiriman Gagal',
            (err && err.message) || 'Terjadi kesalahan saat menghubungi server.',
            'fa-triangle-exclamation'
          );
        })
        .smartAutoSendFast(txt, currentSessionToken);
    }

    // ===== Auto Prediksi: input Nomor Keluar + Hitung otomatis di admin website =====
    let autoInputState = null;
    let autoInputTimer = null;
    let autoInputSig = '';

    // Server hanya MEMBUAT job; tiap website dijalankan lewat panggilan terpisah (autoInputRun) karena
    // Worker paket gratis dibatasi 50 subrequest per panggilan.
    function autoInputNotify(a) {
      if (!a) return;
      if (a.skippedReason) { setTimeout(() => toast('Auto Prediksi dilewati: ' + a.skippedReason), 1800); return; }
      const rs = Array.isArray(a.results) ? a.results : [];
      const queued = rs.filter(r => r.status === 'ANTRI' && r.jobId);
      const out = rs.filter(r => r.status !== 'ANTRI');
      if (!queued.length) { autoInputShow(out); return; }
      setTimeout(() => toast('Auto Prediksi: memproses ' + queued.map(q => q.website).join(', ') + '…'), 1500);
      let left = queued.length;
      const finish = () => { if (--left === 0) autoInputShow(out); };
      queued.forEach(q => {
        google.script.run
          .withSuccessHandler(res => {
            const ok = !!(res && res.success);
            out.push({
              website: (res && res.website && res.website !== '-') ? res.website : q.website,
              status: ok ? 'BERHASIL' : ((res && res.status) || 'GAGAL'),
              detail: apiMessage(res && res.detail ? { message: res.detail } : res),
              manual: !ok && !(res && res.manual === false)
            });
            finish();
          })
          .withFailureHandler(err => {
            out.push({ website: q.website, status: 'GAGAL', detail: ((err && err.message) || 'Koneksi putus') + ' — CEK MANUAL di admin website.', manual: true });
            finish();
          })
          .autoInputRun(currentSessionToken, q.jobId);
      });
    }

    function autoInputShow(rs) {
      const bad = rs.filter(r => r.manual);
      if (bad.length) {
        showActionPopup('ERROR', 'Auto Prediksi: ' + bad.length + ' website perlu dicek MANUAL',
          bad.map(r => r.website + ': ' + r.detail).join('\n'), 'fa-triangle-exclamation');
        return;
      }
      const ok = rs.filter(r => r.status === 'BERHASIL').map(r => r.website);
      if (ok.length) toast('Auto Prediksi: dihitung di ' + ok.join(', '));
    }

    function loadAutoInputPage(silent) {
      google.script.run
        .withSuccessHandler(res => {
          if (apiFailed(res)) { if (!silent) toast(apiMessage(res)); return; }
          // Poll senyap: render ulang HANYA bila datanya berubah (dulu seluruh halaman ditimpa tiap 6 dtk -> isian yang belum disimpan hilang).
          const sig = JSON.stringify(res);
          if (silent && sig === autoInputSig) return;
          autoInputSig = sig;
          autoInputState = res;
          renderAutoInputPage();
        })
        .withFailureHandler(err => { if (!silent) toast((err && err.message) || 'Gagal memuat Auto Prediksi'); })
        .autoInputGetState(currentSessionToken);
      clearInterval(autoInputTimer);
      autoInputTimer = setInterval(() => {
        if (currentPage !== 'auto-input') { clearInterval(autoInputTimer); return; }
        if (document.hidden) return;
        // Jangan menimpa kolom yang sedang diketik.
        const ae = document.activeElement;
        if (ae && /^(INPUT|SELECT)$/.test(ae.tagName) && document.getElementById('auto-input-page').contains(ae)) return;
        loadAutoInputPage(true);
      }, 6000);
    }

    function renderAutoInputPage() {
      const host = document.getElementById('auto-input-page');
      const st = autoInputState;
      if (!host || !st) return;
      const esc = escapeHtml;
      const stColor = { DONE: 'text-emerald-400', FAILED: 'text-rose-400', RUNNING: 'text-amber-300', QUEUED: 'text-sky-300', SKIPPED: 'text-slate-400' };
      const stLabel = { DONE: 'SELESAI', FAILED: 'GAGAL', RUNNING: 'BERJALAN', QUEUED: 'ANTRI', SKIPPED: 'DILEWATI' };
      const rows = (st.websites || []).map((w, i) => `
        <div class="glass-inner rounded-2xl p-3.5 flex flex-col gap-2 border border-white/5">
          <div class="flex items-center justify-between gap-2">
            <b class="text-sm text-cyan-300">${esc(w.website)}</b>
            <span class="text-[10px] font-bold ${w.hasSession ? 'text-emerald-400' : 'text-slate-500'}">${w.hasSession ? 'TERSIMPAN ' + esc(w.hint) : 'BELUM ADA SESI'}</span>
          </div>
          <input id="aiUrl${i}" type="text" autocomplete="off" value="${esc(w.baseUrl)}" placeholder="URL admin, mis. https://ag.suksesbogil.com/ (domain *.suksesbogil.com)" class="glass-inner border border-white/10 rounded-xl p-2.5 text-xs font-mono text-white placeholder-slate-600 focus:outline-none">
          <input id="aiSid${i}" type="password" autocomplete="off" placeholder="${w.hasSession ? 'Kosongkan = pakai yang tersimpan. Tempel baru untuk mengganti.' : 'Tempel PHPSESSID=xxxx atau seluruh isi Cookie dari Chrome'}" class="glass-inner border border-white/10 rounded-xl p-2.5 text-xs font-mono text-white placeholder-slate-600 focus:outline-none">
          <div class="flex flex-wrap gap-2">
            <button onclick="autoInputSaveSession(${i})" class="bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-extrabold px-4 py-2 rounded-xl text-xs"><i class="fa-solid fa-floppy-disk mr-1"></i>Simpan</button>
            <button onclick="autoInputTest(${i})" class="glass-inner px-4 py-2 rounded-xl text-xs font-bold" ${w.hasSession ? '' : 'disabled style="opacity:.4"'}><i class="fa-solid fa-vial mr-1"></i>Uji (tanpa kirim)</button>
            <button onclick="autoInputDeleteSession(${i})" class="glass-inner px-4 py-2 rounded-xl text-xs font-bold text-rose-400" ${w.hasSession ? '' : 'disabled style="opacity:.4"'}><i class="fa-solid fa-trash mr-1"></i>Hapus</button>
          </div>
        </div>`).join('') || '<div class="text-xs text-slate-400">Akun ini belum punya website.</div>';
      aiJobsState = { jobs: st.jobs || [], days: Number(st.historyDays) || 7, retryMax: Number(st.retryMax) || 0, retryGap: Number(st.retryGapMin) || 2, stColor, stLabel };
      const jobs = autoInputJobsRows();
      host.innerHTML = `
        <div class="glass-card rounded-3xl p-5 sm:p-6 flex flex-col gap-5">
          <div class="page-head tone-amber">
            <div class="page-head-icon"><i class="fa-solid fa-robot"></i></div>
            <div class="page-head-text">
              <div class="page-eyebrow">Utama</div>
              <h2 class="page-title">Auto Prediksi</h2>
              <p class="page-sub">Sesudah <b>KIRIM SEMUA SISTEM</b>, angka result otomatis diinput ke menu <b>Nomor Keluar</b> admin website lalu di-<b>Hitung</b> — sesuai pasaran &amp; jumlah prize-nya.</p>
            </div>
          </div>
          <div class="glass-inner rounded-2xl p-4 flex items-center justify-between gap-3 border ${st.enabled ? 'border-emerald-500/30' : 'border-white/5'}">
            <div>
              <div class="text-sm font-extrabold ${st.enabled ? 'text-emerald-400' : 'text-slate-300'}">${st.enabled ? 'AKTIF' : 'NONAKTIF'}</div>
              <div class="text-[11px] text-slate-400">${st.enabled ? 'Setiap KIRIM SEMUA SISTEM langsung menghitung di website yang sesinya tersimpan.' : 'Tidak ada yang diinput otomatis. Input manual seperti biasa.'}</div>
            </div>
            <button onclick="autoInputToggle(${st.enabled ? 'false' : 'true'})" class="${st.enabled ? 'glass-inner text-rose-300' : 'bg-gradient-to-r from-emerald-400 to-cyan-500 text-slate-950'} font-extrabold px-5 py-2.5 rounded-xl text-xs">${st.enabled ? 'MATIKAN' : 'AKTIFKAN'}</button>
          </div>
          <div class="text-[11px] text-slate-400 leading-relaxed">
            Hanya website yang akunmu boleh akses yang muncul di bawah. Ambil <b>PHPSESSID</b> dari Chrome yang sedang login admin (F12 → Application → Cookies), tempel, <b>Simpan</b>, lalu klik <b>Uji</b> sebelum mengaktifkan. Sesi bisa habis kapan saja — kalau habis, hasilnya <b>gagal sebelum menyentuh admin</b> dan kamu input manual. Nilai PHPSESSID tidak pernah ditampilkan ulang.
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">${rows}</div>
          <div id="aiTotoBox" class="glass-inner rounded-2xl border border-white/5 p-3 text-xs text-slate-400">Memuat Auto Check Toto Macau…</div>
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="text-[11px] font-extrabold text-slate-300 tracking-wider">RIWAYAT ${Number(st.historyDays) || 7} HARI TERAKHIR <span id="aiJobsCount" class="text-slate-500 font-semibold"></span></div>
            <input id="aiJobsSearch" type="search" autocomplete="off" value="${esc(aiJobsQuery)}" oninput="autoInputSearch(this.value)" placeholder="Cari website, pasaran, angka, status (GAGAL/SELESAI), keterangan…" class="glass-inner border border-white/10 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none w-full sm:w-80">
          </div>
          <div class="overflow-auto glass-inner rounded-2xl border border-white/5" style="max-height:70vh">
            <table class="w-full text-left stack-sm"><thead><tr class="text-[10px] text-slate-400 uppercase tracking-wider"><th class="p-2">Waktu</th><th class="p-2">Website</th><th class="p-2">Result</th><th class="p-2">Status</th><th class="p-2">Keterangan</th></tr></thead><tbody id="aiJobsBody">${jobs}</tbody></table>
          </div>
        </div>`;
      autoInputSearch(aiJobsQuery); // isi hitungan 'x dari y job'
      autoInputTotoLoad();
    }

    let aiJobsState = { jobs: [], days: 7, retryMax: 0, retryGap: 2, stColor: {}, stLabel: {} };
    let aiJobsQuery = '';
    function autoInputJobsRows() {
      const esc = escapeHtml;
      const S = aiJobsState;
      const q = aiJobsQuery.trim().toLowerCase();
      const words = q ? q.split(/\s+/) : [];
      const hay = j => [j.website, j.market, (j.prizes || []).join(' '), (j.prizes || []).join('/'), S.stLabel[j.status] || j.status, j.status, j.detail, j.createdAt, j.period].join(' ').toLowerCase();
      const list = words.length ? S.jobs.filter(j => { const h = hay(j); return words.every(w => h.indexOf(w) >= 0); }) : S.jobs;
      const cnt = document.getElementById('aiJobsCount');
      if (cnt) cnt.textContent = words.length ? '(' + list.length + ' dari ' + S.jobs.length + ' job)' : '(' + S.jobs.length + ' job)';
      return list.map(j => {
        const early = j.stage === '' || j.stage === 'cek';
        const att = Number(j.attempts) || 0;
        const willRetry = j.status === 'FAILED' && S.retryMax > 0 && att < S.retryMax;
        const manual = j.status === 'FAILED' && !early && !willRetry;
        const again = (j.status === 'FAILED' || j.status === 'SKIPPED') && early && !willRetry
          ? `<button onclick="autoInputClearJob(${Number(j.id)})" class="retry-mini" title="Hapus catatan supaya result ini bisa dicoba lagi">COBA LAGI</button>` : '';
        const retryNote = willRetry ? `<div class="text-amber-300">Dicoba ulang otomatis ±${S.retryGap} menit (${att}/${S.retryMax} sudah dicoba)</div>` : (att > 0 && j.status === 'FAILED' ? `<div class="text-slate-400">Percobaan ulang otomatis habis (${att}/${S.retryMax})</div>` : (att > 0 && j.status === 'DONE' ? `<div class="text-emerald-300">Berhasil pada percobaan ulang ke-${att}</div>` : ''));
        return `<tr class="border-t border-white/5 align-top">
          <td class="p-2 text-[10px] text-slate-400 whitespace-nowrap" data-label="Waktu">${esc(j.createdAt)}</td>
          <td class="p-2 text-xs font-bold text-cyan-300" data-label="Website">${esc(j.website)}</td>
          <td class="p-2 text-xs" data-label="Result">${esc(j.market)}<div class="font-mono text-amber-300">${esc((j.prizes || []).join(' / '))}</div></td>
          <td class="p-2 text-[10px] font-extrabold ${S.stColor[j.status] || ''}" data-label="Status">${S.stLabel[j.status] || esc(j.status)}${manual ? '<div class="text-rose-300">CEK MANUAL</div>' : ''}</td>
          <td class="p-2 text-[11px] text-slate-300 stack-full" data-label="Keterangan">${esc(j.detail)} ${again}${retryNote}</td></tr>`;
      }).join('') || '<tr><td colspan="5" class="p-4 text-center text-xs text-slate-500">' + (words.length ? 'Tidak ada job yang cocok dengan pencarian.' : 'Belum ada job dalam ' + S.days + ' hari terakhir.') + '</td></tr>';
    }
    function autoInputSearch(v) {
      aiJobsQuery = String(v || '');
      const tb = document.getElementById('aiJobsBody');
      if (tb) tb.innerHTML = autoInputJobsRows();
    }

    // Peringatan terakhir Auto Prediksi: job tetap GAGAL setelah semua percobaan ulang otomatis -> popup tengah layar di menu mana pun.
    // Auto Check Toto Macau / Toto Macao 5D: baca angka di admin lalu (mode 2) posting ke Panel-Z. Tampilan = catatan per draw.
    let aiTotoAt = 0;
    function autoInputTotoLoad(force) {
      if (!force && Date.now() - aiTotoAt < 30000) { autoInputTotoPaint(); return; }
      aiTotoAt = Date.now();
      google.script.run
        .withSuccessHandler(r => { aiTotoData = (r && r.success) ? r : null; autoInputTotoPaint(); })
        .withFailureHandler(() => { aiTotoData = null; autoInputTotoPaint(); })
        .autoInputTotoLog(currentSessionToken);
    }
    let aiTotoData = null;
    function autoInputTotoRunNow(btn) {
      if (btn) { btn.disabled = true; btn.style.opacity = '.6'; }
      toast('Memeriksa admin & Panel-Z…');
      google.script.run
        .withSuccessHandler(r => {
          if (btn) { btn.disabled = false; btn.style.opacity = ''; }
          if (apiFailed(r)) { toast(apiMessage(r)); return; }
          showActionPopup('DONE', 'Cek & Isi Selesai', (r && r.message) || 'Selesai.', 'fa-check');
          autoInputTotoLoad(true);
        })
        .withFailureHandler(err => { if (btn) { btn.disabled = false; btn.style.opacity = ''; } toast((err && err.message) || 'Gagal memeriksa'); })
        .autoInputTotoRun(currentSessionToken);
    }
    function autoInputTotoPaint() {
      const box = document.getElementById('aiTotoBox');
      if (!box) return;
      const esc = escapeHtml;
      const d = aiTotoData;
      if (!d) { box.textContent = 'Auto Check Toto Macau belum bisa dimuat.'; return; }
      const modeTxt = d.mode === 2 ? '<span class="text-emerald-400 font-extrabold">MODE 2 · CEK + ISI PANEL-Z YANG KOSONG</span>' : d.mode === 1 ? '<span class="text-amber-300 font-extrabold">MODE 1 · HANYA BACA &amp; CATAT (belum posting)</span>' : '<span class="text-slate-500 font-extrabold">MATI</span>';
      const stCls = { SENT: 'text-emerald-400', VERIFIED: 'text-emerald-300', RECORDED: 'text-sky-300', PENDING: 'text-amber-300', CONFLICT: 'text-rose-400', MISSING: 'text-slate-400', FAILED: 'text-rose-400', SKIPPED: 'text-slate-400', SENDING: 'text-amber-300' };
      const stTxt = { SENT: 'TERKIRIM', VERIFIED: 'SUDAH ADA', RECORDED: 'TERCATAT', PENDING: 'BELUM TERISI', CONFLICT: 'BEDA ANGKA', MISSING: 'BARIS TIDAK ADA', FAILED: 'GAGAL', SKIPPED: 'DILEWATI', SENDING: 'MENGIRIM' };
      const rows = (d.rows || []).slice(0, 80).map(r => `<tr class="border-t border-white/5 align-top">
          <td class="p-2 text-[10px] text-slate-400 whitespace-nowrap" data-label="Tanggal & jam draw">${esc(r.rowAt)}</td>
          <td class="p-2 text-xs font-bold text-cyan-300" data-label="Website">${esc(r.website)}</td>
          <td class="p-2 text-xs" data-label="Pasaran tujuan">${esc(r.market || '-')}<div class="text-[10px] text-slate-500">periode ${esc(r.period)}</div></td>
          <td class="p-2 text-xs font-mono font-extrabold text-amber-300" data-label="Angka">${esc(r.number)}</td>
          <td class="p-2 text-[10px] font-extrabold ${stCls[r.status] || ''}" data-label="Status">${stTxt[r.status] || esc(r.status)}</td>
          <td class="p-2 text-[11px] text-slate-300 stack-full" data-label="Keterangan">${esc(r.detail)}${r.attempts ? ' (' + Number(r.attempts) + '/' + Number(d.maxAttempts) + ' percobaan)' : ''}</td></tr>`).join('') || '<tr><td colspan="6" class="p-3 text-center text-slate-500">Belum ada draw tercatat (3 hari terakhir).</td></tr>';

    function showSendResult(result) {
      lastSendResult = result;

      const labels = { telegram: 'Telegram', linktree: 'LinkTree', panelz: 'Panel-Z' };
      const icons = { telegram: 'fa-brands fa-telegram', linktree: 'fa-solid fa-link', panelz: 'fa-solid fa-bolt' };
      const sysKeys = Object.keys(labels);
      const esc = escapeHtml;

      const websiteResults = Array.isArray(result.websiteResults) ? result.websiteResults : [];

      let success = 0, failed = 0, blocked = 0, already = 0;
      const okSites = [], dupSites = [], problemSites = [];

      websiteResults.forEach(site => {
        const vals = sysKeys.map(k => String((site[k] || {}).status || '').toUpperCase());
        vals.forEach(s => {
          if (s === 'BERHASIL') success++;
          else if (s === 'GAGAL') failed++;
          else if (s === 'DIBLOKIR') blocked++;
          else if (s === 'SUDAH DIKIRIM') already++;
        });
        const hasBad = vals.includes('GAGAL') || vals.includes('DIBLOKIR');
        if (hasBad) problemSites.push(site);
        else if (vals.includes('BERHASIL')) okSites.push(site);
        else dupSites.push(site);
      });

      // Kasus umum (semua lancar / semua duplikat) -> cukup toast, tanpa modal.
      if (!problemSites.length) {
        const nOk = okSites.length, nDup = dupSites.length;
        if (nOk && nDup) toast(`Berhasil ${nOk} website, ${nDup} sudah dikirim (dilewati)`);
        else if (nOk) toast(`Berhasil dikirim ke ${nOk} website`);
        else if (nDup) toast(`${nDup} website sudah pernah dikirim — tidak dikirim ulang`);
        else toast('Tidak ada website yang diproses');
        return;
      }

      // Ada yang gagal/diblokir -> modal ringkas, fokus ke yang bermasalah.
      const problemCards = problemSites.map(site => {
        const okChips = sysKeys
          .filter(k => String((site[k] || {}).status || '').toUpperCase() === 'BERHASIL')
          .map(k => `<span class="mini-chip status-ok">✓ ${labels[k]}</span>`).join('');

        const badRows = sysKeys.map(k => {
          const it = site[k] || {};
          const s = String(it.status || '').toUpperCase();
          if (s !== 'GAGAL' && s !== 'DIBLOKIR') return '';
          const canRetry = s === 'GAGAL' && !/tidak diizinkan/i.test(String(it.reason || ''));
          const retry = canRetry
            ? `<button onclick="retryOneSystem(${jsArg(k)},${jsArg(site.website)})" class="retry-mini"><i class="fa-solid fa-rotate-right mr-1"></i>COBA ULANG</button>`
            : '';
          return `<div class="system-compact">
              <div class="system-compact-top">
                <span class="system-compact-name"><i class="${icons[k]} mr-1.5 text-slate-400"></i>${labels[k]}</span>
                <span class="system-compact-status status-bad">${esc(s)}</span>
              </div>
              <div class="system-compact-reason">${esc(it.reason || '-')}</div>
              ${retry}
            </div>`;
        }).join('');

        return `<div class="website-result-card">
            <div class="website-result-head">
              <b class="text-sm text-cyan-300">${esc(site.website || '-')}</b>
              <span class="text-[9px] text-rose-300">PERLU DICEK</span>
            </div>
            ${okChips ? `<div class="mini-chip-row">${okChips}</div>` : ''}
            <div class="grid gap-2">${badRows}</div>
          </div>`;
      }).join('');

      const flatLine = (site, kind) => {
        const cls = kind === 'ok' ? 'status-ok' : 'status-skip';
        const txt = kind === 'ok' ? '✓ Terkirim' : '⊘ Sudah dikirim';
        return `<div class="result-flat-line"><span class="text-slate-300">${esc(site.website || '-')}</span><span class="${cls}">${txt}</span></div>`;
      };
      const restBlock = (okSites.length || dupSites.length)
        ? `<div class="result-flat-wrap">${okSites.map(s => flatLine(s, 'ok')).join('')}${dupSites.map(s => flatLine(s, 'dup')).join('')}</div>`
        : '';

      document.getElementById('systemResultList').innerHTML = problemCards + restBlock;

      const summaryParts = [];
      if (success) summaryParts.push(`<span class="summary-pill status-ok">${success} berhasil</span>`);
      if (failed) summaryParts.push(`<span class="summary-pill status-bad">${failed} gagal</span>`);
      if (blocked) summaryParts.push(`<span class="summary-pill status-bad">${blocked} tidak diizinkan</span>`);
      if (already) summaryParts.push(`<span class="summary-pill status-skip">${already} sudah dikirim</span>`);
      document.getElementById('resultSummary').innerHTML = summaryParts.join('');

      const titleEl = document.querySelector('#sendResultModal h3');
      if (titleEl) titleEl.textContent = `${problemSites.length} website perlu dicek`;

      document.getElementById('sendResultModal').classList.add('open');
    }

    // Popup loading yang lebih rapi, responsif, dan mendukung status error.
    // originPoint {x,y} (opsional, koordinat viewport) — kalau diisi DAN mode
    // 'LOADING', kartu popup "terbuka" dari titik itu (dipakai Auto Send: titik
    // pesawat mendarat) alih-alih animasi bawaan (popupIn) yang selalu dari tengah.
    let popupStepTimer;
    function showActionPopup(mode, title, desc, iconClass, originPoint) {
      const popup = document.getElementById('actionPopup');
      const card = popup.querySelector('.popup-card');
      const spinner = document.getElementById('popupSpinner');
      const checkIcon = document.getElementById('popupCheckIcon');
      const mainIcon = document.getElementById('popupMainIcon');
      const popupTitle = document.getElementById('popupTitle');
      const popupDesc = document.getElementById('popupDesc');
      const eyebrow = document.getElementById('popupEyebrow');
      const closeBtn = document.getElementById('popupCloseBtn');
      const iconBox = document.getElementById('popupIconBox');
      const glow = document.getElementById('popupGlow');
      const progressWrap = document.getElementById('popupProgressWrap');
      const progressBar = document.getElementById('popupProgressBar');
      const steps = [...document.querySelectorAll('#popupSteps .popup-step')];

      clearTimeout(popupStepTimer);

      // Bersihkan dulu sisa animasi "buka dari titik X" dari panggilan SEBELUMNYA
      // (kartu popup ini dipakai bersama oleh SEMUA aksi di panel, bukan cuma Auto
      // Send) -> supaya panggilan lain yang tidak mengirim originPoint tetap dapat
      // animasi bawaan (popupIn) seperti biasa, bukan ikut ketiban override lama.
      if (card) {
        try { card.getAnimations().forEach(a => a.cancel()); } catch (e) {}
        card.style.animation = '';
        card.style.clipPath = '';
        card.style.webkitClipPath = '';
      }

      popup.classList.add('is-open');
      popup.style.display = 'flex';
      document.body.classList.add('modal-open');
      popupTitle.textContent = title;
      popupDesc.textContent = desc;

      if (mode === 'LOADING' && originPoint && card && typeof card.animate === 'function') {
        // Kartu sudah ke-layout (display:flex barusan) -> getBoundingClientRect aman dibaca.
        const cardRect = card.getBoundingClientRect();
        const originX = originPoint.x - cardRect.left;
        const originY = originPoint.y - cardRect.top;

        // Efek "buka dari titik X" dipakai lewat clip-path (lingkaran membesar),
        // BUKAN transform:scale() seperti sebelumnya. Alasannya: kartu ini punya
        // #popupGlow di dalamnya dengan filter:blur(72px) — karena elemen itu ANAK
        // dari kartu, dia ikut ter-skala tiap kali kartu di-scale(), dan blur
        // sebesar itu dihitung ulang tiap frame -> itulah sumber "kedip-kedip"
        // sebenarnya (bukan cuma backdrop-filter seperti dugaan sebelumnya).
        // clip-path TIDAK mengubah ukuran kotak elemen sama sekali — cuma area
        // yang TERLIHAT yang membesar — jadi tidak ada blur yang perlu dihitung
        // ulang sama sekali, kedipannya hilang total di akarnya.
        const corners = [
          [0, 0], [cardRect.width, 0], [0, cardRect.height], [cardRect.width, cardRect.height]
        ];
        const maxRadius = Math.ceil(Math.max.apply(null, corners.map(function (c) {
          return Math.hypot(c[0] - originX, c[1] - originY);
        })));

        card.style.animation = 'none'; // matikan animasi CSS popupIn bawaan untuk kartu ini
        const openAnim = card.animate([
          { clipPath: 'circle(0px at ' + originX + 'px ' + originY + 'px)', opacity: .55 },
          { clipPath: 'circle(' + maxRadius + 'px at ' + originX + 'px ' + originY + 'px)', opacity: 1 }
        ], { duration: 420, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'forwards' });
        openAnim.finished.then(() => {
          try { openAnim.cancel(); } catch (e) {}
          card.style.animation = '';
          card.style.clipPath = '';
          card.style.webkitClipPath = '';
        }, () => {});
      }

      if (mode === 'LOADING') {
        eyebrow.textContent = 'SYSTEM PROCESS';
        eyebrow.className = 'text-[9px] font-extrabold tracking-[.25em] text-cyan-400 uppercase';
        spinner.style.display = 'block';
        checkIcon.style.display = 'none';
        mainIcon.style.display = 'block';
        mainIcon.className = `fas ${iconClass || 'fa-paper-plane'} text-xl text-cyan-200`;
        closeBtn.style.display = 'none';
        progressWrap.style.display = 'flex';
        progressBar.className = 'progress-bar is-loading';
        iconBox.className = 'w-20 h-20 rounded-[1.6rem] bg-cyan-500/10 border border-cyan-400/30 flex items-center justify-center shadow-[0_0_35px_rgba(34,211,238,.16)] relative';
        glow.className = 'absolute -top-20 left-1/2 -translate-x-1/2 w-56 h-56 bg-cyan-500/20 blur-[72px] rounded-full pointer-events-none';
        steps.forEach((el, i) => {
          el.className = 'popup-step' + (i === 0 ? ' active' : '');
          el.lastElementChild.outerHTML = i === 0 ? '<i class="fa-solid fa-spinner fa-spin"></i>' : '<span>Menunggu</span>';
        });
        popupStepTimer = setTimeout(() => {
          if (!popup.classList.contains('is-open')) return;
          steps[0].className = 'popup-step done'; steps[0].lastElementChild.outerHTML = '<i class="fa-solid fa-check"></i>';
          steps[1].className = 'popup-step active'; steps[1].lastElementChild.outerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
        }, 700);
      } else {
        const isError = mode === 'ERROR';
        eyebrow.textContent = isError ? 'PROCESS FAILED' : 'PROCESS COMPLETED';
        eyebrow.className = `text-[9px] font-extrabold tracking-[.25em] uppercase ${isError ? 'text-rose-400' : 'text-emerald-400'}`;
        spinner.style.display = 'none';
        mainIcon.style.display = 'none';
        checkIcon.style.display = 'block';
        checkIcon.className = `fas ${isError ? 'fa-xmark text-rose-300' : 'fa-check text-emerald-300'} text-2xl`;
        closeBtn.style.display = 'block';
        closeBtn.innerHTML = isError ? '<i class="fa-solid fa-rotate-right mr-2"></i>TUTUP & COBA LAGI' : '<i class="fa-solid fa-check mr-2"></i>OK, TUTUP';
        closeBtn.className = `action-btn w-full ${isError ? 'bg-gradient-to-r from-rose-500 to-pink-600 text-white shadow-rose-500/15' : 'bg-gradient-to-r from-emerald-400 to-teal-500 text-slate-950 shadow-emerald-500/15'} hover:brightness-110 font-extrabold text-xs py-3.5 rounded-2xl shadow-lg cursor-pointer`;
        progressWrap.style.display = 'flex';
        progressBar.className = `progress-bar ${isError ? 'is-error' : 'is-done'}`;
        iconBox.className = `w-20 h-20 rounded-[1.6rem] ${isError ? 'bg-rose-500/12 border-rose-400/35 shadow-[0_0_35px_rgba(251,113,133,.18)]' : 'bg-emerald-500/12 border-emerald-400/35 shadow-[0_0_35px_rgba(52,211,153,.18)]'} border flex items-center justify-center relative`;
        glow.className = `absolute -top-20 left-1/2 -translate-x-1/2 w-56 h-56 ${isError ? 'bg-rose-500/18' : 'bg-emerald-500/18'} blur-[72px] rounded-full pointer-events-none`;
        steps.forEach(el => {
          el.className = `popup-step ${isError ? 'error' : 'done'}`;
          el.lastElementChild.outerHTML = `<i class="fa-solid ${isError ? 'fa-xmark' : 'fa-check'}"></i>`;
        });
      }
    }

    function closeActionPopup() {
