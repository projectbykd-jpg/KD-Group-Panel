    /* ===== A11y modal: tutup dengan Escape + klik area gelap di luar kartu =====
       Sebelumnya hanya centerNotice & actionPopup yang bisa ditutup pakai Escape;
       modal lain menjebak pengguna keyboard. */
    function closeTopModal() {
      const openShell = [...document.querySelectorAll('.modal-shell.open')].pop();
      if (openShell) {
        openShell.classList.remove('open');
        if (!document.querySelector('.modal-shell.open')) document.body.classList.remove('modal-open');
        return true;
      }
      const edit = document.getElementById('userEditModal');
      if (edit && edit.style.display !== 'none' && edit.classList.contains('modal-shell')) { closeUserModal(); return true; }
      return false;
    }
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      // actionPopup & centerNotice punya penanganan sendiri; jangan ganggu saat aktif.
      if (document.getElementById('actionPopup').style.display !== 'none') return;
      if (document.getElementById('centerNoticeModal').classList.contains('open')) return;
      closeTopModal();
    });
    ['sendResultModal','predictionSendModal','userEditModal'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('mousedown', e => { if (e.target === el) closeTopModal(); });
    });

    /* ===== Maintenance (Admin -> Maintenance & Log) =====
       Switch & pesan dimuat dari server SETIAP panel dibuka. Dulu cuma terisi
       dari tab "Dashboard" admin, jadi admin yang langsung membuka Maintenance
       sesudah reload melihat switch OFF walau maintenance sedang AKTIF -- dan
       menekan SIMPAN mematikannya tanpa sengaja. */
    let maintenanceLoaded = false;
    function paintMaintenanceSwitch() {
      const switchEl = document.getElementById('maintenanceSwitch');
      if (!switchEl) return;
      switchEl.classList.toggle('on', maintenanceState);
      switchEl.setAttribute('aria-checked', maintenanceState ? 'true' : 'false');
    }
    function applyMaintenanceForm(maintenance) {
      const m = maintenance || { enabled:false, message:'' };
      maintenanceState = !!m.enabled;
      maintenanceLoaded = true;
      paintMaintenanceSwitch();
      const messageEl = document.getElementById('maintenanceMessage');
      if (messageEl && document.activeElement !== messageEl) messageEl.value = m.message || '';
      const meta = document.getElementById('maintenanceMeta');
      if (meta) {
        meta.textContent = maintenanceState ? 'Status: AKTIF — operator sedang terkunci.' : 'Status: NONAKTIF — panel berjalan normal.';
        meta.className = 'text-[10px] font-bold ' + (maintenanceState ? 'text-amber-300' : 'text-emerald-400');
      }
    }
    function loadMaintenanceState() {
      const meta = document.getElementById('maintenanceMeta');
      // Kunci switch & tombol SIMPAN sampai status TERBARU dari server tiba --
      // jangan sampai admin menyimpan status lama tanpa sadar.
      maintenanceLoaded = false;
      if (meta) { meta.className = 'text-[10px] text-slate-500'; meta.textContent = 'Memuat status maintenance…'; }
      const fail = msg => { if (meta) { meta.className = 'text-[10px] text-rose-300'; meta.textContent = msg + ' Buka ulang tab ini untuk mencoba lagi.'; } };
      google.script.run
        .withSuccessHandler(p => {
          if (apiFailed(p) || !p.maintenance) { fail(apiMessage(p, 'Gagal memuat status maintenance.')); return; }
          applyMaintenanceForm(p.maintenance);
        })
        .withFailureHandler(e => fail((e && e.message) || 'Gagal memuat status maintenance.'))
        .getCurrentUserProfile(currentSessionToken);
    }
    function toggleMaintenance(){
      if (!maintenanceLoaded) { toast('Tunggu status maintenance selesai dimuat'); return; }
      maintenanceState = !maintenanceState;
      paintMaintenanceSwitch();
    }
    function saveMaintenance(){
      if (!maintenanceLoaded) { toast('Tunggu status maintenance selesai dimuat'); return; }
      const btn = document.getElementById('maintenanceSaveBtn');
      if (btn) { btn.disabled = true; btn.textContent = 'MENYIMPAN...'; }
      const done = () => { if (btn) { btn.disabled = false; btn.textContent = 'SIMPAN PENGATURAN'; } };
      google.script.run
        .withSuccessHandler(x => {
          done();
          if (apiFailed(x)) { toast(apiMessage(x, 'Gagal menyimpan maintenance')); return; }
          applyMaintenanceForm({ enabled: !!x.enabled, message: x.message });
          toast('Pengaturan maintenance disimpan');
        })
        .withFailureHandler(e => { done(); toast((e && e.message) || 'Gagal menyimpan maintenance'); })
        .setMaintenance(currentSessionToken, maintenanceState, document.getElementById('maintenanceMessage').value);
    }

    /* =========================================================
       MENU INVEST — AutoCheck batas line invest per user.
       Setting (BASE_URL, PHPSESSID, dst) disimpan di server (Script Properties),
       scan berat jalan di latar belakang + polling status.
       ========================================================= */
    let investStatusTimer = null;
    // Hanya field yang tampil di form. Sisanya (timezone, periode lookback, page
    // size, dst) tetap di default server dan tidak diutak-atik dari panel.
    const INVEST_NUM_FIELDS = ['LIMIT_2D','LIMIT_3D','LIMIT_4D'];

    function investVal(id){ const el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; }
    function investSetVal(id, v){ const el = document.getElementById(id); if (el) el.value = (v == null ? '' : v); }

    function loadInvestConfig() {
      const box = document.getElementById('investConfigStatus');
      if (box) box.textContent = 'Memuat setting tersimpan...';
      google.script.run
        .withSuccessHandler(res => {
          if (!res || !res.success) { if (box) box.textContent = (res && res.message) || 'Gagal memuat setting.'; return; }
          pageFetchedAt.invest = Date.now();
          const c = res.config || {};
          investSetVal('investBaseUrl', c.BASE_URL);
          investSetVal('investPhpsessid', c.PHPSESSID);
          investSetVal('investKoderedis', c.KODEREDIS);
          investSetVal('investCookieExtra', c.COOKIE_EXTRA);
          INVEST_NUM_FIELDS.forEach(k => investSetVal('invest_' + k, c[k]));
          investSetVal('investPasaranRaw', '');
          const pc = document.getElementById('investPasaranCount');
          if (pc) pc.textContent = String(c.PASARAN_COUNT || 0);
          if (box) box.textContent = 'Setting terakhir tersimpan di server — tidak perlu diisi ulang selama PHPSESSID belum berubah.';
          // Belum ada sesi tersimpan -> buka form; kalau sudah ada -> sembunyikan.
          const dbox = document.getElementById('investSettingBox');
          if (dbox) dbox.open = !(c.PHPSESSID || c.COOKIE_EXTRA);
          renderInvestState(res.state, res.warningCount);
          // Buka menu saat scan MASIH jalan (mis. dipicu user lain) -> ikut pantau.
          const ss = res.state && res.state.state;
          if (ss === 'running' || ss === 'paused') startInvestPolling();
        })
        .withFailureHandler(e => { if (box) box.textContent = 'Gagal: ' + ((e && e.message) || e); })
        .investGetConfig(currentSessionToken);
      loadInvestWarnings();
    }

    function saveInvestConfig() {
      const btn = document.getElementById('investSaveBtn');
      const payload = {
        BASE_URL: investVal('investBaseUrl'),
        PHPSESSID: investVal('investPhpsessid'),
        KODEREDIS: investVal('investKoderedis'),
        COOKIE_EXTRA: investVal('investCookieExtra')
      };
      if (investVal('investPasaranRaw')) payload.PASARAN_RAW = investVal('investPasaranRaw');
      INVEST_NUM_FIELDS.forEach(k => payload[k] = investVal('invest_' + k));
      if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>MENYIMPAN...'; }
      google.script.run
        .withSuccessHandler(res => {
          if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-2"></i>SIMPAN SETTING'; }
          if (res && res.success) {
            toast('Setting INVEST tersimpan');
            const c = res.config || {};
            investSetVal('investPhpsessid', c.PHPSESSID);
            investSetVal('investKoderedis', c.KODEREDIS);
            investSetVal('investCookieExtra', c.COOKIE_EXTRA);
            INVEST_NUM_FIELDS.forEach(k => investSetVal('invest_' + k, c[k]));
            investSetVal('investPasaranRaw', '');
            const pc = document.getElementById('investPasaranCount');
            if (pc) pc.textContent = String(c.PASARAN_COUNT || 0);
            if (c.PASARAN_COUNT) toast(c.PASARAN_COUNT + ' pasaran panel tersimpan');
            const dbox = document.getElementById('investSettingBox');
            if (dbox) dbox.open = false;
          } else {
            toast((res && res.message) || 'Gagal menyimpan setting');
          }
        })
        .withFailureHandler(e => {
          if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-2"></i>SIMPAN SETTING'; }
          toast('Gagal: ' + ((e && e.message) || e));
        })
        .investSaveConfig(currentSessionToken, payload);
    }

    function testInvestSession() {
      const box = document.getElementById('investConnStatus');
      if (box) { box.textContent = 'Mengecek session ke panel agen...'; box.className = 'text-[11px] text-cyan-300 mt-2'; }
      google.script.run
        .withSuccessHandler(res => {
          if (box) {
            box.textContent = (res && res.message) || 'Selesai.';
            box.className = 'text-[11px] mt-2 ' + (res && res.success ? 'text-emerald-300' : 'text-rose-300');
          }
          if (res && res.success) toast('Session INVEST valid');
        })
        .withFailureHandler(e => { if (box) { box.textContent = 'Gagal: ' + ((e && e.message) || e); box.className = 'text-[11px] text-rose-300 mt-2'; } })
        .investTestSession(currentSessionToken);
    }

    function investRequireOwnConfig() {
      // Config INVEST per-user: tiap staff HARUS isi sesinya sendiri dulu.
      if (investVal('investPhpsessid') || investVal('investCookieExtra')) return true;
      toast('Isi PHPSESSID kamu dulu di SETTING, lalu SIMPAN.');
      const dbox = document.getElementById('investSettingBox');
      if (dbox) { dbox.open = true; }
      const el = document.getElementById('investPhpsessid');
      if (el) { try { el.scrollIntoView({ block: 'center' }); el.focus(); } catch (e) {} }
      return false;
    }

    function startInvestScan() {
      if (!investRequireOwnConfig()) return;
      confirmCenter({
        type: 'warning',
        title: 'Mulai Scan INVEST?',
        message: 'Scan menimpa hasil sebelumnya dan berjalan di latar belakang (beberapa menit, lanjut otomatis). Pastikan PHPSESSID kamu sudah disimpan dan masih valid.',
        confirmText: 'YA, MULAI SCAN'
      }).then(ok => {
        if (!ok) return;
        google.script.run
          .withSuccessHandler(res => {
            if (!res || res.success === false) {
              toast((res && res.message) || 'Scan tidak bisa dimulai.');
              if (res && /phpsessid/i.test(res.message || '')) {
                const dbox = document.getElementById('investSettingBox');
                if (dbox) dbox.open = true;
              }
              renderInvestState((res && res.state) || {});
              return;
            }
            toast(res.message || 'Scan dimulai');
            investBeginScanUI(res.state || { state: 'running', cursor: 0, total: 63 });
            startInvestPolling();
          })
          .withFailureHandler(e => toast('Gagal memulai scan: ' + ((e && e.message) || e)))
          .investStartScan(currentSessionToken);
      });
    }

    function continueInvestScan() {
      if (!investRequireOwnConfig()) return;
      google.script.run
        .withSuccessHandler(res => {
          if (!res || res.success === false) { toast((res && res.message) || 'Tidak bisa dilanjutkan.'); return; }
          toast(res.message || 'Scan dilanjutkan');
          if (res.state) renderInvestState(res.state, 0);
          startInvestPolling();
        })
        .withFailureHandler(e => toast('Gagal: ' + ((e && e.message) || e)))
        .investContinueScan(currentSessionToken);
    }

    function resetInvestScan() {
      confirmCenter({
        type: 'danger',
        title: 'Reset Scan INVEST?',
        message: 'Menghentikan scan yang tertunda dan menghapus penanda progres. Tabel hasil WARNING TIDAK dihapus (baru ditimpa saat scan berikutnya).',
        confirmText: 'YA, RESET'
      }).then(ok => {
        if (!ok) return;
        google.script.run
          .withSuccessHandler(res => { toast((res && res.message) || 'Direset'); stopInvestPolling(); loadInvestConfig(); })
          .withFailureHandler(e => toast('Gagal: ' + ((e && e.message) || e)))
          .investResetScan(currentSessionToken);
      });
    }

    function renderInvestState(state, warnCount) {
      const badge = document.getElementById('investStateBadge');
      const meta = document.getElementById('investStateMeta');
      const contBtn = document.getElementById('investContinueBtn');
      if (!badge) return;
      const s = (state && state.state) || 'idle';
      const map = {
        idle:            ['SIAP',                     'bg-slate-500/15 text-slate-300'],
        running:         ['SCAN BERJALAN',            'bg-cyan-500/15 text-cyan-300'],
        paused:          ['JEDA · LANJUT OTOMATIS',   'bg-amber-500/15 text-amber-300'],
        session_expired: ['SESSION EXPIRED',          'bg-rose-500/15 text-rose-300'],
        done:            ['SELESAI',                  'bg-emerald-500/15 text-emerald-300'],
        error:           ['ERROR',                    'bg-rose-500/15 text-rose-300']
      };
      const m = map[s] || map.idle;
      const spin = (s === 'running' || s === 'paused') ? '<i class="fa-solid fa-circle-notch fa-spin" style="margin-right:6px"></i>' : '';
      badge.innerHTML = spin + m[0];
      badge.className = 'px-3 py-1 rounded-full text-[10px] font-extrabold whitespace-nowrap ' + m[1];

      const total = Number(state && state.total) || 0;
      const cur   = Number(state && state.cursor) || 0;

      const parts = [];
      const msg = (state && state.message) || '';
      // Kalau pesan sudah memuat "pasaran X/Y", jangan tampilkan hitungan terpisah.
      const msgHasCount = /pasaran\s+\d+\s*\/\s*\d+/i.test(msg);
      if (total && !msgHasCount) parts.push('pasaran ' + cur + '/' + total + (s === 'running' || s === 'paused' ? ' — sedang scan' : ''));
      const wc = (typeof warnCount === 'number') ? warnCount : (state && state.warningCount);
      if (typeof wc === 'number' && wc > 0) parts.push(wc + ' user lewat batas');
      if (msg) parts.push(msg);
      if (meta) meta.textContent = parts.join('  •  ') || 'Belum ada scan.';

      // Progress bar (14/63 -> visual + stripe berjalan biar jelas hidup)
      const wrap = document.getElementById('investProgressWrap');
      const bar  = document.getElementById('investProgressBar');
      if (wrap && bar) {
        const show = ['running', 'paused', 'session_expired', 'done', 'error'].indexOf(s) >= 0;
        wrap.style.display = show ? 'block' : 'none';
        const pct = total ? Math.min(100, Math.round(cur / total * 100)) : 0;
        bar.style.background = (s === 'done')
          ? 'linear-gradient(90deg,#34d399,#14b8a6)'
          : (s === 'session_expired' || s === 'error')
            ? 'linear-gradient(90deg,#fb7185,#e11d48)'
            : 'linear-gradient(90deg,#34d399,#22d3ee)';
        if ((s === 'running' || s === 'paused') && (!total || cur === 0)) {
          // Belum ada angka nyata -> bar indeterminate (sapuan) biar tetap "hidup".
          bar.className = 'progress-bar is-loading';
          bar.style.width = '';
        } else {
          bar.className = 'progress-bar' + (s === 'running' ? ' invest-running' : '');
          bar.style.width = (s === 'done' ? 100 : Math.max(pct, s === 'running' ? 4 : 0)) + '%';
        }
      }

      // Tombol MULAI SCAN dikunci + spinner selama scan jalan.
      const startBtn = document.getElementById('investStartBtn');
      if (startBtn) {
        const busy = (s === 'running' || s === 'paused');
        startBtn.disabled = busy;
        startBtn.innerHTML = busy
          ? '<i class="fa-solid fa-circle-notch fa-spin"></i>SEDANG SCAN...'
          : '<i class="fa-solid fa-play"></i>MULAI SCAN';
      }

      if (contBtn) contBtn.style.display = (s === 'session_expired') ? 'inline-flex' : 'none';

      // Session mati -> buka form setting supaya PHPSESSID baru gampang ditempel.
      if (s === 'session_expired') {
        const dbox = document.getElementById('investSettingBox');
        if (dbox) dbox.open = true;
      }

      // Scan sedang jalan -> hasil di kotak PASTI kosong (server sudah/akan
      // dikosongkan). Jadi kalau masih ada kartu sisa scan lama, hapus dulu
      // supaya yang tampil animasi Loading, bukan history lama.
      const list = document.getElementById('investWarningList');
      if (list && (s === 'running' || s === 'paused') && list.dataset.has === '1') {
        list.dataset.has = '0';
        list.innerHTML = '';
      }
      // Selama belum ada hasil, refresh placeholder (angka pasaran X/Y ikut update).
      if (!investHasRows()) investRenderWarnPlaceholder(state);
    }

    // Dipanggil saat MULAI / LANJUTKAN scan: langsung bersihkan tampilan lama &
    // tampilkan Loading + bar 0%, jangan tunggu poll pertama (5 dtk).
    function investBeginScanUI(state) {
      const list = document.getElementById('investWarningList');
      if (list) { list.dataset.has = '0'; list.innerHTML = ''; }
      const meta = document.getElementById('investWarningMeta');
      if (meta) meta.textContent = 'Scan berjalan…';
      renderInvestState(state || { state: 'running', cursor: 0, total: 63 }, 0);
    }

    function startInvestPolling() {
      stopInvestPolling();
      pollInvestStatus();
      // Beberapa poll pertama lebih rapat biar progres kelihatan cepat naik,
      // lalu melambat ke 4 dtk.
      let fast = 4;
      investStatusTimer = setInterval(() => {
        pollInvestStatus();
        if (--fast === 0) {
          clearInterval(investStatusTimer);
          investStatusTimer = setInterval(pollInvestStatus, 4000);
        }
      }, 1800);
    }
    function stopInvestPolling() {
      if (investStatusTimer) { clearInterval(investStatusTimer); investStatusTimer = null; }
    }
    function pollInvestStatus() {
      if (currentPage !== 'invest' || !currentUser) { stopInvestPolling(); return; }
      google.script.run
        .withSuccessHandler(st => {
          renderInvestState(st, st && st.warningCount);
          if (st && ['done','idle','session_expired','error'].indexOf(st.state) >= 0) {
            stopInvestPolling();
            if (st.state === 'done') loadInvestWarnings();
          }
        })
        .withFailureHandler(() => {})
        .investGetStatus(currentSessionToken);
    }

    // "yyyy-MM-dd" -> "07 Sep". Juga menangani sisa data lama bentuk Date string.
    function investFmtDate(v) {
      const s = String(v || '').trim();
      let m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
      let d;
      if (m) d = new Date(+m[1], +m[2] - 1, +m[3]);
      else { d = new Date(s); if (isNaN(d.getTime())) return s; }
      const b = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
      return d.getDate() + ' ' + b[d.getMonth()];
    }

    function investHasRows() {
      const list = document.getElementById('investWarningList');
      return !!(list && list.dataset.has === '1');
    }

    // Placeholder kotak hasil — animasi "sedang scan" biar kalau pindah menu &
    // balik lagi tetap kelihatan Loading, bukan "kosong".
    function investRenderWarnPlaceholder(state) {
      const list = document.getElementById('investWarningList');
      if (!list || list.dataset.has === '1') return;
      const s = (state && state.state) || 'idle';
      const cur = Number(state && state.cursor) || 0;
      const total = Number(state && state.total) || 0;
      if (s === 'running' || s === 'paused') {
        list.innerHTML = `<div class="invest-warn-card" style="border-color:rgba(52,211,153,.2)">
          <div class="invest-scanning">
            <span class="invest-scan-orbit"></span>
            <div>
              <div class="invest-scan-title">Sedang scan pasaran ${cur}/${total || '?'}…</div>
              <div class="invest-scan-sub">Hasil user lewat batas muncul otomatis saat scan selesai. Aman ditinggal / pindah menu.</div>
              <div class="invest-scan-dots"><span></span><span></span><span></span></div>
            </div>
          </div>
        </div>`;
      } else if (s === 'session_expired') {
        list.innerHTML = '<div class="text-center text-rose-300 py-8 text-[11px]">Scan berhenti — session agen expired. Tempel PHPSESSID baru, SIMPAN, lalu LANJUTKAN SCAN.</div>';
      } else {
        list.innerHTML = '<div class="text-center text-slate-500 py-8 text-[11px]">Belum ada hasil scan. Isi setting lalu klik MULAI SCAN.</div>';
      }
    }

    function investDateKey(d) {
      const m = String(d || '').match(/(\d{4})-(\d{2})-(\d{2})/);
      if (m) return m[1] + m[2] + m[3];
      const t = new Date(String(d || ''));
      return isNaN(t.getTime()) ? String(d || '') : ('' + t.getFullYear() + String(t.getMonth() + 1).padStart(2, '0') + String(t.getDate()).padStart(2, '0'));
    }

    function investUserCard(u) {
      const hits = u.hits || [];
      // Kelompokkan per tanggal, urut kronologis (6 Sep dulu, baru 7 Sep).
      const byDate = {};
      hits.forEach(h => { const k = h.tanggal || '?'; (byDate[k] = byDate[k] || []).push(h); });
      const dkeys = Object.keys(byDate).sort((a, b) => investDateKey(a) < investDateKey(b) ? -1 : 1);

      const sections = dkeys.map(dk => {
        const arr = byDate[dk];
        const nPasar = new Set(arr.map(h => h.pasaran)).size;
        const rows = arr.map(h => {
          if (h.error) return `<li class="invest-hit is-err">${escapeHtml(h.pasaran || '-')} — ${escapeHtml(h.error)}</li>`;
          return `<li class="invest-hit">
            <b>${escapeHtml(h.pasaran || '-')}</b> · Periode ${escapeHtml(String(h.periode))} · <span class="ihg">${escapeHtml(String(h.game))}</span>
            <span class="invest-hit-info">( ${escapeHtml(String(h.line))} Line — Lewat Batas, limit ${escapeHtml(String(h.limit))}, +${escapeHtml(String(h.over))} )</span>
          </li>`;
        }).join('');
        return `<div class="invest-date-group">
          <div class="invest-date-head">${escapeHtml(investFmtDate(dk))}<span> · ${nPasar} pasaran</span></div>
          <ul class="invest-hit-list">${rows}</ul>
        </div>`;
      }).join('');

      const badge = Number(u.excess || 0) > 0 ? `+${u.excess} line lewat batas` : `${hits.length} catatan`;
      return `<div class="invest-warn-card">
        <div class="invest-warn-head">
          <span class="invest-warn-user">${escapeHtml(u.user || '-')}</span>
          <span class="invest-warn-badge">${escapeHtml(badge)}</span>
        </div>
        ${sections || '<div class="invest-hit is-err">' + escapeHtml(u.raw || 'tidak ada rincian') + '</div>'}
      </div>`;
    }

    function loadInvestWarnings() {
      const list = document.getElementById('investWarningList');
      const meta = document.getElementById('investWarningMeta');
      if (!list) return;
      google.script.run
        .withSuccessHandler(res => {
          const users = (res && res.users) || [];
          if (meta) meta.textContent = users.length ? (users.length + ' user melebihi batas invest') : 'Belum ada hasil scan.';
          if (!users.length) {
            list.dataset.has = '0';
            investRenderWarnPlaceholder(res && res.state);
          } else {
            list.dataset.has = '1';
            list.innerHTML = users.map(investUserCard).join('');
          }
          renderInvestState(res && res.state, res && res.warningCount);
        })
        .withFailureHandler(() => {})
        .investGetWarnings(currentSessionToken);
    }

    /* ========================= BOT · NEWS ========================= */
    function botEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}

    let botHistoryCache = [];
    // Baris log seragam untuk Riwayat & Log artikel: waktu | judul + keterangan | aksi
    function botLogRow(o){
      return `<div class="bot-log-row">
        <span class="bot-log-t">${botEsc(o.time || '')}</span>
        <div class="bot-log-main">
          ${o.href ? `<a href="${botEsc(o.href)}" target="_blank" class="bot-log-title">${botEsc(o.title)}</a>` : `<span class="bot-log-title">${botEsc(o.title)}</span>`}
          <div class="bot-log-meta">${o.meta || ''}</div>
        </div>
        ${o.side ? `<div class="bot-log-side">${o.side}</div>` : ''}
      </div>`;
    }
    function botHistTab(which){
      document.querySelectorAll('[data-hist]').forEach(b => b.classList.toggle('active', b.dataset.hist === which));
      document.querySelectorAll('[data-hist-pane]').forEach(p => { p.style.display = p.dataset.histPane === which ? '' : 'none'; });
    }
    function renderBotHistory(){
      const box = document.getElementById('botHistoryList');
      const cnt = document.getElementById('botHistCount');
      if (!box) return;
      const q = (document.getElementById('botHistSearch')||{}).value || '';
      const ql = q.toLowerCase();
      const rows = botHistoryCache.filter(h => !ql || String(h.title||'').toLowerCase().includes(ql));
      if (cnt) cnt.textContent = botHistoryCache.length + (q ? ' · ' + rows.length : '');
      box.innerHTML = rows.map(h => botLogRow({
        time: String(h.posted_at||'').slice(0,16).replace('T',' '), href: h.post_url, title: h.title,
        meta: botEsc(h.source) + ' · <a href="' + botEsc(h.url) + '" target="_blank">sumber asli</a>',
      })).join('') || '<div class="bot-empty">Belum ada postingan.</div>';
    }

    let botSiteHistoryCache = [];
    let botSiteUrl = '';
    function renderBotSiteHistory(){
      const box = document.getElementById('botSiteHistoryList');
      const cnt = document.getElementById('botSiteHistCount');
      if (!box) return;
      const q = (document.getElementById('botSiteHistSearch')||{}).value || '';
      const ql = q.toLowerCase();
      const rows = botSiteHistoryCache.filter(h => !ql || String(h.title||'').toLowerCase().includes(ql));
      if (cnt) cnt.textContent = botSiteHistoryCache.length + (q ? ' · ' + rows.length : '');
      box.innerHTML = rows.map(h => botLogRow({
        time: String(h.site_posted_at||'').slice(0,16).replace('T',' '),
        href: botSiteUrl ? botSiteUrl + '/berita/artikel/?id=' + Number(h.id) : '', title: h.title,
        meta: botEsc(h.source) + ' · ' + botEsc(h.category||'umum') + ' · <a href="' + botEsc(h.url) + '" target="_blank">sumber asli</a>',
      })).join('') || '<div class="bot-empty">Belum ada postingan.</div>';
    }

    function renderBotSubpage(page){
      BOT_PAGES.forEach(p => {
        const el = document.getElementById('bot-sec-' + p.replace('bot-', ''));
        if (el) el.style.display = (p === page) ? 'flex' : 'none';
      });
      // Semua sub-halaman BOT memakai snapshot yang sama: pindah tab tidak perlu
      // menarik ulang 6 query Turso kalau datanya baru dimuat (<20 dtk).
      if (Date.now() - pageFetchedAt.bot > 20000) loadBotNews();
      if (page === 'bot-config') {
        let tab = 'ai';
        try { tab = localStorage.getItem('kd_bot_cfg_tab') || 'ai'; } catch (e) {}
        switchBotCfgTab(tab);
      }
      if (page === 'bot-dashboard') loadBotAi(false);
    }

    /* ===== Setting BOT: 5 tab (AI Provider, Konten, Jadwal, Blogger, Sosial) ===== */
    const BOT_CFG_TABS = ['ai','content','schedule','blogger','social'];
    function switchBotCfgTab(tab) {
      if (BOT_CFG_TABS.indexOf(tab) < 0) tab = 'ai';
      try { localStorage.setItem('kd_bot_cfg_tab', tab); } catch (e) {}
      document.querySelectorAll('#botCfgTabs .admin-tab').forEach(t => t.classList.toggle('active', t.dataset.cfgTab === tab));
      document.querySelectorAll('#bot-sec-config .bot-cfg-panel').forEach(p => p.classList.toggle('active', p.dataset.cfgPanel === tab));
      const sel = document.getElementById('botCfgTabSelect');
      if (sel && sel.value !== tab) sel.value = tab;
      // AI Provider menyimpan per provider (tombol di tiap kartu); tab lain lewat SIMPAN SETTING.
      const bar = document.getElementById('botCfgSaveBar');
      if (bar) bar.hidden = tab === 'ai';
      if (tab === 'ai') loadBotAi(false);
    }

    /* ===== AI Provider: daftar base URL + key + model, urutan = prioritas ===== */
    let botAiData = null;
    let botAiFetchedAt = 0;
    const fmtTok = n => Number(n || 0).toLocaleString('id-ID');
    const fmtTokShort = n => {
      n = Number(n || 0);
      if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 0 : 1).replace('.', ',') + ' M';
      if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace('.', ',') + ' jt';
      if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace('.', ',') + ' rb';
      return String(n);
    };
    const AI_STATE_LABEL = { active: ['Aktif', 'ok'], disabled: ['Nonaktif', 'off'], expired: ['Masa aktif habis', 'bad'], exhausted: ['Kuota habis', 'bad'], incomplete: ['Belum lengkap', 'warn'] };
    const AI_PRESETS = {
      dattio: { name: 'DattioAI', base: 'https://bandelbanget.xyz/v1', model: 'deepseek-v4-flash', days: '28' },
      groq: { name: 'Groq', base: 'https://api.groq.com/openai/v1', model: 'llama-3.3-70b-versatile', days: '' },
      gemini: { name: 'Gemini', base: 'https://generativelanguage.googleapis.com/v1beta/openai', model: 'gemini-flash-latest', days: '' },
      openrouter: { name: 'OpenRouter', base: 'https://openrouter.ai/api/v1', model: '', days: '' },
      deepseek: { name: 'DeepSeek', base: 'https://api.deepseek.com/v1', model: 'deepseek-chat', days: '' },
      modelark: { name: 'ModelArk', base: 'https://ark.ap-southeast.bytepluses.com/api/v3', model: '', days: '' }
    };
    const hostOf = u => { try { return new URL(u).host; } catch (e) { return u || '-'; } };
    const shortDate = d => { if (!d) return ''; const p = String(d).slice(0, 10).split('-'); const m = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][Number(p[1]) - 1] || ''; return Number(p[2]) + ' ' + m + ' ' + p[0]; };

    let botAiLoading = false;
    function loadBotAi(force) {
      if (!currentUser) return;
      if (botAiData) renderBotAi(botAiData);
      if (botAiLoading || (!force && botAiData && Date.now() - botAiFetchedAt < 15000)) return;
      botAiLoading = true;
      google.script.run
        .withSuccessHandler(res => { botAiLoading = false; if (apiFailed(res)) { toast(apiMessage(res, 'Gagal memuat AI provider')); return; } applyBotAi(res); })
        .withFailureHandler(e => { botAiLoading = false; toast('AI provider: ' + ((e && e.message) || e)); })
        .botAiList(currentSessionToken);
    }
    function applyBotAi(res) {
      botAiData = res;
      botAiFetchedAt = Date.now();
      renderBotAi(res);
    }

    function aiQuotaLine(p) {
      if (p.quota > 0) {
        const tone = p.pctUsed >= 90 ? 'bad' : p.pctUsed >= 70 ? 'warn' : 'ok';
        return `<div class="ai-meter ai-meter-${tone}"><span style="width:${Math.min(100, p.pctUsed)}%"></span></div>
          <div class="ai-meter-text"><b>${fmtTok(p.used)}</b> / ${fmtTok(p.quota)} token terpakai · sisa <b>${fmtTok(p.remaining)}</b> (${String(p.pctUsed).replace('.', ',')}%)</div>`;
      }
      return `<div class="ai-meter-text"><b>${fmtTok(p.used)}</b> token terpakai · tanpa batas kuota di panel</div>`;
    }

    function renderBotAi(res) {
      const list = (res && res.providers) || [];
      const active = list.find(p => p.id === res.active_id);
      const sum = document.getElementById('botAiSummary');
      if (sum) {
        sum.innerHTML = `
          <div class="ai-stat"><span>Dipakai sekarang</span><b>${active ? escapeHtml(active.name) : '—'}</b><em>${active ? escapeHtml(botAiModelsOf(active)[0] || '') + (botAiModelsOf(active).length > 1 ? ' +' + (botAiModelsOf(active).length - 1) + ' cadangan' : '') : 'tidak ada provider aktif'}</em></div>
          <div class="ai-stat"><span>Token hari ini</span><b>${fmtTokShort(res.totals && res.totals.today)}</b><em>${fmtTok(res.totals && res.totals.today)} token</em></div>
          <div class="ai-stat"><span>Total terpakai</span><b>${fmtTokShort(res.totals && res.totals.used)}</b><em>${fmtTok(res.totals && res.totals.calls)} panggilan</em></div>
          <div class="ai-stat"><span>Provider aktif</span><b>${list.filter(p => p.usable).length} / ${list.length}</b><em>${active && active.quota > 0 ? 'sisa ' + fmtTokShort(active.remaining) + ' token' : 'urutan = prioritas'}</em></div>`;
      }
      const box = document.getElementById('botAiList');
      if (box) {
        box.innerHTML = list.length ? list.map((p, i) => {
          const st = AI_STATE_LABEL[p.state] || ['?', 'warn'];
          const using = p.id === res.active_id;
          const expiry = p.expiresAt ? (p.expired ? 'Masa aktif habis ' + shortDate(p.expiresAt) : 'Aktif s/d ' + shortDate(p.expiresAt) + ' · ' + p.daysLeft + ' hari lagi') : 'Tanpa masa aktif';
          const warn = p.warn ? `<div class="ai-note ai-note-warn"><i class="fa-solid fa-triangle-exclamation"></i>${escapeHtml(p.warn)}</div>` : '';
          const err = p.last_error ? `<div class="ai-note ai-note-bad"><i class="fa-solid fa-circle-exclamation"></i>Gagal terakhir ${escapeHtml(String(p.last_error_at).slice(5, 16))}: ${escapeHtml(p.last_error)}</div>` : '';
          const coolingSome = !p.cooldown_until && p.cooling_models && p.cooling_models.length ? `<div class="ai-note ai-note-warn"><i class="fa-solid fa-hourglass-half"></i>Dilewati sementara: ${p.cooling_models.map(c => escapeHtml(c.model) + ' (s/d ' + escapeHtml(new Date(c.until).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })) + ')').join(', ')} — bot memakai model berikutnya.</div>` : '';
          const cd = p.cooldown_until ? `<div class="ai-note ai-note-warn"><i class="fa-solid fa-hourglass-half"></i>Dilewati bot sampai ${escapeHtml(new Date(p.cooldown_until).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }))} karena error sementara. Ganti model / klik Tes kalau sudah beres.</div>` : '';
          return `<div class="ai-card${using ? ' is-using' : ''}${p.usable ? '' : ' is-off'}">
            <div class="ai-card-head">
              <span class="ai-rank">${i + 1}</span>
              <div class="min-w-0 flex-1">
                <div class="ai-name">${escapeHtml(p.name)} ${using ? '<span class="ai-using"><i class="fa-solid fa-bolt"></i>Dipakai sekarang</span>' : ''}</div>
                <div class="ai-sub">${botAiModelsOf(p).map(m => '<code>' + escapeHtml(m) + '</code>').join(' → ')} · ${escapeHtml(hostOf(p.base_url))} · key <code>${escapeHtml(p.key_mask || '-')}</code></div>
              </div>
              <span class="ai-pill ai-pill-${st[1]}">${st[0]}</span>
            </div>
            ${aiQuotaLine(p)}
            <div class="ai-facts"><span><i class="fa-regular fa-calendar"></i>${escapeHtml(expiry)}</span><span><i class="fa-solid fa-sun"></i>Hari ini ${fmtTok(p.today_tokens)} token · ${fmtTok(p.today_calls)}x</span><span><i class="fa-solid fa-signal"></i>${fmtTok(p.calls)} panggilan${p.failed ? ' · ' + fmtTok(p.failed) + ' gagal' : ''}${p.estimated_calls ? ' · ≈' + fmtTok(p.estimated_calls) + ' perkiraan' : ''}</span></div>
            ${warn}${cd}${coolingSome}${err}
            <div class="ai-actions">
              <button type="button" onclick="botAiMove(${jsArg(p.id)},-1)" ${i === 0 ? 'disabled' : ''} title="Naikkan prioritas" aria-label="Naikkan prioritas"><i class="fa-solid fa-arrow-up"></i></button>
              <button type="button" onclick="botAiMove(${jsArg(p.id)},1)" ${i === list.length - 1 ? 'disabled' : ''} title="Turunkan prioritas" aria-label="Turunkan prioritas"><i class="fa-solid fa-arrow-down"></i></button>
              <button type="button" onclick="botAiMove(${jsArg(p.id)},-999)" ${i === 0 ? 'disabled' : ''}><i class="fa-solid fa-star"></i>Utamakan</button>
              <button type="button" onclick="botAiTest(${jsArg(p.id)})"><i class="fa-solid fa-stethoscope"></i>Tes</button>
              <button type="button" onclick="botAiToggle(${jsArg(p.id)})"><i class="fa-solid fa-power-off"></i>${p.enabled ? 'Matikan' : 'Aktifkan'}</button>
              <button type="button" onclick="botAiTopUp(${jsArg(p.id)})"><i class="fa-solid fa-circle-plus"></i>Top-up</button>
              <button type="button" onclick="botAiOpenForm(${jsArg(p.id)})"><i class="fa-solid fa-pen"></i>Edit</button>
              <button type="button" class="is-danger" onclick="botAiDelete(${jsArg(p.id)})"><i class="fa-solid fa-trash"></i>Hapus</button>
            </div>
          </div>`;
        }).join('') : '<div class="ai-empty"><i class="fa-solid fa-microchip"></i>Belum ada AI provider. Klik <b>Tambah Provider</b> lalu isi Base URL, API key, dan model.</div>';
      }
      const body = document.getElementById('botAiUsageBody');
      if (body) {
        const rows = (res && res.recent) || [];
        body.innerHTML = rows.length ? rows.map(u => `<tr>
          <td class="whitespace-nowrap">${escapeHtml(String(u.ts).slice(5, 16))}</td>
          <td>${escapeHtml(u.provider || '-')}</td>
          <td><code>${escapeHtml(u.model || '-')}</code></td>
          <td>${escapeHtml(({ 'news-rewrite': 'Artikel', 'fb-caption': 'Caption FB', 'fb-template': 'Template FB', test: 'Tes koneksi' })[u.purpose] || u.purpose || '-')}</td>
          <td class="text-right whitespace-nowrap">${u.estimated ? '≈' : ''}${fmtTok(u.total)}</td>
          <td>${u.ok ? '<span class="ai-pill ai-pill-ok">OK</span>' : `<span class="ai-pill ai-pill-bad" title="${escapeHtml(u.err)}">Gagal</span>`}</td>
        </tr>`).join('') : '<tr><td colspan="6" class="table-empty-cell"><span class="table-empty-inner">Belum ada pemakaian.</span></td></tr>';
      }
      renderBotAiDash(res);
    }

    // Kartu ringkas di Dashboard BOT -- langsung terlihat begitu login.
    function renderBotAiDash(res) {
      const card = document.getElementById('botAiDashCard');
      if (!card) return;
      const list = (res && res.providers) || [];
      const active = list.find(p => p.id === res.active_id);
      card.hidden = false;
      const warnP = list.find(p => p.warn && p.state !== 'disabled');
      card.className = 'ai-dash-card' + (!active ? ' is-bad' : warnP ? ' is-warn' : '');
      card.innerHTML = `
        <div class="ai-dash-icon"><i class="fa-solid fa-microchip"></i></div>
        <div class="min-w-0 flex-1">
          <div class="ai-dash-title">${active ? 'AI: ' + escapeHtml(active.name) + ' <code>' + escapeHtml(botAiModelsOf(active)[0] || '') + '</code>' + (botAiModelsOf(active).length > 1 ? ' <span class="text-[11px] text-slate-400">+' + (botAiModelsOf(active).length - 1) + ' model cadangan</span>' : '') : 'Tidak ada AI provider aktif — bot tidak bisa menulis artikel'}</div>
          <div class="ai-dash-sub">Hari ini <b>${fmtTok(res.totals && res.totals.today)}</b> token · total <b>${fmtTok(res.totals && res.totals.used)}</b>${active && active.quota > 0 ? ' · sisa kuota <b>' + fmtTok(active.remaining) + '</b>' : ''}${active && active.expiresAt ? ' · aktif s/d ' + shortDate(active.expiresAt) : ''}${warnP ? ' · <span class="text-amber-300">' + escapeHtml(warnP.name + ': ' + warnP.warn) + '</span>' : ''}</div>
          ${active && active.quota > 0 ? `<div class="ai-meter ai-meter-${active.pctUsed >= 90 ? 'bad' : active.pctUsed >= 70 ? 'warn' : 'ok'} mt-2"><span style="width:${Math.min(100, active.pctUsed)}%"></span></div>` : ''}
        </div>
        <button type="button" class="btn-secondary text-xs font-bold px-4 py-2.5 rounded-xl shrink-0" onclick="switchPage('bot-config');switchBotCfgTab('ai')"><i class="fa-solid fa-gear mr-1.5"></i>Kelola</button>`;
    }

    function botAiCall(method, data, okMsg, btn) {
      if (btn) btn.disabled = true;
      google.script.run
        .withSuccessHandler(res => {
          if (btn) btn.disabled = false;
          if (apiFailed(res)) { toast(apiMessage(res, 'Gagal')); return; }
          applyBotAi(res);
          if (okMsg) toast(okMsg);
        })
        .withFailureHandler(e => { if (btn) btn.disabled = false; toast((e && e.message) || String(e)); })
        [method](currentSessionToken, data);
    }

    function botAiModelsOf(p) {
      if (!p) return [];
      return p.models && p.models.length ? p.models : String(p.model || '').split(',').map(x => x.trim()).filter(Boolean);
    }
    let botAiPickerModels = [];
    function botAiChainGet() {
      const el = document.getElementById('botAiModel');
      return String(el ? el.value : '').split(',').map(x => x.trim()).filter(Boolean);
    }
    function botAiChainSet(list) {
      const out = [];
      list.forEach(m => { m = String(m || '').trim(); if (m && !out.includes(m)) out.push(m); });
      document.getElementById('botAiModel').value = out.slice(0, 10).join(', ');
      renderBotAiChain();
      renderBotAiPicker();
    }
    function botAiChainAddTyped() {
      const el = document.getElementById('botAiModelAdd');
      const add = String(el.value || '').split(',').map(x => x.trim()).filter(Boolean);
      if (!add.length) return;
      const cur = botAiChainGet();
      if (cur.length + add.filter(m => !cur.includes(m)).length > 10) { toast('Maksimal 10 model per provider'); return; }
      botAiChainSet(cur.concat(add));
      el.value = '';
    }
    function botAiChainMove(i, dir) {
      const cur = botAiChainGet();
      const j = i + dir;
      if (j < 0 || j >= cur.length) return;
      [cur[i], cur[j]] = [cur[j], cur[i]];
      botAiChainSet(cur);
    }
    function botAiChainRemove(i) {
      const cur = botAiChainGet();
      cur.splice(i, 1);
      botAiChainSet(cur);
    }
    function botAiChainToggle(m) {
      const cur = botAiChainGet();
      const i = cur.indexOf(m);
      if (i >= 0) cur.splice(i, 1);
      else if (cur.length >= 10) { toast('Maksimal 10 model per provider'); return; }
      else cur.push(m);
      botAiChainSet(cur);
    }
    function renderBotAiChain() {
      const box = document.getElementById('botAiChain');
      if (!box) return;
      const cur = botAiChainGet();
      box.innerHTML = cur.length ? cur.map((m, i) => `<div class="ai-chain-item">
          <b>${i + 1}</b><code title="${escapeHtml(m)}">${escapeHtml(m)}</code>
          <button type="button" onclick="botAiChainMove(${i},-1)" ${i === 0 ? 'disabled' : ''} title="Naikkan" aria-label="Naikkan"><i class="fa-solid fa-arrow-up"></i></button>
          <button type="button" onclick="botAiChainMove(${i},1)" ${i === cur.length - 1 ? 'disabled' : ''} title="Turunkan" aria-label="Turunkan"><i class="fa-solid fa-arrow-down"></i></button>
          <button type="button" onclick="botAiChainRemove(${i})" title="Hapus" aria-label="Hapus model"><i class="fa-solid fa-xmark"></i></button>
        </div>`).join('') : '<div class="ai-chain-empty">Belum ada model. Ketik nama model, atau klik "Ambil daftar model".</div>';
    }
    function renderBotAiPicker() {
      const list = document.getElementById('botAiPickerList');
      if (!list || !botAiPickerModels.length) return;
      const q = String((document.getElementById('botAiPickerSearch') || {}).value || '').trim().toLowerCase();
      const cur = botAiChainGet();
      const shown = botAiPickerModels.filter(m => !q || m.toLowerCase().includes(q));
      list.innerHTML = shown.length
        ? shown.map(m => `<button type="button" class="${cur.includes(m) ? 'is-on' : ''}" onclick="botAiChainToggle(${jsArg(m)})" title="${escapeHtml(m)}">${cur.includes(m) ? '<i class="fa-solid fa-check mr-1"></i>' : ''}${escapeHtml(m)}</button>`).join('')
        : '<span class="text-[11px] text-slate-400">Tidak ada model yang cocok.</span>';
    }
    function botAiFetchModels() {
      const g = id => String((document.getElementById(id) || {}).value || '').trim();
      const data = { id: g('botAiId'), base_url: g('botAiBase'), key: g('botAiKey') };
      if (!data.base_url) { toast('Isi Base URL dulu'); return; }
      if (!data.id && !data.key) { toast('Isi API key dulu'); return; }
      const btn = document.getElementById('botAiFetchBtn');
      if (btn) btn.disabled = true;
      google.script.run
        .withSuccessHandler(res => {
          if (btn) btn.disabled = false;
          if (apiFailed(res)) { toast(apiMessage(res, 'Gagal mengambil daftar model')); return; }
          botAiPickerModels = res.models || [];
          const dl = document.getElementById('botAiModelList');
          if (dl) dl.innerHTML = botAiPickerModels.map(m => `<option value="${escapeHtml(m)}">`).join('');
          const picker = document.getElementById('botAiPicker');
          if (picker) picker.hidden = false;
          renderBotAiPicker();
          toast(botAiPickerModels.length + ' model ditemukan — klik untuk menambah ke urutan');
        })
        .withFailureHandler(e => { if (btn) btn.disabled = false; toast((e && e.message) || String(e)); })
        .botAiModels(currentSessionToken, data);
    }
    function botAiOpenForm(id) {
      const p = id && botAiData ? (botAiData.providers || []).find(x => x.id === id) : null;
      const form = document.getElementById('botAiForm');
      if (!form) return;
      const v = (eid, val) => { const el = document.getElementById(eid); if (el) { if (el.type === 'checkbox') el.checked = !!val; else el.value = val == null ? '' : val; } };
      v('botAiId', p ? p.id : '');
      v('botAiName', p ? p.name : '');
      v('botAiBase', p ? p.base_url : '');
      v('botAiKey', '');
      v('botAiModel', p ? botAiModelsOf(p).join(', ') : '');
      v('botAiModelAdd', '');
      botAiPickerModels = [];
      const picker = document.getElementById('botAiPicker');
      if (picker) picker.hidden = true;
      renderBotAiChain();
      v('botAiQuota', p && p.quota ? p.quota : '');
      v('botAiActivated', p ? p.activated : '');
      v('botAiDays', p && p.valid_days ? p.valid_days : '');
      v('botAiAdjust', p && p.used_adjust ? p.used_adjust : '');
      v('botAiEnabled', p ? p.enabled : true);
      document.getElementById('botAiKey').placeholder = p ? 'kosongkan = tetap pakai key lama (' + (p.key_mask || '-') + ')' : 'sk-...';
      document.getElementById('botAiFormTitle').innerHTML = p ? '<i class="fa-solid fa-pen text-emerald-300"></i>Edit ' + escapeHtml(p.name) : '<i class="fa-solid fa-plus text-emerald-300"></i>Tambah Provider';
      const more = form.querySelector('details');
      if (more) more.open = !!(p && (p.quota || p.valid_days));
      form.hidden = false;
      form.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      document.getElementById(p ? 'botAiModelAdd' : 'botAiName').focus();
    }
    function botAiCloseForm() { const f = document.getElementById('botAiForm'); if (f) f.hidden = true; }
    function botAiPreset(key) {
      const pr = AI_PRESETS[key];
      if (!pr) return;
      document.getElementById('botAiName').value = pr.name;
      document.getElementById('botAiBase').value = pr.base;
      if (pr.model && !botAiChainGet().length) botAiChainSet([pr.model]);
      if (pr.days) {
        document.getElementById('botAiDays').value = pr.days;
        if (!document.getElementById('botAiActivated').value) document.getElementById('botAiActivated').value = new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
        const more = document.querySelector('#botAiForm details');
        if (more) more.open = true;
      }
      document.getElementById('botAiKey').focus();

    async function botFbTplCopyImage(){
      if (!botFbTplLastImageUrl) { toast('Tidak ada gambar untuk disalin'); return; }
      try {
        const resp = await fetch('/img?url=' + encodeURIComponent(botFbTplLastImageUrl));
        if (!resp.ok) throw new Error('gagal ambil gambar (status ' + resp.status + ')');
        const blob = await resp.blob();
        if (!blob.type.startsWith('image/')) throw new Error('server tidak mengembalikan gambar (' + (blob.type||'tipe tidak diketahui') + ')');
        const pngBlob = blob.type === 'image/png' ? blob : await new Promise((resolve, reject) => {
          const imgEl = new Image();
          imgEl.onload = () => {
            const cnv = document.createElement('canvas');
            cnv.width = imgEl.naturalWidth; cnv.height = imgEl.naturalHeight;
            cnv.getContext('2d').drawImage(imgEl, 0, 0);
            cnv.toBlob(b => b ? resolve(b) : reject(new Error('gagal konversi gambar')), 'image/png');
          };
          imgEl.onerror = () => reject(new Error('gagal muat gambar'));
          imgEl.src = URL.createObjectURL(blob);
        });
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob })]);
        toast('Gambar disalin — tinggal paste (Ctrl+V) ke Facebook');
      } catch (e) {
        toast('Gagal salin gambar: ' + ((e && e.message) || e) + ' — coba klik "buka gambar asli" lalu klik-kanan > Copy Image');
      }
    }

    // Tombol lama "PROSES KE BLOGGER"/"PROSES KE SITUS SENDIRI" (sinkron,
    // dibatasi maks 5 artikel/klik krn limit Cloudflare) sudah dihapus dari
    // UI -- satu-satunya jalur manual sekarang lewat GitHub (botNewsRunGithub
    // di bawah), tidak kena limit itu sama sekali.
    var botGithubPollTimer = null;
    var botGithubLastSeenRunId = null; // run id 'completed' terakhir yang SUDAH ditampilkan -- cegah re-tampil/re-refresh berulang tiap loadBotNews() dipanggil (dulu bikin loop tak terhenti, lihat botGithubPollStatus)
    function botGithubProgressShow(label, pct){
      var box = document.getElementById('botGithubProgress');
      var bar = document.getElementById('botGithubProgressBar');
      var lbl = document.getElementById('botGithubProgressLabel');
      if(!box||!bar||!lbl) return;
      box.classList.remove('hidden');
      bar.style.width = pct+'%';
      lbl.innerHTML = '<i class="fa-brands fa-github mr-1.5"></i>'+label;

    function botGithubProgressLink(url){
      var a = document.getElementById('botGithubProgressLink');
      if(a) a.href = url || '#';
    }
    function botGithubProgressHideSoon(){
      setTimeout(function(){
        var box = document.getElementById('botGithubProgress');
        if(box) box.classList.add('hidden');
      }, 6000);
    }
    // Poll status run TERBARU workflow news-turbo.yml tiap 4 detik, sampai
    // selesai (completed) atau 5 menit berlalu (batas aman -- jangan poll
    // selamanya kalau ada yang aneh). Dipakai baik setelah klik tombol
    // MAUPUN otomatis sekali tiap buka Dashboard (lihat loadBotNews), biar
    // kelihatan juga status run OTOMATIS tiap 10 menit tanpa perlu diklik.
    function botGithubPollStatus(maxMs){
      if(botGithubPollTimer){ clearTimeout(botGithubPollTimer); botGithubPollTimer=null; }
      var deadline = Date.now() + (maxMs || 5*60*1000);
      function tick(){
        google.script.run.withSuccessHandler(function(r){
          var run = r && r.run;
          if(!run){ return; } // belum pernah ada run sama sekali -- diam saja
          botGithubProgressLink(run.htmlUrl);
          if(run.status === 'completed'){
            // PENTING: sudah pernah dilaporkan run id ini sebelumnya (mis. kita
            // baru sekadar buka Dashboard, bukan baru saja memicu run) -> diam
            // saja, JANGAN tampilkan/refresh lagi. Sebelumnya di sini manggil
            // loadBotNews(), yang mana MEMANGGIL LAGI botGithubPollStatus() ->
            // lihat status 'completed' lagi -> panggil loadBotNews() lagi ->
            // ...tanpa henti (itu sumber kedap-kedipnya, bukan cuma kosmetik,
            // benar2 loop rekursif tanpa jeda).
            if (botGithubLastSeenRunId === run.id) return;
            botGithubLastSeenRunId = run.id;
            var ok = run.conclusion === 'success';
            botGithubProgressShow((ok?'Selesai (run #'+run.runNumber+')':'Gagal (run #'+run.runNumber+', cek log GitHub)'), 100);
            botGithubProgressHideSoon();
            // Refresh angka dashboard TANPA lewat loadBotNews() (itu yang
            // memicu poll ini lagi) -- panggil botNewsStatus langsung.
            google.script.run.withSuccessHandler(applyBotNews).withFailureHandler(function(){}).botNewsStatus(currentSessionToken);
            if(!ok) toast('Run GitHub Actions terakhir gagal -- cek tab Actions di GitHub.');
            return; // berhenti poll, sudah selesai
          }
          botGithubLastSeenRunId = null; // masih berjalan -- kalau nanti selesai, anggap baru lagi (biar dilaporkan)
          botGithubProgressShow(run.status==='queued' ? 'Antre di GitHub...' : 'Sedang diproses di GitHub...', run.status==='queued'?20:65);
          if(Date.now() < deadline){ botGithubPollTimer = setTimeout(tick, 4000); }
        }).withFailureHandler(function(){ /* diam -- jangan ganggu dashboard cuma krn polling gagal sesekali */ }).botNewsGithubRunStatus(currentSessionToken);
      }
      tick();
    }

        closeActionPopup();

    function cancelEditLivechatTemplate() {
      document.getElementById('livechatTplId').value = '';
      document.getElementById('livechatTplSort').value = '0';
      document.getElementById('livechatTplReply').value = '';
      document.getElementById('livechatTplFormTitle').innerHTML = '<i class="fa-solid fa-plus text-emerald-300"></i>Tambah Balasan';
      document.getElementById('livechatTplSaveLabel').textContent = 'Tambah Balasan';
      document.getElementById('livechatTplCancelBtn').style.display = 'none';
    }

    function saveLivechatTemplate() {
      const id = document.getElementById('livechatTplId').value;
      const replyText = document.getElementById('livechatTplReply').value.trim();
      if (!replyText) { toast('Isi balasan wajib diisi'); return; }
      const data = {
        id: id ? Number(id) : undefined,
        sortOrder: Number(document.getElementById('livechatTplSort').value) || 0,
        replyText: replyText,
      };
      google.script.run.withSuccessHandler(r => {
        if (!r || r.success === false) { toast((r && r.message) || 'Gagal menyimpan balasan'); return; }
        toast('Balasan disimpan');
        livechatTemplatesCache = r.templates || [];
        renderLivechatTemplates();
        cancelEditLivechatTemplate();
      }).withFailureHandler(e => toast((e && e.message) || String(e))).livechatSaveTemplate(currentSessionToken, data);
    }

    function deleteLivechatTemplate(id) {
      if (!confirm('Hapus balasan ini?')) return;
      google.script.run.withSuccessHandler(r => {
        if (!r || r.success === false) { toast((r && r.message) || 'Gagal menghapus balasan'); return; }
        toast('Balasan dihapus');
        livechatTemplatesCache = r.templates || [];
        renderLivechatTemplates();
      }).withFailureHandler(e => toast((e && e.message) || String(e))).livechatDeleteTemplate(currentSessionToken, Number(id));
    }
  </script>
